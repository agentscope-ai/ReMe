name: CI / macOS sandbox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seatbelt:
    name: Seatbelt - ${{ matrix.toolchain }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clt, xcode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure selected developer tools
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          if [[ "$TOOLCHAIN" == xcode ]]; then
            # Hosted images commonly use a symlink named Xcode.app. Test the
            # real standard installation supported by the sandbox's contract.
            selected=$(/usr/bin/env -u DEVELOPER_DIR /usr/bin/xcode-select -p)
            app=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "${selected%/Contents/Developer}")
            [[ "$app" == /Applications/*.app ]]
            [[ -x "$app/Contents/Developer/usr/bin/git" ]]
            if [[ -L /Applications/Xcode.app ]]; then
              sudo unlink /Applications/Xcode.app
            fi
            if [[ "$app" != /Applications/Xcode.app ]]; then
              # Fail rather than overwrite any existing real installation.
              [[ ! -e /Applications/Xcode.app ]]
              sudo mv "$app" /Applications/Xcode.app
            fi
            developer=/Applications/Xcode.app/Contents/Developer
            [[ -f /Applications/Xcode.app/Contents/Frameworks/libxcodebuildLoader.dylib ]]
            [[ -f /Applications/Xcode.app/Contents/version.plist ]]
          else
            developer=/Library/Developer/CommandLineTools
          fi
          sudo /usr/bin/xcode-select --switch "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          /usr/bin/env -i /usr/bin/xcode-select -p
          /usr/bin/env -i /usr/bin/git --version
          "$developer/usr/bin/git" --version
          # Require real Seatbelt and a GUI launchd domain for process cleanup
          # tests; missing infrastructure must fail this job, not skip tests.
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
          /bin/launchctl print "gui/$(id -u)" > /dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e reme_studio -e '.[dev,as]'
          python -m pip install 'safecmd>=0.1.16,<0.2' shfmt-py
          python -m pip install --no-deps -e plugins/home

      - name: Run sandbox and executor regressions
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: 'false'
        run: |
          python -m pytest \
            tests/unit/test_file_sandbox_backend.py \
            tests/unit/test_sandbox_startup_cancellation.py \
            tests/unit/test_local_backend.py \
            tests/unit/test_path_bubble_backend.py \
            plugins/home/tests/test_auto_bash.py \
            tests/integration/test_seatbelt_backend.py \
            plugins/home/tests/test_auto_bash_seatbelt.py \
            -v --tb=long --junitxml=macos-sandbox-results.xml
