name: Sync AgentScope with QwenPaw

on:
  schedule:
    - cron: "30 1 * * *" # 09:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-qwenpaw-agentscope
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch QwenPaw's dependency declaration
        run: curl --fail --location --silent --show-error --retry 3 https://raw.githubusercontent.com/agentscope-ai/QwenPaw/main/pyproject.toml --output "$RUNNER_TEMP/qwenpaw-pyproject.toml"
      - name: Sync AgentScope pin
        run: |
          python -m pip install packaging
          python scripts/sync_qwenpaw_agentscope.py "$RUNNER_TEMP/qwenpaw-pyproject.toml" pyproject.toml
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: pyproject.toml
          branch: automation/sync-qwenpaw-agentscope
          delete-branch: true
          commit-message: "chore(deps): sync AgentScope with QwenPaw"
          title: "chore(deps): sync AgentScope with QwenPaw"
          body: "Align ReMe's AgentScope pin with the exact stable version in QwenPaw's main-branch pyproject.toml."
