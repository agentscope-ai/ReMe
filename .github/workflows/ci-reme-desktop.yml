name: CI / ReMe Desktop

on:
  push:
    branches: [main]
    paths:
      - "reme_desktop/**"
      - "assets/remy/**"
      - ".github/workflows/ci-reme-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "reme_desktop/**"
      - "assets/remy/**"
      - ".github/workflows/ci-reme-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop checks (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reme_desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: reme_desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:dev
      - run: npm run pack -- --config.electronDist=node_modules/electron/dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:packaged
