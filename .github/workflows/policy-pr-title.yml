name: Policy / PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            refactor
            test
            chore
            perf
            style
            build
            revert
          requireScope: false
          scopePattern: ^[a-z0-9_-]+$
          scopePatternError: |
            The scope must contain only lowercase letters, numbers, hyphens, and underscores.
            Example: "feat(memory): add redis cache support"
          validateSingleCommit: false
          ignoreLabels: |
            ignore-semantic-pull-request
