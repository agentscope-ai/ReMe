name: Deploy / Documentation

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "docs/**"
      - "reme/config/default.yaml"
      - "integrations/claude_code/README.md"
      - "integrations/hermes_agent/README.md"
      - "README.md"
      - "README_ZH.md"
      - "reme_studio/README*.md"
      - "reme_studio/public/og.jpg"
      - "integrations/dsh/README*.md"
      - "integrations/dsh/figures/**"
      - "integrations/openclaw/README*.md"
      - "plugins/*/README*.md"
      - "benchmark/*/README*.md"
      - "benchmark/toolmemory/gitcha.png"
      - "AGENTS.md"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/_build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    uses: ./.github/workflows/_build-docs.yml
    with:
      run_tests: true
      upload_pages_artifact: true
    permissions:
      contents: read
      pages: write
      id-token: write

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
