name: _Build Python packages

on:
  workflow_call:
    inputs:
      expected_version:
        description: Expected release version; omit for a consistency-only check
        required: false
        default: ''
        type: string
      upload_artifacts:
        description: Upload distributions for later publish jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging pytest twine

      - name: Validate package versions
        if: inputs.expected_version == ''
        run: python scripts/bump_version.py --check

      - name: Validate release version
        if: inputs.expected_version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python scripts/bump_version.py --check --expected-version "${EXPECTED_VERSION}"

      - name: Run package tests
        run: PYTHONPATH=. python -m pytest tests/unit/test_package_versions.py -q

      - name: Build and check distributions
        run: |
          mkdir -p dist/reme
          python -m build --outdir dist/reme
          python -m twine check dist/reme/*

      - name: Verify distributions and isolated installation
        run: |
          REME_WHEEL="$(pwd)/$(ls dist/reme/reme_ai-[0-9]*.whl)"
          python -m zipfile -l "${REME_WHEEL}" | (! grep 'reme/web/')
          python -m zipfile -l "${REME_WHEEL}" | (! grep 'reme_studio/')
          python -m venv "${RUNNER_TEMP}/reme-package-smoke"
          "${RUNNER_TEMP}/reme-package-smoke/bin/python" -m pip install "${REME_WHEEL}[as]"
          "${RUNNER_TEMP}/reme-package-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/reme-package-smoke/bin/python" -c "import reme"

      - name: Build and verify Home plugin distribution
        run: |
          python -m build --outdir dist/home plugins/home
          python -m twine check dist/home/*
          REME_WHEEL="$(pwd)/$(ls dist/reme/reme_ai-[0-9]*.whl)"
          HOME_WHEEL="$(pwd)/$(ls dist/home/reme_home-[0-9]*.whl)"
          python -m venv "${RUNNER_TEMP}/reme-home-package-smoke"
          "${RUNNER_TEMP}/reme-home-package-smoke/bin/python" -m pip install "${REME_WHEEL}[as]" "${HOME_WHEEL}"
          "${RUNNER_TEMP}/reme-home-package-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/reme-home-package-smoke/bin/python" -I - <<'PY'
          from pathlib import Path
          import sys
          import reme
          import reme_home
          from reme.enumeration import ComponentEnum
          from reme.plugin import resolve_plugin_runtime
          from reme_home import AutoBashStep

          for module in (reme, reme_home):
              assert Path(module.__file__).is_relative_to(sys.prefix), module.__file__
          runtime = resolve_plugin_runtime({"plugins": ["home"]})
          assert runtime.registry.get(ComponentEnum.STEP, "auto_bash_step") is AutoBashStep
          assert runtime.config["jobs"]["auto_bash"]["steps"] == [{"backend": "auto_bash_step"}]
          PY

      - name: Build and verify benchmark plugin distributions
        run: |
          REPOSITORY="$(pwd)"
          REME_WHEEL="${REPOSITORY}/$(ls dist/reme/reme_ai-[0-9]*.whl)"
          for BENCHMARK in memlens mobilemem; do
            python -m build --outdir "dist/${BENCHMARK}" "plugins/${BENCHMARK}"
            python -m twine check "dist/${BENCHMARK}/"*
            PLUGIN_WHEEL="${REPOSITORY}/$(ls dist/${BENCHMARK}/reme_${BENCHMARK}-[0-9]*.whl)"
            PLUGIN_ENV="${RUNNER_TEMP}/reme-${BENCHMARK}-package-smoke"
            python -m venv "${PLUGIN_ENV}"
            "${PLUGIN_ENV}/bin/python" -m pip install "${REME_WHEEL}[as]" "${PLUGIN_WHEEL}"
            "${PLUGIN_ENV}/bin/python" -m pip check
            (
              cd "${RUNNER_TEMP}"
              "${PLUGIN_ENV}/bin/python" -I - "${BENCHMARK}" <<'PY'
          from importlib import import_module, metadata
          from pathlib import Path
          import sys
          import reme
          from reme.components.agent_wrapper.as_agent_wrapper import AsAgentWrapper
          from reme.config.config_parser import _load_config
          from reme.enumeration import ComponentEnum
          from reme.plugin import resolve_plugin_runtime

          name = sys.argv[1]
          plugin = import_module(f"reme_{name}")
          wrapper = import_module(f"reme_{name}.benchmark_agent").BenchmarkAsAgentWrapper
          for module in (reme, plugin, sys.modules[wrapper.__module__]):
              assert Path(module.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), module.__file__
          entries = tuple(metadata.entry_points(group="reme.plugins", name=name))
          assert len(entries) == 1 and entries[0].load() is plugin
          presets = tuple(metadata.entry_points(group="reme.configs", name=f"{name}-benchmark"))
          assert len(presets) == 1 and presets[0].load() == plugin.BENCHMARK_CONFIG
          assert plugin.BENCHMARK_CONFIG.is_file()
          assert Path(plugin.__file__).with_name("plugin.yaml").is_file()
          runtime = resolve_plugin_runtime(_load_config(f"{name}-benchmark"))
          backend = f"{name}_benchmark_agent"
          assert issubclass(wrapper, AsAgentWrapper)
          assert callable(AsAgentWrapper._finish_reply)
          assert runtime.registry.get(ComponentEnum.AGENT_WRAPPER, backend) is wrapper
          for variant in ("default", "bench"):
              assert runtime.config["components"]["agent_wrapper"][variant]["backend"] == backend
          print(f"{name}: installed wheel entry points and backends verified")
          PY
            )
          done

      - name: Verify released core dependencies
        if: inputs.upload_artifacts
        run: |
          REME_WHEEL="$(pwd)/$(ls dist/reme/reme_ai-[0-9]*.whl)"
          python -m venv "${RUNNER_TEMP}/reme-core-package-smoke"
          "${RUNNER_TEMP}/reme-core-package-smoke/bin/python" -m pip install "${REME_WHEEL}[core]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/reme-core-package-smoke/bin/python" - <<'PY'
          from reme_studio import static_dir

          assert (static_dir() / "index.html").is_file()
          PY

      - name: Upload ReMe distributions
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reme-distributions
          path: dist/reme/
          if-no-files-found: error
