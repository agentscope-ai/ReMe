name: Release / ReMe

# A published GitHub Release builds all distributions from its tag.
# Configure PyPI and npm trusted publishers for this workflow.
run-name: Publish ReMe ${{ github.event.release.tag_name || github.ref_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-reme
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    uses: ./.github/workflows/_build-python-packages.yml
    with:
      expected_version: ${{ github.event.release.tag_name }}
      upload_artifacts: true

  publish-reme:
    needs: [build, publish-studio]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download ReMe distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reme-distributions
          path: dist/reme

      - name: Publish ReMe
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/reme
          skip-existing: true

  desktop:
    name: Package Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: reme_studio/package-lock.json
      - run: npm ci --prefix reme_studio
      - name: Package desktop installers
        shell: bash
        run: |
          npm exec --workspace desktop -- install-electron
          flags=()
          manifest=""
          case "$RUNNER_OS" in
            macOS)
              if [[ -n "$CSC_LINK" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
                export CSC_IDENTITY_AUTO_DISCOVERY=true
                flags+=(--config.forceCodeSigning=true --config.mac.notarize=true)
                manifest=latest-mac.yml
              fi
              ;;
            Windows)
              if [[ -n "$CSC_LINK" ]]; then
                flags+=(--config.forceCodeSigning=true)
                manifest=latest.yml
              fi
              ;;
            Linux) manifest=latest-linux.yml ;;
          esac
          if [[ -n "$manifest" ]]; then
            flags+=(
              --config.publish.provider=github
              --config.publish.owner="$GITHUB_REPOSITORY_OWNER"
              --config.publish.repo="${GITHUB_REPOSITORY#*/}"
            )
          fi
          npm run dist --workspace desktop -- "${flags[@]}"
          if [[ -n "$manifest" ]]; then
            test -s "desktop/dist/$manifest"
          fi
        working-directory: reme_studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ (runner.os == 'macOS' && secrets.MAC_CSC_LINK) || (runner.os == 'Windows' && secrets.WIN_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD) || (runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reme-desktop-${{ matrix.os }}
          path: |
            reme_studio/desktop/dist/*.dmg
            reme_studio/desktop/dist/*.zip
            reme_studio/desktop/dist/*.exe
            reme_studio/desktop/dist/*.AppImage
            reme_studio/desktop/dist/*.blockmap
            reme_studio/desktop/dist/latest*.yml
          if-no-files-found: error

  publish-studio:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: studio-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/studio
          skip-existing: true

  publish-studio-npm:
    needs: publish-reme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: studio-distributions
          path: dist
      - env:
          STUDIO_PACKAGE: '@agentscope-ai/reme_studio'
        run: |
          package=$(find dist/studio-npm -name '*.tgz' -print -quit)
          version=$(tar -xOf "$package" package/package.json | node -p "JSON.parse(require('node:fs').readFileSync(0)).version")
          if remote=$(npm view "$STUDIO_PACKAGE@$version" dist.integrity); then
            actual=$(node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); console.log('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package")
            test "$remote" = "$actual"
          else
            npm publish "$package" --access public --provenance
          fi

  publish-desktop:
    if: github.event_name == 'release'
    needs: publish-studio-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: reme-desktop-*
          merge-multiple: true
          path: dist/desktop
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          installers=(dist/desktop/*.dmg dist/desktop/*.zip dist/desktop/*.exe dist/desktop/*.AppImage dist/desktop/*.blockmap)
          manifests=(dist/desktop/latest*.yml)
          gh release upload "$RELEASE_TAG" "${installers[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if (( ${#manifests[@]} )); then
            gh release upload "$RELEASE_TAG" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
