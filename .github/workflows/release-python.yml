name: Validate ReMe Studio npm publisher
run-name: Validate Studio npm OIDC from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build the Studio web package
        env:
          TEST_VERSION: 0.4.3-oidc.${{ github.run_id }}
        run: |
          npm ci --prefix reme_studio --ignore-scripts
          npm run build:static --prefix reme_studio
          npm pkg set "version=$TEST_VERSION" --prefix reme_studio --workspace web
          npm pack ./reme_studio/web --pack-destination "$RUNNER_TEMP"
          package=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'agentscope-ai-reme_studio-*.tgz' -print -quit)
          test -n "$package"
          tar -tzf "$package" | grep -x 'package/dist-static/index.html'
          printf 'NPM_TEST_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Stage the preview using npm trusted publishing
        run: |
          npm install --global npm@11.21.0
          npm stage publish "$NPM_TEST_PACKAGE" --access public --tag oidc-validation
