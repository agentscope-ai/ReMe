name: CI / ReMe Studio

on:
  push:
    branches: [main]
    paths:
      - "reme_studio/**"
      - ".github/workflows/ci-reme-studio.yml"
      - ".github/workflows/release-python.yml"
      - "scripts/package_studio.py"
      - "tests/unit/test_package_versions.py"
      - "pyproject.toml"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths:
      - "reme_studio/**"
      - ".github/workflows/ci-reme-studio.yml"
      - ".github/workflows/release-python.yml"
      - "scripts/package_studio.py"
      - "tests/unit/test_package_versions.py"
      - "pyproject.toml"
      - "LICENSE"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reme_studio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: reme_studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Studio clients
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build:static
          npm run build:desktop
          npm run build:mobile
          npm run build:mobile -- --mode ios
