name: CI / Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermes-embedded:
    name: Hermes embedded - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal runtime with Hermes shared dependency pins
        run: |
          python -m pip install -e ".[hermes]" pytest pytest-asyncio "fastmcp==3.4.4" "mcp==1.28.1" \
            -c tests/constraints/hermes-0.21.4.txt
          python -m pip check
      - name: Test embedded lifecycle and shared dependency compatibility
        run: |
          python -m pytest tests/unit/test_hermes_agent_integration.py \
            tests/unit/test_application_config.py tests/unit/test_as_llm_lazy.py \
            tests/unit/test_cron_delay.py tests/unit/test_package_versions.py \
            tests/unit/test_mcp_client.py tests/unit/test_service.py -q

  unit-tests:
    name: Unit Tests - py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e reme_studio -e ".[dev,core,decision,qwen-tokenizer]"
          pip install --no-deps -e plugins/auto-fin
          pip install -e plugins/daily_paper
          pip install -e plugins/lme -e plugins/beam
          pip install "safecmd>=0.1.16,<0.2" shfmt-py
          # Keep the checkout's ReMe instead of resolving the plugin's published ReMe dependency.
          pip install --no-deps -e plugins/home
          pip install coverage

      - name: Run unit tests
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        run: |
          python -c "import tokenizers; print('tokenizers', tokenizers.__version__)"
          coverage run -m pytest tests/unit plugins/auto-fin plugins/daily_paper plugins/lme plugins/beam plugins/home/tests \
            -v \
            --tb=long \
            -s \
            --log-cli-level=WARNING

      - name: Generate coverage report
        run: coverage report -m

      - name: Verify minimum tokenizer version
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install "tokenizers==0.23.3"
          python -c "import tokenizers; print('tokenizers', tokenizers.__version__)"
          python -m pytest tests/unit/test_qwen_token_tools.py tests/unit/test_package_versions.py -q
