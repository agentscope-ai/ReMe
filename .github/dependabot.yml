version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
