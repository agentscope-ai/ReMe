name: manage-notebook
description: Find projects, manage Todos and Ideas, maintain progress and link entries with ReMe's manage_notebook tool.
description_zh: 用 ReMe 的 manage_notebook 工具查找项目、管理待办和想法、维护进展并关联条目。
content: |
  # Manage Todos and Ideas

  Use `manage_notebook(kind="todo")` for work to do and `manage_notebook(kind="idea")` for ideas and proposals to discuss.
  Look for existing entries before deciding whether to update or create one. Pass tool parameters at the same level as
  `action`. Replace example IDs such as `t001` and `i001` with the actual IDs returned by the tool.
  For CLI usage, run `reme start config=proactive` first, then call `reme manage_notebook kind=todo` or
  `reme manage_notebook kind=idea` from another terminal, supplying parameters as `key=value`.

  ## Shared parameters

  | Parameter | Usage |
  | --- | --- |
  | `action` | Required. Use an operation listed below. |
  | `id` | Use an existing entry's ID for `get`, `update`, and Idea `archive` or `restore`. Creation generates an ID. Archived entries remain accessible by their original IDs. |
  | `project` | Set the project for `create` and `update`; filter by exact project name for `list`. Use the original name returned by queries. For standalone creation, omitting it or leaving it empty uses the default notes project, displayed as Notes in English. Omitting it in `list` searches all projects; omitting it in `update` retains the current project. |
  | `text` | A nonblank sentence for `create` and `update`. Required when creating an Idea; a new Todo may inherit it from `source_idea`. |
  | `scope` | Used by `list` and the shared `list_projects`. `active` selects unarchived entries, `archive` selects archived entries, and `all` selects both. Defaults to `active` for `list` and `all` for `list_projects`. |
  | `query` | Case-insensitive substring search for project names and text in `list`. Todo searches also match progress and closing notes. |
  | `offset` | Number of entries to skip in `list`; defaults to `0`. |
  | `limit` | Page size for `list`, from `1` to `100`; defaults to `20`. Use `total` and `offset` to determine whether more pages are needed. |

  ## Todo parameters

  | Parameter | Usage |
  | --- | --- |
  | `status` | Set in `create` or `update`, or filter in `list`. Defaults to `pending`; use `in_progress` when work starts and `closed` when completed or cancelled. Setting it back to `pending` or `in_progress` restores the entry and clears its closing time and note. |
  | `due_date` | Set in `create` or `update` as `YYYY-MM-DD`. Pass `null` to clear it; omit it to retain the existing date. |
  | `source_idea` | Link an existing Idea by ID in `create` or `update`, or filter associated Todos in `list`. A new Todo inherits the Idea's `project` and `text` when those fields are omitted. Pass `null` in `update` to unlink it. |
  | `progress_text` | Append a nonblank progress entry in `create` or `update`. In `update`, supplying `progress_match` replaces the matched entry's text. Read all progress before writing and record only new facts. |
  | `progress_time` | Used with `progress_text`; include a timezone. If omitted, new progress uses the current time and replacement progress retains its original time. |
  | `progress_match` | For `update` only. Pass the original progress object from `get`, including its full `time` and `text`, to match one entry exactly. Omitting `progress_text` deletes the matched entry. |
  | `close_note` | A sentence explaining the result or closing reason when `create` or `update` sets `status=closed`. Pass `null` to clear it. |

  ## Todo operations (kind=todo)

  ### `list_projects`

  This shared operation omits `kind` and summarizes projects across Todos and Ideas.
  Each result includes `project`, `todo_count` and `idea_count`.

  ```json
  {
    "action": "list_projects",
    "scope": "all"
  }
  ```

  ### `list`

  Find Todos. The list includes only the latest progress entry and `progress_count`; use `get` to read all progress.

  ```json
  {
    "kind": "todo",
    "action": "list",
    "project": "ReMe",
    "status": "in_progress",
    "source_idea": "i001",
    "scope": "all",
    "query": "release package",
    "offset": 0,
    "limit": 20
  }
  ```

  ### `get`

  Read one Todo and all its progress entries.

  ```json
  {
    "kind": "todo",
    "action": "get",
    "id": "t001"
  }
  ```

  ### `create`

  Create a Todo from an existing Idea, reuse its project and record progress that has already occurred.

  ```json
  {
    "kind": "todo",
    "action": "create",
    "source_idea": "i001",
    "text": "Validate the Windows release package",
    "status": "in_progress",
    "due_date": "2026-11-25",
    "progress_text": "Windows installation passed; startup validation is pending.",
    "progress_time": "2026-11-24T10:15:00+08:00"
  }
  ```

  ### `update`

  Supply the ID and fields to change. This example merges new results into the original progress entry and closes the
  fully validated Todo.

  ```json
  {
    "kind": "todo",
    "action": "update",
    "id": "t001",
    "progress_match": {
      "time": "2026-11-24T10:15:00+08:00",
      "text": "Windows installation passed; startup validation is pending."
    },
    "progress_text": "Windows installation and startup both passed.",
    "status": "closed",
    "close_note": "The release package passed Windows installation and startup validation."
  }
  ```

  ## Idea operations (kind=idea)

  ### `list`

  Find Ideas by project, keyword and archive state. Active Ideas are sorted by recorded time, newest first, with undated
  Ideas last. Archived Ideas are sorted by archive time, newest first.

  ```json
  {
    "kind": "idea",
    "action": "list",
    "project": "ReMe",
    "scope": "all",
    "query": "release package",
    "offset": 0,
    "limit": 20
  }
  ```

  ### `get`

  Read one Idea.

  ```json
  {
    "kind": "idea",
    "action": "get",
    "id": "i001"
  }
  ```

  ### `create`

  Record an idea in one sentence.

  ```json
  {
    "kind": "idea",
    "action": "create",
    "project": "ReMe",
    "text": "Before release, verify that the package installs and starts in a clean environment."
  }
  ```

  ### `update`

  Supply the ID and the project or text to change.

  ```json
  {
    "kind": "idea",
    "action": "update",
    "id": "i001",
    "text": "Before release, validate the package separately in clean macOS and Windows environments."
  }
  ```

  ### `archive`

  Archive an Idea while retaining its original ID and Todo links. Creating or closing linked Todos does not decide
  whether to archive the Idea; assess that separately.

  ```json
  {
    "kind": "idea",
    "action": "archive",
    "id": "i001"
  }
  ```

  ### `restore`

  Restore an archived Idea.

  ```json
  {
    "kind": "idea",
    "action": "restore",
    "id": "i001"
  }
  ```

  ## Background notebook updates

  After receiving an event, find all related Todos and Ideas and read the full progress of each matching Todo.
  Update only new progress on open Todos; set `in_progress` when the evidence confirms that work has started.
  Send creations, edits, closures and links requiring the user's decision to Remy individually, describing the existing
  entry, new evidence and proposed action.

content_zh: |
  # 管理待办和想法

  用 `manage_notebook(kind="todo")` 记录明确要做的事，用 `manage_notebook(kind="idea")` 记录想法和待讨论的方案。先查有没有已有条目，再决定更新或新增。
  工具参数和 `action` 放在同一层。示例中的 `t001` 和 `i001` 用工具返回的实际 ID 替换。
  从命令行调用时，先运行 `reme start config=proactive`，再在另一个终端调用 `reme manage_notebook kind=todo` 或 `reme manage_notebook kind=idea`，用 `key=value` 传入参数。

  ## 共用参数

  | 参数 | 用法 |
  | --- | --- |
  | `action` | 必填。取下文对应工具列出的操作名。 |
  | `id` | `get`、`update` 和 Idea 的 `archive`、`restore` 使用已有条目的 ID。新建时由工具生成。归档后仍可用原 ID 查询。 |
  | `project` | `create` 和 `update` 写项目名，`list` 按项目名精确筛选。使用查询返回的原名。单独新建时省略或留空默认归入「随笔」（英文界面显示 Notes）。`list` 省略时查所有项目，`update` 省略时保留原项目。 |
  | `text` | `create` 和 `update` 使用一句非空文字。新建 Idea 时必填，新建 Todo 时可由 `source_idea` 提供。 |
  | `scope` | `list` 和 公共 `list_projects` 使用。`active` 查未归档，`archive` 查已归档，`all` 查全部。`list` 默认 `active`，`list_projects` 默认 `all`。 |
  | `query` | `list` 使用。不区分大小写，按子串匹配项目和正文。Todo 还会匹配进展和关闭备注。 |
  | `offset` | `list` 使用。跳过前几条，默认 `0`。 |
  | `limit` | `list` 使用。每页返回 `1`–`100` 条，默认 `20`。根据 `total` 和 `offset` 判断是否需要继续翻页。 |

  ## Todo 专用参数

  | 参数 | 用法 |
  | --- | --- |
  | `status` | `create` 和 `update` 设置状态，`list` 精确筛选。默认 `pending`（待开始），开工后用 `in_progress`，完成或取消时用 `closed`。重新设为 `pending` 或 `in_progress` 会恢复条目并清除关闭时间和备注。 |
  | `due_date` | `create` 和 `update` 使用，格式为 `YYYY-MM-DD`。传 `null` 清除，省略则保留已有期限。 |
  | `source_idea` | `create` 和 `update` 传已有 Idea 的 ID 建立关联，`list` 用它查找关联 Todo。新建 Todo 时，省略的 `project` 和 `text` 继承 Idea 的值。更新时传 `null` 解除关联。 |
  | `progress_text` | `create` 或 `update` 追加一条非空进展。`update` 同时传 `progress_match` 时，替换匹配条目的文字。写入前先读完整进展，只记录新增事实。 |
  | `progress_time` | 与 `progress_text` 一起使用，时间带时区。省略时，新增进展用当前时间，替换进展保留原时间。 |
  | `progress_match` | 仅用于 `update`。传 `get` 返回的原进展对象，包含完整的 `time` 和 `text`，工具会精确匹配一条进展。省略 `progress_text` 会删除匹配的进展。 |
  | `close_note` | `create` 或 `update` 传 `status=closed` 时，可用一句话说明结果或关闭原因。传 `null` 清除备注。 |

  ## Todo 操作（kind=todo）

  ### `list_projects`

  公共操作不传 kind，从 Todo 和 Idea 汇总项目。每项返回 `project`、`todo_count` 和 `idea_count`。

  ```json
  {
    "action": "list_projects",
    "scope": "all"
  }
  ```

  ### `list`

  查询 Todo。列表只带最近一条进展和 `progress_count`。要查看全部进展，用 `get`。

  ```json
  {
    "kind": "todo",
    "action": "list",
    "project": "ReMe",
    "status": "in_progress",
    "source_idea": "i001",
    "scope": "all",
    "query": "发布包",
    "offset": 0,
    "limit": 20
  }
  ```

  ### `get`

  读取单条 Todo 及其完整进展。

  ```json
  {
    "kind": "todo",
    "action": "get",
    "id": "t001"
  }
  ```

  ### `create`

  从已有 Idea 新建 Todo，沿用 Idea 的项目，并写入已发生的进展。

  ```json
  {
    "kind": "todo",
    "action": "create",
    "source_idea": "i001",
    "text": "验证 Windows 发布包",
    "status": "in_progress",
    "due_date": "2026-11-25",
    "progress_text": "Windows 安装通过，待验证启动。",
    "progress_time": "2026-11-24T10:15:00+08:00"
  }
  ```

  ### `update`

  传 ID 和要改的字段。下面把新结果合并到原进展，并关闭已经验证完毕的 Todo。

  ```json
  {
    "kind": "todo",
    "action": "update",
    "id": "t001",
    "progress_match": {
      "time": "2026-11-24T10:15:00+08:00",
      "text": "Windows 安装通过，待验证启动。"
    },
    "progress_text": "Windows 安装和启动均通过。",
    "status": "closed",
    "close_note": "发布包通过 Windows 安装和启动验证。"
  }
  ```

  ## Idea 操作（kind=idea）

  ### `list`

  按项目、关键词和归档状态查找 Idea。
  当前想法按记录时间倒序排列，未记录日期的想法列在最后。归档想法按归档时间倒序排列。

  ```json
  {
    "kind": "idea",
    "action": "list",
    "project": "ReMe",
    "scope": "all",
    "query": "发布包",
    "offset": 0,
    "limit": 20
  }
  ```

  ### `get`

  读取单条 Idea。

  ```json
  {
    "kind": "idea",
    "action": "get",
    "id": "i001"
  }
  ```

  ### `create`

  用一句话记录想法。

  ```json
  {
    "kind": "idea",
    "action": "create",
    "project": "ReMe",
    "text": "发版前在干净环境验证发布包能安装和启动。"
  }
  ```

  ### `update`

  传 ID 和要修改的项目或文字。

  ```json
  {
    "kind": "idea",
    "action": "update",
    "id": "i001",
    "text": "发版前分别在干净的 macOS 和 Windows 环境验证发布包。"
  }
  ```

  ### `archive`

  归档 Idea，保留原 ID 和 Todo 关联。关联 Todo 创建或关闭后，Idea 仍可单独决定是否归档。

  ```json
  {
    "kind": "idea",
    "action": "archive",
    "id": "i001"
  }
  ```

  ### `restore`

  恢复已归档的 Idea。

  ```json
  {
    "kind": "idea",
    "action": "restore",
    "id": "i001"
  }
  ```

  ## 随记后台更新

  收到事件后，查找所有相关 Todo 和 Idea，读完命中 Todo 的全部进展。只更新未关闭 Todo 的增量进展，确认开工时可设为 `in_progress`。
  需要用户决定的新增、修改、关闭和关联，逐项交给 Remy，写清已有条目、新依据和建议处理方式。
