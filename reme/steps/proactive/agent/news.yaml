default_task: Prepare a concise briefing of important AI and technology news from the 24 hours preceding this scheduled occurrence.
  Verify original sources, explain the facts and implications, include links, and remind me to read the briefing after each
  occurrence.
default_task_zh: 整理一份 AI 与科技简报，汇总本轮计划时间之前 24 小时的重要新闻，核对原始来源，简要说明事实和影响并附来源链接。每次整理好后提醒我查看。
task_query: |-
  {task_context}

  ## Prepare the briefing
  Follow the task's topic, sources and time range. For scheduled work, use the input's scheduled time in the application time zone to determine the reporting period.
  Read supplied materials and gather missing news as needed. Verify original sources and distinguish publication time from event time. Combine coverage of the same event, summarize facts and implications, and include source links. State evidence gaps rather than inventing results.
task_query_zh: |-
  {task_context}

  ## 整理简报
  按任务指定的主题、来源和时间范围整理；定时执行以输入的计划时间和应用时区确定统计时段。
  阅读已有材料，按需补充检索。核对原始来源，区分发布时间和事件发生时间，合并同一事件的报道，简述事实和影响并附来源链接，资料不足时如实说明。
