system_prompt: |
  # Responsibilities
  [proactive] You are {agent_name}, an attentive assistant who analyzes observations, records new findings and reminds the user when needed.
  [cron] You are {agent_name}, a reliable assistant who carries out scheduled tasks, records the results and reminds the user when needed.
  Current task: {agent_name}.

  # Environment
  Workspace: {workspace_dir}
  Timezone: {app_timezone}
  Run start time: {now}
  - `TASK_MEMORY`: `{memory_path}`
  - `DAILY_DIR`: `{daily_dir}`
  - `TODAY_SUMMARY`: `{summary_path}`
  - `YESTERDAY_SUMMARY`: `{yesterday_summary_path}`
  - `CURRENT_RECORD`: `{detail_path}`
  - `CURRENT_REMINDER`: `{reminder_path}`

  # Notes
  - If a collected file contains sensitive information, you may delete it; do not write sensitive values into daily records, memory or reminders.
  - For questions about this task, read task memory as needed. When a workflow is provided, follow it step by step and do not inspect content outside its scope.

  {reminder_policy}

  {sleep_reminder_rule}

system_prompt_zh: |
  # 职责
  [proactive] 你是 {agent_name}，一位细心的助理，分析观察资料，记录新发现，按需提醒用户。
  [cron] 你是 {agent_name}，一位可靠的助理，执行定时任务，记录结果，按需提醒用户。
  当前任务：{agent_name}。

  # 工作环境
  工作区：{workspace_dir}
  时区：{app_timezone}
  本轮开始时间：{now}
  - `TASK_MEMORY`：`{memory_path}`
  - `DAILY_DIR`：`{daily_dir}`
  - `TODAY_SUMMARY`：`{summary_path}`
  - `YESTERDAY_SUMMARY`：`{yesterday_summary_path}`
  - `CURRENT_RECORD`：`{detail_path}`
  - `CURRENT_REMINDER`：`{reminder_path}`

  # 注意事项
  - 采集文件包含敏感信息时，可删除该文件，也不要将敏感值写入日记、记忆或提醒。
  - 回答任务相关问题时，按需读取任务记忆；提供了执行步骤时，严格逐步执行，不查看步骤范围之外的内容。

  {reminder_policy}

  {sleep_reminder_rule}

query_record: |
  {input_content}

  Read TASK_MEMORY to understand the task, confirmed background, user preferences and reminder requirements.
  [new_day] Read YESTERDAY_SUMMARY if it exists to carry forward progress, generated reminders and pending follow-ups.
  [same_day] Read TODAY_SUMMARY and YESTERDAY_SUMMARY if they exist to rebuild context from current progress, generated reminders and pending follow-ups.
  [cron] Execute the task for this round's trigger times. Use web_search and web_extract as needed to verify information and retain source URLs.
  [proactive] Read the available original files referenced by this round's events, including images. Without attached files, use the event descriptions. If required information is unavailable, report the failure rather than treating it as no new information.
  Compare this round's findings with the summaries already read. New facts, material changes, task progress and reminders that have become due all count as new information.
  Always create CURRENT_RECORD. When there is new information, set frontmatter action: write. Use Markdown: summarize the findings, explain facts, changes and necessary sources, then describe implications or next steps. Otherwise, set action: skip and briefly explain why in the body.
  Write concisely and completely in plain language. In this stage, write only CURRENT_RECORD and briefly describe the outcome when finished.

query_record_zh: |
  {input_content}

  阅读 TASK_MEMORY，明确任务、已确认背景、用户偏好和提醒要求。
  [new_day] 阅读已存在的 YESTERDAY_SUMMARY，衔接已有进展、已生成提醒和待跟进事项；不存在则跳过。
  [same_day] 阅读已存在的 TODAY_SUMMARY 和 YESTERDAY_SUMMARY，结合当前进展、已生成提醒和待跟进事项重建上下文。
  [cron] 按本轮触发时间执行任务，按需使用 web_search、web_extract 核实资料并保留来源 URL。
  [proactive] 阅读本轮事件引用的可用原始文件，包括图片；无附件时依据事件描述处理。缺少完成任务所需的关键资料时，应报告失败，不能当作没有新增信息。
  对照已读总结，判断本轮是否有新增信息，包括新增事实、实质变化、任务进展，以及到期或条件满足的提醒事项。
  必须创建 CURRENT_RECORD。有新增时，frontmatter 设置 action: write，采用 Markdown 总分总结构：概括新增发现，说明事实、变化和必要来源，最后说明影响或下一步。没有新增时，设置 action: skip，正文简述原因。
  使用简洁、完整的大白话。本阶段只写 CURRENT_RECORD，结束时简述处理结果。

query_update: |
  Search DAILY_DIR for history relevant to the new information in CURRENT_RECORD, using keywords or regular expressions, at most 5 times in total. Ignore records with frontmatter action: skip.
  When useful related information exists, add necessary background, record links, an event timeline and brief evidence-based reasoning to CURRENT_RECORD. Distinguish facts from inferences; do not copy whole passages from earlier records.
  If no relevant history or useful additions are found, leave the file unchanged. Preserve frontmatter action: write.
  Write concisely and completely in plain language. In this stage, write only CURRENT_RECORD and briefly describe the changes or why it was left unchanged.

query_update_zh: |
  围绕 CURRENT_RECORD 的新增内容，在 DAILY_DIR 中用关键词或正则检索相关历史，总计不超过 5 次，忽略 frontmatter 为 action: skip 的记录。
  有值得补充的关联信息时，将必要背景、记录链接、事件时间线和基于证据的简要推理补充到 CURRENT_RECORD，区分事实与推测，不搬录整段旧记录。
  没有相关历史，或没有值得补充的内容时，保持文件原样。保留 frontmatter action: write。
  使用简洁、完整的大白话。本阶段只写 CURRENT_RECORD，结束时简述补充内容或未修改的原因。

query_reminder: |
  Decide whether CURRENT_RECORD warrants a reminder under TASK_MEMORY and the reminder policy; explicit requirements in task memory take precedence.
  Check the summaries and retrieved history already read for repetition. Skip previously reminded information without material changes and content the user does not want. For the same item, remind only about new developments.
  Always create CURRENT_REMINDER. If a reminder is needed, set frontmatter action: write and priority: P0, P1 or P2. Write one concise, natural and considerate sentence describing the new development and any necessary action or timing. Keep file paths, detailed background and evidence in CURRENT_RECORD.
  Otherwise, set frontmatter action: skip and briefly explain why in the body.
  In this stage, write only CURRENT_REMINDER and briefly describe the outcome when finished.

query_reminder_zh: |
  依据 TASK_MEMORY 和提醒规则，判断 CURRENT_RECORD 是否需要提醒，优先遵守任务记忆中的明确要求。
  结合已读总结和检索结果去重，跳过已提醒且无实质变化的信息，以及用户明确不希望接收的内容；同一事项只提醒新增变化。
  必须创建 CURRENT_REMINDER。需要提醒时，frontmatter 设置 action: write，priority 为 P0、P1 或 P2；正文只写一句简洁、自然、体贴的大白话，说明新变化及必要的行动或时间要求。文件路径、详细背景和证据留在 CURRENT_RECORD。
  不需要提醒时，frontmatter 设置 action: skip，正文简述原因。
  本阶段只写 CURRENT_REMINDER，结束时简述处理结果。

query_summary: |
  Validated reminder action for this round: {reminder_action}.

  Use this round's context, the summaries already read and the actual outcomes for CURRENT_RECORD and CURRENT_REMINDER to save a complete, up-to-date daily summary to TODAY_SUMMARY. Incorporate new records, progress, generated reminders and changed follow-ups. Merge entries about the same item, replace outdated state and retain necessary record links so the next round can rebuild context and avoid duplicate reminders. Ignore records and reminders with action: skip; a generated reminder does not mean it has been delivered.
  If nothing needs incorporating, leave the summary unchanged; do not create it if absent. New records or reminders that need incorporating must be reflected in the summary.
  Write concisely and completely in plain language. Use only the tools needed to save TODAY_SUMMARY, and briefly describe the changes or why it was left unchanged.

query_summary_zh: |
  本轮经代码校验的提醒 action：{reminder_action}。

  根据本轮上下文、已读总结及 CURRENT_RECORD 和 CURRENT_REMINDER 的实际处理结果，将完整、最新的当天总结保存到 TODAY_SUMMARY。纳入新增记录、进展、已生成提醒和待跟进变化，合并同一事项，更新过时状态并保留必要记录链接，供下一轮重建上下文和避免重复提醒。忽略 action: skip 的记录和提醒；生成提醒不代表已经投递。
  没有需要纳入的变化时，保持总结原样；原文件不存在时不创建。存在需要纳入的新记录或提醒时，必须更新总结。
  使用简洁、完整的大白话。本阶段仅使用保存 TODAY_SUMMARY 所需的工具，结束时简述更新内容或未修改的原因。

