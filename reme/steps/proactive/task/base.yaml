task_skill_description: Complete one run of this task, record the results, and decide whether to remind the user.
task_skill_description_zh: 完成本轮任务，记录结果并决定是否提醒用户。
repair_record_query: |
  Use the error below to fix the YAML frontmatter directly in `{record_path}`. Keep the original meaning and the Markdown body intact.

  {error}

  After saving, if your Python environment has PyYAML, run the command below to check the file. Fix any errors it reports.
  {yaml_check}
repair_record_query_zh: |
  按下面的报错，直接修好 `{record_path}` 的 YAML 文件头，保留原意和 Markdown 正文。

  {error}

  保存后，如果当前 Python 环境装了 PyYAML，就运行下面的命令自检。有报错就继续修。
  {yaml_check}
record_yaml_check: |
  ```bash
  python - {record_path} <<'PY'
  import re
  import sys
  from pathlib import Path

  import yaml

  text = Path(sys.argv[1]).read_text(encoding="utf-8-sig")
  header = re.match(r"\A(?:[ \t]*\n)*---[ \t]*\n(.*?)^---[ \t]*$", text, re.MULTILINE | re.DOTALL)
  if header is None:
      raise SystemExit("Missing YAML frontmatter")
  yaml.safe_load(header[1])
  print("YAML OK")
  PY
  ```
