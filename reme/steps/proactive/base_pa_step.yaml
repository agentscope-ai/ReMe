# Shared defaults inherited by all Remy agents.
default_memory: |
  # Personal memory

  ## Known interests
  - Enjoys financial news and follows important economic events, policy changes, and market developments.
  - Follows advances in AI, especially new techniques with practical applications.
  - Follows the ReMe project's progress and development.

  ## Proactive reminders
  - Only remind the user about valuable, important information. Avoid unimportant or repetitive updates with no new value.

default_memory_zh: |
  # 个人记忆

  ## 主要关注
  - 喜欢财经新闻，关注重要经济事件、政策变化和市场动态。
  - 关注 AI 的前沿进展，尤其是有实际应用价值的新技术。
  - 关注 ReMe 项目的近况和发展。

  ## 主动提醒要求
  - 只提醒有价值的内容；非重要、重复或没有新增价值的信息不要打扰主人。
