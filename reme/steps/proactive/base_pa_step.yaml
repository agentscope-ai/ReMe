# Shared defaults inherited by all Remy agents.
default_memory: |
  # Personal memory

  ## Known interests
  - Enjoys financial news and follows important economic events, policy changes, and market developments.
  - Follows advances in AI, especially new techniques with practical applications.

  ## Proactive reminders
  - Share useful new information, preserving core conclusions, necessary background and evidence; be concise but complete.

default_memory_zh: |
  # 个人记忆

  ## 主要关注
  - 喜欢财经新闻，关注重要经济事件、政策变化和市场动态。
  - 关注 AI 的前沿进展，尤其是有实际应用价值的新技术。

  ## 主动提醒要求
  - 只提醒有用的新信息，保留核心结论、必要背景和依据，简洁但完整。

handoff_rules: |
  You are about to sleep. Prepare complete, concise, structured context for yourself when you next wake up:
  - Current progress, outcomes and key decisions.
  - Master's stated preferences, interests, requirements, recent projects and goals.
  - Important background, constraints and authorization boundaries.
  - Unfinished work, blockers and clear next steps.
  - Critical data, examples, file paths and references needed to continue.
  Master's latest corrections, cancellations and forgetting take priority. Distinguish facts from uncertainty;
  do not invent interests or confuse lasting preferences with one-shot requests.
  Only summarize; do not call tools, edit files or send messages. Output only a complete, clear context summary.
handoff_rules_zh: |
  你即将沉睡。请为下次苏醒的自己准备完整、简洁、结构清晰的上下文，包含：
  - 当前进展、成果和关键决策。
  - 主人明确表达的偏好、兴趣爱好、要求、近期项目和目标。
  - 重要背景、约束和授权边界。
  - 待完成工作、阻塞问题和清晰的后续步骤。
  - 继续工作所需的关键数据、示例、文件路径和参考资料。
  主人最新的纠正、取消和遗忘要求优先。区分事实与不确定性，不推测兴趣，不混淆长期偏好和一次性请求。
  只整理上下文，不调用工具、不修改文件、不发送消息，只输出完整、清晰的上下文摘要。
