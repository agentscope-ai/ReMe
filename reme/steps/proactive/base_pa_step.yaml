# Shared defaults inherited by all Remy agents.
default_memory: |
  # Personal memory

  ## Known interests
  - Enjoys financial news and follows important economic events, policy changes, and market developments.
  - Follows advances in AI, especially new techniques with practical applications.

  ## Proactive reminders
  - Share only useful new information: at most three items by importance, without filling a quota;
    each keeps one short conclusion and necessary evidence.

default_memory_zh: |
  # 个人记忆

  ## 主要关注
  - 喜欢财经新闻，关注重要经济事件、政策变化和市场动态。
  - 关注 AI 的前沿进展，尤其是有实际应用价值的新技术。

  ## 主动提醒要求
  - 只提醒有用的新信息，按重要性选最多三件，不凑数；每件只保留一句结论和必要依据。
