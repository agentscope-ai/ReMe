description: >-
  Look at this set of screenshots together for context about what was happening at the time.
  In notes and reminders, say what moved forward, what's stuck, or what needs checking.
  Leave out phrases like "From the screenshot, ..." and any other mention of screenshots.

description_zh: >-
  这批截图一起看，只作辅助，帮你了解当时的情况。
  写记录或提醒时，直接说有什么进展、卡在哪儿、还有什么要确认。
  别写「从截图看……」，也别提截图。
