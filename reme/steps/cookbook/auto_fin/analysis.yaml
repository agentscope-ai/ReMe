plan_user: |
  你是 Auto Fin 新闻案例检索模块。本次唯一决策时间是 {decision_at}。
  当前新闻窗口严格为 ({window_start}, {decision_at}]，更早的新闻视为已在昨日收盘前 price-in，
  更晚的新闻尚未发生，绝对不能使用。

  当前新闻（仅财联社）：
  {news}

  本地数据文件：
  {data_location}

  文件访问规则：
  1. `daily/YYYY-MM-DD/auto_fin_news_data.jsonl` 已进入 ReMe 索引，可通过 readfile/Read 或
     memory_search 访问；每条新闻的 `pub_time` 决定所属日期。
  2. `daily/YYYY-MM-DD/auto_fin_fund_daily.csv` 和
     `daily/YYYY-MM-DD/auto_fin_fund_adj.csv` 不进入 memory_search。需要查看 CSV 时，必须编写
     Python 代码并使用 Polars 的 `scan_csv` 或 `read_csv`，按 `ts_code`、`trade_date` 过滤；
     不得重新调用 TuShare。
  3. 所有相对路径均以 data_location 中的 workspace_root 为根目录。

  最近 {lookback_days} 天数据中，上一交易日可选 ETF 行情：
  {etf_universe}

  必须遵守：
  1. 合并重复新闻，按可交易的细分主题归类；事实、推断和方向冲突要明确区分。
  2. 对每个主题调用 memory_search，检索以前 daily/YYYY-MM-DD/auto_fin_cases.jsonl 和相关 Markdown。
     查询应包含主题、事件类型、方向及关键实体，不得把当前日期或未来日期当成历史案例。
  3. 最多选择 8 个有实质新闻的主题，每个主题只从 etf_universe 映射一个流动性良好的境内
     A 股行业股票 ETF。
     禁止个股、跨境/QDII、商品、债券和货币 ETF；高度重合 ETF 不重复。
  4. historical_cases 只填写 memory_search 实际返回、交易日严格早于 {trade_date} 的案例；
     source_path 必须是检索结果中的真实路径。没有相似案例就返回空列表，不得编造。
  5. 此阶段不判断 price-in，也不提出买卖；代码随后从本地缓存读取所选 ETF 的复权历史。
  6. 只返回符合 schema 的结构化结果，不修改文件，不查询 {decision_at} 之后的数据。

decision_user: |
  你是 Auto Fin 新闻案例决策模块。本次决策时间是 {decision_at}，不考虑任何仓位。

  当前新闻（仅财联社）：
  {news}

  本地数据文件：
  {data_location}

  文件访问规则：
  1. 新闻 JSONL 可通过 readfile/Read 或 memory_search 访问。
  2. ETF daily/adj CSV 不进入 memory_search；需要核验明细时，必须使用 Python + Polars
     `scan_csv`/`read_csv`，并严格限制到 data_location 列出的文件和本次决策截止时间。
  3. 不得联网补数或重新调用 TuShare。

  主题、代表 ETF 与通过 memory_search 找到的历史案例：
  {plan}

  代码从本地缓存读取并计算的 ETF 数据：
  {etf_data}

  必须遵守：
  1. 只能使用以上数据。latest 是截至昨日的最新收盘行情；historical_cases 是缓存覆盖范围内
     历史相似事件当日及后续 D1/D3/D5 的复权 close-close 实际走势；禁止时间穿越。
  2. 根据新闻是否延续旧信息、最近收盘走势和历史案例，判断影响是否可能已被 price-in：
     - 已充分上涨或下跌、达到或超过历史同类事件通常幅度：price_in=YES；
     - 最近走势尚未反应，但历史同类案例方向和后续走势较一致：price_in=NO；
     - 案例少、数据缺失、方向冲突或无法解释：price_in=UNCERTAIN。
  3. SELL 表示新闻影响已充分反映，参考上宜止盈/回避追涨；BUY 表示尚未反映且历史案例支持；
     HOLD 表示观察。不得假设用户持仓，不得描述仓位、下单或真实交易。
  4. ETF 最近未按预期变化时必须分析可能原因：事件相关性弱、已有旧信息、传导链错误、
     市场风险偏好抵消、ETF 成分不匹配或反应滞后。只有历史案例和当前事实支持时才能给 BUY。
  5. 历史样本逐项呈现，不计算或编造模型预测；样本少于 3 个必须明确“样本不足”。
  6. 每个主题最多一条建议，只能使用 plan 中的 ETF。body 用中文 Markdown，完整记录新闻、
     历史案例、当前涨跌、price-in 判断、反例和失效条件。
  7. 明确“仅为新闻案例研究，不考虑仓位，不会执行真实交易”，只返回符合 schema 的结构化结果。
