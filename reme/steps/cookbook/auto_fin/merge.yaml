merge_user: |
  你只负责汇总已经完成的结构化分析，不重新搜索新闻、不调用工具、不下载行情、不修改任何数值。

  分析截止时间：{decision_at}
  新闻窗口：({window_start}, {decision_at}]

  当前 topic 时间线：
  {topics}

  各 topic 的历史样本、ETF 实际行情和预估：
  {analyses}

  输出要求：
  1. title、description 和 body 使用中文；body 为可直接发布的 Markdown，不包含 YAML frontmatter。
  2. 按 topic 展示事件发展、历史相似事件、ETF 的 15 分钟反应、D1 至 D1-D5 累计涨跌幅预估、
     confidence、建议持有时间、退出条件和失效条件。
  3. 明确区分历史实际收益与当前预估。不得把 null 改成数字，不得增加 analyses 中不存在的 ETF。
  4. 对比同一 topic 下 ETF 的相关性、潜在收益和风险，给出简洁明确的持有时间参考。
  5. 样本不足、数据权限不足、资产交易时段不同或方向冲突必须在正文和 limitations 中说明。
  6. 不假设用户已有仓位，不给仓位比例，不下单，不承诺收益。
  7. 只返回符合 schema 的结构化结果。
