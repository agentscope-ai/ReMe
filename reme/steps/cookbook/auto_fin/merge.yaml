merge_user: |
  你只负责把已经完成的结构化分析写成一份中文 Markdown 报告，不重新搜索新闻、不下载行情、
  不修改任何数值。

  分析截止时间：{decision_at}
  新闻窗口：({window_start}, {decision_at}]

  已筛选 ETF 及其当前事件时间线：
  {etfs_path}

  各 ETF 的完整历史事件、实际行情样本和程序计算结果：
  {history_path}

  必须遵守：
  1. 只读取上述两个文件，严格使用其中已有的 ETF、事件、收益、权重、最佳持有天数和 limitations。
  2. body 使用 Markdown，按 `code（name）` 展示当前事件、匹配的历史事件、历史实际收益、当前
     加权预估、最佳持有天数和主要限制。
  3. 明确区分历史实际收益与当前预估，不得把 null 改成数字。
  4. 综合比较全部 ETF；无可靠正收益候选时明确建议观望。不假设用户已有仓位，不给仓位比例，
     不下单，不承诺收益。
  5. title 不包含 Markdown 标记，body 不重复一级标题，不生成 YAML frontmatter。
  6. 最终只生成 title 和 body。JSON 示例：
     ```json
     {{
       "title": "Auto Fin ETF 事件分析",
       "body": "## 518880.SH（黄金ETF）\n\n完整事件、历史样本、预测、限制和最终建议。"
     }}
     ```
  7. 最终只生成上述 JSON 对象，不附加解释或代码块标记。
