history_search_user: |
  你只负责为一个当前主题检索和整理历史相似事件，不查询行情、不选择 ETF、不提供预测。
  当前主题：{topic}
  当前事件时间线：{events}
  历史截止时间：{window_start}
  ReMe workspace：{workspace_root}

  必须遵守：
  1. 使用 memory_search 搜索 {window_start} 之前的相似新闻；结果不足时，使用 Read 或 Python 扫描
     workspace 下过去 360 天的 `daily/YYYY-MM-DD/auto_fin_news_data.jsonl` 和历史 Auto Fin Markdown。
  2. 查询必须包含主题、事件类型、关键实体和影响方向，不能只搜索主题名称。
  3. historical_events 只记录实际命中的事实，event_time 必须早于 {window_start}，source_path
     必须是真实文件路径。没有相似事件就返回空列表，严禁编造。
  4. 合并同一事件的重复报道，按 event_time 升序排列；所有时间必须包含时区。
  5. topic 必须原样返回 `{topic}`。只返回符合 schema 的结构化结果，不读写或下载行情文件。

market_user: |
  你只负责一个当前主题的相关 ETF 选择、历史行情计算和 D1-D5 预估，不再搜索或修改历史事件。
  当前主题：{topic}
  当前事件时间线：{events}
  已核验的历史事件：{history}
  本次分析截止时间：{decision_at}
  临时目录：{temporary_dir}

  一、选择并计算 ETF
  1. historical_events 必须逐项原样复制已核验的历史事件，topic 必须原样返回 `{topic}`。
  2. 使用 $tushare-data，选择 1-5 个与事件传导链直接相关的 ETF。允许境内、跨境、商品、债券等
     ETF，但必须说明 asset_type、market 和 relationship，不得只因名称相似而选择。
  3. 日线和分钟线只能临时下载到 {temporary_dir}，不得写入 ReMe daily 目录或长期缓存。
  4. 必须在 {temporary_dir} 编写并运行 Python 代码完成时间对齐和收益计算，不得心算或编造行情。
  5. 优先使用 1 分钟数据；无法取得时可使用更粗粒度数据，但必须写入 limitations。
  6. 对每个历史事件逐 ETF 计算：
     - 盘中事件包含 09:30-11:30、13:00-15:00 和午间 11:30-13:00。
     - 盘中基准价为事件发生前最后一根可用分钟线收盘价；午间使用上午最后一根分钟线。
     - 盘前或盘后基准价为事件发生前最近一个交易日收盘价。
     - D1 是事件后的第一个有效收盘；D1-D2 至 D1-D5 都相对同一基准价计算累计涨跌幅。
     - intraday_returns 记录事件后每个已完成 15 分钟检查点相对基准价的实际累计收益，直到收盘；
       非盘中事件返回空列表。
     - reaction_summary 简洁描述盘中路径；非盘中事件描述基准收盘到下一个收盘的变化。
  7. historical_samples 只能填写代码实际算出的结果。数据不足的字段返回 null，并说明原因。

  二、预估当前事件
  1. 以当前时间线中最新的实质事件为 anchor_event_time；如果最后一条只是重复确认，则使用最近一次
     真正改变市场预期的事件。结合完整时间线、历史样本、当前行情和传导关系进行预估。
  2. 按上述盘中/盘前盘后规则填写 baseline_time 和 baseline_price。预估 d1_return、
     d1_d2_return、d1_d3_return、d1_d4_return、d1_d5_return。
  3. 以上均为从 baseline_price 到对应收盘的累计涨跌幅；数字使用小数，例如 1.5%=0.015。
  4. suggested_holding_period 必须为 D1、D1-D2、D1-D3、D1-D4、D1-D5 或“不建议持有”，选择
     预期收益和风险最合适的区间，不默认用户已有仓位。
  5. 历史样本不足、分歧大或行情权限不足时降低 confidence，允许收益为 null，禁止虚假精确。
  6. reason、exit_condition、invalidation_condition 必须可由当前事实或历史样本验证。
  7. current_intraday_returns 使用同样的 15 分钟口径，只记录截至 {decision_at} 已完成的区间；
     当前事件尚未进入交易时段时返回空列表。

  所有时间必须包含时区。最终只返回符合 schema 的结构化结果。不要输出 Markdown，不要修改
  ReMe 用户文件；临时目录会在返回后删除。
