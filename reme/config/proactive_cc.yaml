# Start with LLM_API_KEY, LLM_BASE_URL and optionally REME_MODEL_NAME, as with proactive.
# reme start config=proactive_cc
extends: proactive

components:
  anthropic_relay:
    default:
      backend: bailian
      base_url: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/apps/anthropic}

  agent_wrapper:
    default:
      backend: claude_code
      # Keep Claude Code's native instructions and append each Runtime's role prompt.
      system_prompt:
        type: preset
        preset: claude_code
        snapshot: false
      api_key: ${LLM_API_KEY:-}
      anthropic_relay: default
      permission_mode: bypassPermissions
      settings: '{"permissions":{"blockWritesOutsideWorkingDirectories":true}}'
      env:
        CLAUDE_CODE_MAX_CONTEXT_TOKENS: '983616'
        # Claude Code reserves 33,000 tokens here, yielding the shared 600,000-token trigger.
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: '633000'
