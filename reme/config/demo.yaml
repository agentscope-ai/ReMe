service:
  backend: http

jobs:
  demo:
    backend: base
    description: "demo job description"
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "query"
        min_score:
          type: number
          description: "min score"
          default: 0.5
      required:
        - query
    steps:
      - backend: demo_echo_step1
      - backend: demo_echo_step2

  add:
    backend: base
    description: "add two numbers"
    parameters:
      type: object
      properties:
        a:
          type: number
          description: "first addend"
        b:
          type: number
          description: "second addend"
      required:
        - a
        - b
    steps:
      - backend: add_step

  llm_demo:
    backend: base
    description: "LLM agent demo with the add job available as a tool"
    query: "Use the add tool to calculate 1 + 2 and return the result."
    sys_prompt: "Use the add tool for arithmetic tasks."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "message sent to the agent"
          default: "Use the add tool to calculate 1 + 2 and return the result."
        sys_prompt:
          type: string
          description: "optional system prompt for the agent"
    steps:
      - backend: llm_demo_step
        agent_wrapper: codex

  stream_llm_demo:
    backend: stream
    description: "streaming LLM agent demo with the add job available as a tool"
    query: "Use the add tool to calculate 1 + 2 and return the result."
    sys_prompt: "Use the add tool for arithmetic tasks."
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "message sent to the agent"
          default: "Use the add tool to calculate 1 + 2 and return the result."
        sys_prompt:
          type: string
          description: "optional system prompt for the agent"
    steps:
      - backend: stream_llm_demo_step
        agent_wrapper: codex

  stream_demo:
    backend: stream
    description: "stream demo job: repeat query 10x and stream char-by-char"
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "query to echo"
        repeat:
          type: integer
          description: "number of times to repeat the query"
          default: 10
        interval:
          type: number
          description: "seconds between chunks"
          default: 0.1
      required:
        - query
    steps:
      - backend: stream_demo_step1
      - backend: stream_demo_step2

components:
  as_llm:
    default:
      backend: openai
      model: qwen3.7-max
      stream: true
      context_size: 200000
      max_retries: 3
      credential:
        api_key: ${LLM_API_KEY:-}
        base_url: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      parameters:
        max_tokens: 65536
        thinking_enable: false

  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      supports_websockets: false
      config_overrides:
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="qwen3.8-max"'
        - 'agents.default_subagent_model="qwen3.8-max"'
        - 'agents.default_subagent_reasoning_effort="xhigh"'
        - 'memories.extract_model="qwen3.8-flash"'
        - 'memories.consolidation_model="qwen3.8-max"'
      model_catalog:
        models:
          - &codex_model_defaults
            slug: &codex_simple_model qwen3.8-flash
            display_name: Qwen3.8 Flash
            description: Simple tasks and automatic approval review
            auto_review_model_override: *codex_simple_model
            default_reasoning_level: xhigh
            multi_agent_reasoning_effort: xhigh
            supported_reasoning_levels:
              - effort: xhigh
                description: Maximum reasoning
            context_window: 983616
            input_modalities: [text, image]
            supports_parallel_tool_calls: false
            supports_reasoning_summaries: false
            support_verbosity: false
            shell_type: default
            visibility: list
            supported_in_api: true
            priority: 1
            base_instructions: ""
            experimental_supported_tools: []
            truncation_policy:
              mode: bytes
              limit: 10000
          - <<: *codex_model_defaults
            slug: &codex_complex_model qwen3.8-max
            display_name: Qwen3.8 Max
            description: Main conversations and complex tasks
            default_reasoning_level: xhigh
            priority: 0

  agent_wrapper:
    as:
      backend: agentscope
      as_llm: default
      job_tools:
        - add
      permission_mode: bypass
      react_config:
        max_iters: 100
      context_config:
        trigger_ratio: 0.89
        reserve_ratio: 0.1
        tool_result_limit: 50000
      model_config:
        max_retries: 3
    cc:
      backend: claude_code
      model: ${CLAUDE_CODE_MODEL_NAME:-qwen3.7-max}
      api_key: ${CLAUDE_CODE_API_KEY:-}
      base_url: ${CLAUDE_CODE_BASE_URL:-https://dashscope.aliyuncs.com/apps/anthropic}
      job_tools:
        - add
      permission_mode: bypassPermissions
    codex:
      backend: codex
      app_server: default
      model: *codex_complex_model
      effort: xhigh
      job_tools:
        - add
      approval_mode: deny_all
      sandbox: full-access
