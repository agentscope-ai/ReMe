# LocalAgentRuntime with Chat and Proactive Agent steps; Studio integration is separate.
# Start: reme start config=proactive
# Then: reme manage_proactive_agent action=list
# Configure LLM_API_KEY, LLM_BASE_URL and optionally CODEX_MODEL_NAME.
# Collectors are opt-in. Input files are retained; no automatic resource deletion.
language: zh
reme_agent_dir: reme_agents

service:
  backend: http
  web_enabled: false
  mcp_enabled: true

jobs:
  chat:
    backend: stream
    description: "Chat with the fixed main Agent using its current session."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1}
      required: [query]
    steps:
      - &main_chat
        backend: chat_agent_step
        job_tools: [manage_proactive_agent, manage_inbox, web_extract]

  inbox_chat:
    backend: base
    enable_serve: false
    steps:
      - <<: *main_chat
        backend: inbox_chat_step

  new_chat_session:
    backend: base
    description: "Create and select an empty main session; retain all previous session IDs."
    parameters: {type: object, additionalProperties: false, properties: {}}
    steps:
      - <<: *main_chat
        backend: new_chat_session_step

  list_chat_sessions:
    backend: base
    description: "Global main Chat history, newest first. Pure query; cold listing never creates sessions."
    parameters:
      type: object
      additionalProperties: false
      properties:
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, default: 10}
    steps:
      - backend: list_chat_sessions_step

  screen_capture_cron:
    backend: cron
    enabled: false
    cron: "*/15 * * * *"
    # Enable this collector to publish observations to the work Agent.
    agent_id: work
    steps:
      - backend: screen_capture_step
      - backend: resource_event_step

  manage_proactive_agent:
    backend: base
    description: >-
      Manage named proactive agents: list/create/status/update/delete/query.
      Before create, call list and inspect relevant tasks with status; reuse or update a matching task.
      Choose a short, meaningful English name, unique regardless of letter case, such as experiment_monitor or market_digest.
      Create config requires name (the immutable agent_id), description and trigger_type (cron or event).
      description initializes MEMORY.md at creation; edit task requirements and background in the returned memory_path.
      main and tmp are reserved. Same-name creation restores a deleted Agent and retains its existing memory and history.
      list/update return execution settings, status and memory_path without memory bodies.
      create/status also return memory_content and memory_truncated.
      If memory_truncated is true, read the complete file before editing. Configuration file paths are not returned.
      Before modifying or deleting a task, use status to inspect its current requirements and progress.
      update accepts execution settings only; it does not accept description or change task memory.
      cron requires a cron expression; event accepts min_trigger_interval_seconds.
      Optional config: temporary, enabled, notify_window {start,end} in HH:MM.
      Cron tasks have web access; event tasks use incoming observations and local files.
      Temporary is independent of trigger_type; idle agents are collected after seven days without new inputs.
      query forks the agent session for a temporary read-only answer.
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [list, create, status, update, delete, query]}
        agent_id: &agent_id
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[\w-]+$'
          description: "Immutable Agent creation name."
        config:
          type: object
          additionalProperties: false
          properties:
            name: {<<: *agent_id, description: "Short, meaningful English name, unique regardless of case; immutable agent_id. main and tmp are reserved."}
            description: {type: string, minLength: 1, maxLength: 100000, description: "Create only: initial task requirements and background for MEMORY.md."}
            trigger_type: {type: string, enum: [cron, event]}
            enabled: {type: boolean}
            temporary: {type: boolean, default: false}
            cron: {type: [string, "null"]}
            min_trigger_interval_seconds: {type: number, minimum: 0}
            notify_window:
              type: [object, "null"]
              properties:
                start: {type: string}
                end: {type: string}
              required: [start, end]
              additionalProperties: false
        query: {type: string}
      required: [action]
    steps:
      - backend: manage_proactive_agent_step

  web_extract:
    backend: base
    description: >-
      Read a known HTTP(S) URL (text or PDF, up to 20 MiB by default). Save complete files under resource_dir;
      return workspace-relative paths, source metadata and a bounded text preview. Read saved files for full content.
      HTML source is preserved without executing JavaScript. PDFs are downloaded without text extraction.
    parameters:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, minLength: 1, maxLength: 4096, description: "HTTP or HTTPS URL to read"}
        max_chars:
          type: integer
          minimum: 1
          maximum: 10000
          default: 3000
          description: "Preview character limit; also bounded by the tool output budget"
      required: [url]
    steps:
      - backend: web_extract_step

  append_event:
    backend: base
    description: "Durably append observations to a named agent; source belongs to each event."
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_id: *agent_id
        events:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id: {type: string}
              event_ts: {type: string, format: date-time}
              source: {type: string}
              description: {type: string}
              paths: {type: array, items: {type: string}}
              metadata: {type: object}
            required: [event_ts, source, description]
            additionalProperties: false
      required: [agent_id, events]
    steps:
      - backend: append_event_step

  manage_inbox:
    backend: base
    description: >-
      Read the calling Agent's inbox without changing read state, or mark selected msg_ids read.
      read defaults to unread_only=true with no priority filter; priority optionally selects P0, P1 or P2.
      mark_read is idempotent and means the Agent has processed the messages, not that the user has read them.
      agent_id is bound inside Agent tools and required for external calls.
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [read, mark_read]}
        agent_id: *agent_id
        priority: {type: [string, "null"], enum: [P0, P1, P2, null]}
        unread_only: {type: boolean, default: true}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        msg_ids:
          type: array
          items: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}
          minItems: 1
          maxItems: 100
      required: [action]
    steps:
      - backend: manage_inbox_step

  proactive_run:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - backend: proactive_agent_step
        reminder_history_limit: 10

  proactive_query:
    backend: base
    enable_serve: false
    steps:
      - backend: proactive_query_step

  proactive_loop:
    backend: background
    steps:
      - backend: proactive_loop_step

  inbox_loop:
    backend: background
    steps:
      - backend: inbox_loop_step

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

components:
  event_stream:
    default:
      backend: agent
  agent_runtime:
    default:
      backend: local
      agent_wrapper: default
      event_stream: default
      main:
        description: |
          主人关注 AI 相关的大新闻，以及当前项目的进度、进展、难点和待讨论问题。
      # Initial tasks are created once; existing tasks, including deleted ones, are retained on restart.
      agents:
        - name: finance
          enabled: true
          trigger_type: cron
          cron: "0 * * * *"
          description: |
            主人只关注 AI 相关的大新闻。关注 AI 领域的重要新闻，筛选值得主人了解的重大进展，说明发生了什么、为什么重要，并保留来源。
        - name: work
          enabled: true
          trigger_type: event
          description: |
            关注主人现在正在做哪些项目，逐个跟踪项目的进度、新进展和难点，梳理需要进一步讨论的问题。
            根据收到的资料持续更新项目情况，区分已确认的信息和待确认的问题。
      inbox:
        p0_delay_seconds: 0
        p1_idle_seconds: 10
        p2_idle_seconds: 1800

  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        # Preserve Qwen3.8 Max's actual input limit; put safety headroom in the compaction threshold.
        # At 95% usable context, 600000 leaves 334435 tokens below Codex's hard cap.
        # Budget 128 KiB of new text at one token/byte, not Codex's byte/4 estimate of 32768.
        # Planning allowances: 131072 output + 131072 new text + 32768 estimation/compaction overhead.
        # This soft margin does not enforce request limits or guarantee room for arbitrary text/images.
        - model_context_window=983616
        - model_auto_compact_token_limit=600000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        # Keep review and spawned agents on the configured Qwen endpoint.
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'agents.default_subagent_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'agents.default_subagent_reasoning_effort="xhigh"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'memories.consolidation_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'

      # These capabilities describe Qwen3.8 Max; update them when switching model families.
      # Official limits: https://help.aliyun.com/en/model-studio/qwen3-8-max
      model_catalog:
        models:
          - slug: ${CODEX_MODEL_NAME:-qwen3.8-max}
            display_name: Qwen3.8 Max
            description: Work and life assistant with text and image input
            default_reasoning_level: xhigh
            supported_reasoning_levels:
              - effort: none
                description: Disable thinking
              - effort: low
                description: Light reasoning
              - effort: medium
                description: Balanced reasoning
              - effort: xhigh
                description: Maximum reasoning
            context_window: 983616
            max_context_window: 983616
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            support_verbosity: false
            shell_type: unified_exec
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: []
            truncation_policy:
              mode: bytes
              limit: 10000
            # Agent context comes from PromptHandler.
            model_messages:
              instructions_template: ""

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      model: ${CODEX_MODEL_NAME:-qwen3.8-max}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: full-access
