# LocalAgentRuntime with Chat and Proactive Agent steps.
# Start with LLM_API_KEY, LLM_BASE_URL and optionally REME_MODEL_NAME.
# reme start config=proactive
# Finance and five-minute work observations are enabled. Input files are retained.
language: zh
reme_agent_dir: reme_agents

service:
  backend: http
  web_enabled: false
  mcp_enabled: true

jobs:
  speech_demo:
    backend: base
    description: "Synthesize text, then transcribe the audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    steps:
      - backend: tts_step
        tts: default
      - backend: asr_step
        asr: default

  tts_demo:
    backend: base
    description: "Synthesize text; returns Base64 audio, format and sample rate; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    steps:
      - backend: tts_step
        tts: default

  asr_demo:
    backend: base
    description: "Transcribe Base64-encoded audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        audio: {type: string, minLength: 1, description: "Base64-encoded audio bytes"}
        audio_format: {type: string, enum: [wav, mp3, pcm, opus], default: wav}
        sample_rate: {type: integer, minimum: 1, description: "Audio sample rate in Hz"}
      required: [audio]
    steps:
      - backend: asr_step
        asr: default

  chat:
    backend: stream
    description: "Chat with the fixed Chat Agent using its current session."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1}
      required: [query]
    steps:
      - &chat_step
        backend: chat_agent_step
        job_tools: [manage_proactive_agent]

  inbox_chat:
    backend: base
    enable_serve: false
    steps:
      - <<: *chat_step
        backend: inbox_chat_step
        timeout_seconds: 120

  new_chat_session:
    backend: base
    description: "Create and select an empty chat session; retain all previous session IDs."
    parameters: {type: object, additionalProperties: false, properties: {}}
    steps:
      - <<: *chat_step
        backend: new_chat_session_step

  list_chat_sessions:
    backend: base
    description: "Chat history, newest first. Pure query; cold listing never creates sessions."
    parameters:
      type: object
      additionalProperties: false
      properties:
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, default: 10}
    steps:
      - backend: list_chat_sessions_step

  screen_capture_cron:
    backend: cron
    enabled: false
    cron: "*/5 * * * *"
    # Optional standalone collector; work_observation_cron already captures every display.
    agent_name: work
    steps:
      - backend: screen_capture_step
        similarity_threshold: 0.99
      - backend: resource_event_step

  work_observation_init:
    backend: background
    track_execution: false
    # Establish the baseline on startup, without importing existing dialogue.
    steps:
      - backend: work_observation_init_step
        codex_home: &work_codex_home ${CODEX_HOME:-~/.codex}

  work_observation_cron:
    backend: cron
    cron: "*/5 * * * *"
    steps:
      - backend: work_observation_step
        agent_name: work
        codex_home: *work_codex_home
        screenshot_similarity_threshold: 0.99

  finance_news_cron:
    backend: cron
    cron: "*/5 * * * *"
    steps:
      - backend: finance_news_step
        agent_name: finance

  stock_quotes_cron:
    backend: cron
    cron: "*/5 * * * *"
    # The collector checks each market's trading calendar and skips closed sessions.
    steps:
      - backend: stock_quotes_step
        agent_name: finance

  btc_quotes_cron:
    backend: cron
    cron: "*/5 * * * *"
    # BTC trades continuously; stock trading calendars do not apply.
    steps:
      - backend: btc_quotes_step
        agent_name: finance

  manage_proactive_agent:
    backend: base
    description: >-
      Manage tasks by agent_name: list/create/status/update/delete/query. All parameters are top-level.
      Before creating or changing a task, use list/status to inspect relevant tasks and reuse a matching one.
      Create requires agent_name, task_description and agent_type; cron tasks also require cron.
      Status/update/delete/query require agent_name; query also requires question and an existing queryable task session.
      Creation writes task_description to TASK.md. List, create and status return task_path. Read the current file before editing, preserve valid information, and read it back after saving.
      Choose 1-3 simple lowercase English words joined by underscores, describing the task topic or responsibility. Names must be unique regardless of case; Remy and tmp are reserved.
      Recreating a deleted name restores its task description and history. Read task_path to verify the requirements.
      Update accepts changed execution settings. Edit TASK.md to change the task description.
      Optional settings: enabled, cron, min_trigger_interval_seconds for event tasks, notify_window {start,end} in HH:MM.
      Cron and event tasks can search the web when needed. Event tasks start from incoming observations.
      Temporary is create-only and independent of agent_type; idle temporary tasks are collected after seven days without new inputs.
      Query returns an answer from a temporary read-only fork. Delete retains history; external collectors must be stopped separately.
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [list, create, status, update, delete, query]}
        agent_name: &agent_name
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[\w-]+$'
          description: "Stable Agent name; for new tasks use 1-3 simple lowercase English words joined by underscores. Remy and tmp are reserved for task creation."
        task_description:
          type: string
          minLength: 1
          maxLength: 100000
          description: "Create only: task description written verbatim to TASK.md."
        agent_type: {type: string, enum: [proactive, cron]}
        enabled: {type: boolean}
        temporary: {type: boolean, description: "Create only: collect the task after seven days without new inputs."}
        cron: {type: [string, "null"], description: "Cron expression in the application timezone."}
        min_trigger_interval_seconds: {type: number, minimum: 0, description: "Event processing interval, not collection frequency."}
        notify_window:
          type: [object, "null"]
          properties:
            start: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
            end: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
          required: [start, end]
          additionalProperties: false
        question: {type: string, minLength: 1, maxLength: 100000, description: "Query only: question about the task's completed work."}
      required: [action]
    steps:
      - backend: manage_proactive_agent_step

  append_event:
    backend: base
    description: "Durably append observations to a named agent; source belongs to each event."
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name: *agent_name
        events:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id: {type: string}
              event_ts: {type: string, format: date-time}
              source: {type: string}
              description: {type: string}
              paths: {type: array, items: {type: string}}
              metadata: {type: object}
            required: [event_ts, source, description]
            additionalProperties: false
      required: [agent_name, events]
    steps:
      - backend: append_event_step

  read_inbox:
    backend: base
    enable_serve: false
    description: >-
      Read the selected reminders as agent_name, created_at, message and supporting paths, excluding the reminder Markdown.
      Successful send_chat_msg decisions consume the batch automatically.
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    steps:
      - backend: read_inbox_step

  send_chat_msg:
    backend: base
    enable_serve: false
    description: Send a concise assistant reminder to the source Chat conversation. Empty content means stay quiet.
    parameters:
      type: object
      additionalProperties: false
      properties:
        content: {type: string, maxLength: 100000}
      required: [content]
    steps:
      - backend: send_chat_msg_step

  proactive_run:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - backend: proactive_agent_step
        timeout_seconds: 1200
        sandbox: null  # Use the selected wrapper's sandbox setting.

  proactive_query:
    backend: base
    enable_serve: false
    steps:
      - backend: proactive_query_step

  agent_loop:
    backend: background
    steps:
      - backend: agent_loop_step

  agent_outbox:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name: *agent_name
        offset: &page_offset {type: integer, minimum: 0, default: 0}
        limit: &page_limit {type: integer, minimum: 1, maximum: 100, default: 20}
        state: {type: string, enum: [all, pending, processed], default: all}
      required: [agent_name]
    steps:
    - backend: agent_outbox_step
  agent_reminder:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name: &view_agent_name {<<: *agent_name, default: Remy}
        message_id: {type: string, minLength: 1, maxLength: 128}
        mark_read: {type: boolean, default: false}
      required: [message_id]
    steps:
    - backend: agent_reminder_step
  agent_inbox:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name: *view_agent_name
        offset: *page_offset
        limit: *page_limit
        state: {type: string, enum: [all, pending, processing, processed], default: all}
    steps:
    - backend: agent_inbox_step
  agent_list:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    steps:
    - backend: agent_list_step
  agent_session:
    backend: base
    parameters: &agent_request
      type: object
      additionalProperties: false
      properties:
        agent_name: *view_agent_name
    steps:
    - backend: agent_session_step
  agent_events:
    backend: stream
    parameters: *agent_request
    steps:
    - backend: agent_events_step
    stream_queue_size: 1
  agent_chat:
    backend: stream
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name: *view_agent_name
        query:
          type: string
          minLength: 1
          maxLength: 100000
      required:
      - query
    steps:
    - <<: *chat_step
      backend: agent_chat_step
  agent_new_session:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    steps:
    - <<: *chat_step
      backend: agent_new_session_step
  session_read:
    backend: base
    description: Read session history, including proactive user and assistant messages.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          description: agent session identifier
      required:
      - session_id
    steps:
    - backend: session_read_step
      agent_wrapper: default
  session_status:
    backend: base
    description: Inspect session activity without waiting for generation.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          description: agent session identifier
      required:
      - session_id
    steps:
    - backend: session_status_step
      agent_wrapper: default
  list:
    backend: base
    description: List files under a workspace path.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative dir; empty = root
          default: ''
        recursive:
          type: boolean
          description: recurse
          default: false
        sort_by:
          type: string
          enum:
          - mtime
          description: optional ordering; mtime returns most recently modified files first
        extensions:
          type: array
          items:
            type: string
          description: optional extension allowlist applied before sorting and limiting
        limit:
          type: integer
          description: max results
          default: 100
    steps:
    - backend: list_step
  load:
    backend: base
    description: Load a complete text file for the local editor without agent-output truncation.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative path
      required:
      - path
    steps:
    - backend: load_step
      max_bytes: 5242880
  read_image:
    backend: base
    description: Read an image file as base64 (workspace-relative path).
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative path; common image formats supported (png/jpg/jpeg/webp/gif/bmp/tiff/heic)
      required:
      - path
    steps:
    - backend: read_image_step
      max_bytes: 5242880
  list_tags:
    backend: base
    description: List active tags with file counts. Returns {total_tags, total_pages, page, range, items}; range is the inclusive
      1-based item range and each item is [tag, file_count]. A page past the end returns empty items and range [0, 0].
    parameters:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: 1-based page; values past the end return an empty page
        order_by:
          type: string
          enum:
          - tag
          - file_count
          default: tag
          description: sort by tag or file count
        order:
          type: string
          enum:
          - asc
          - desc
          description: defaults to asc for tag, desc for file_count
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: items per page
    steps:
    - backend: list_tags_step
  search:
    backend: base
    description: Hybrid workspace search (vector + BM25, RRF-fused).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: search query
        limit:
          type: integer
          description: max results
          default: 5
        min_score:
          type: number
          description: Minimum returned score; 0 disables filtering (recommended). Uses native vector or BM25 scores when only
            one branch has hits, and rank-based RRF scores (at most 1/61, about 0.01639) when both have hits. The scale can
            change per query; this is not a normalized relevance threshold.
          default: 0.0
        tags:
          type: array
          items:
            type: string
          description: optional tags filter; a file matches when it contains at least one valid tag
          default: []
        start_date:
          type: string
          description: optional inclusive start date filter (YYYY-MM-DD); results earlier than this date are excluded
        end_date:
          type: string
          description: optional inclusive end date filter (YYYY-MM-DD); results later than this date are excluded
      required:
      - query
    steps:
    - backend: search_step
      vector_weight: 0.7
      candidate_multiplier: 5.0
      expand_links: true
      max_links_per_direction: 10
  index_update_loop:
    backend: background
    watch_dirs:
    - daily_dir
    - digest_dir
    watch_suffixes:
    - md
    steps:
    - backend: init_changes_step
      monitor_type: file_store
      monitor_name: default
      dispatch_steps:
      - update_index_step
    - backend: watch_changes_step
      watch_mode: awatch
      monitor_type: file_store
      dispatch_steps:
      - backend: update_index_step
        persist: false
  list_tag_files:
    backend: base
    description: Browse existing files matching any selected memory tag, within a workspace directory.
    parameters:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          minItems: 1
        path:
          type: string
          default: ''
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      required:
      - tags
    steps:
    - backend: list_tag_files_step

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

components:
  asr:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-asr-flash
      timeout: 60
  tts:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-tts-plus
      voice: longanhuan_v3.1
      audio_format: mp3
      sample_rate: 22050
      timeout: 60
  agent_inbox:
    default:
      backend: event
  agent_runtime:
    default:
      backend: local
      agent_wrapper: default
      inbox: default
      chat:
        initial_memory: |
          主人关注 AI 相关的大新闻，以及当前项目的进度、进展、难点和待讨论问题。
      # Initial descriptions are written verbatim to TASK.md when creating tasks.
      agents:
        - agent_name: finance
          enabled: true
          agent_type: proactive
          min_trigger_interval_seconds: 10
          max_batch_events: 20
          task_description: |
            帮我关注 AI 领域的大新闻，以及小米、阿里巴巴、腾讯、苹果、亚马逊、Meta 和 BTC/USDT 的行情。
            出现重大 AI 新闻，或这些标的日内振幅超过 5% 时提醒我，结合财联社新闻简单说明发生了什么、可能的影响和来源。
            其他信息正常记录，不用提醒。同一件事避免重复提醒，数据有延迟或不完整时请注明。
        - agent_name: work
          max_batch_events: 2
          enabled: true
          agent_type: proactive
          task_description: |
            帮我梳理目前在做的项目，跟进各个项目的进展和难点，整理需要进一步讨论的问题。
        - agent_name: tech_news
          enabled: true
          agent_type: cron
          cron: "0 8 * * *"
          task_description: |
            每天早上8点帮我整理一份科技早报，汇总过去24小时的重要科技新闻，简要说明要点和影响，并附上来源链接。整理好后提醒我查看。

  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        # Disable automatic repository AGENTS.md loading for every Agent on this server.
        - project_doc_max_bytes=0
        # Keep the configured input budget; put safety headroom in the compaction threshold.
        # At 95% usable context, 600000 leaves 334435 tokens below Codex's hard cap.
        # Budget 128 KiB of new text at one token/byte, not Codex's byte/4 estimate of 32768.
        # Planning allowances: 131072 output + 131072 new text + 32768 estimation/compaction overhead.
        # This soft margin does not enforce request limits or guarantee room for arbitrary text/images.
        - model_context_window=983616
        - model_auto_compact_token_limit=600000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        - sandbox_workspace_write.network_access=false
        - 'web_search="live"'
        # Enable JavaScript tool orchestration and waiting.
        - features.code_mode=true
        - features.sleep_tool=true

        # Keep review and inherited Agent defaults on the configured Qwen endpoint.
        - 'model="${REME_MODEL_NAME:-qwen4-max}"'
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${REME_MODEL_NAME:-qwen4-max}"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${REME_MODEL_NAME:-qwen4-max}"'
        - 'memories.consolidation_model="${REME_MODEL_NAME:-qwen4-max}"'

      # Local Codex capability settings for the configured Qwen model.
      model_catalog:
        models:
          - slug: ${REME_MODEL_NAME:-qwen4-max}
            display_name: Qwen4 Max
            description: Work and life assistant with text and image input
            base_instructions: ""
            default_reasoning_level: xhigh
            supported_reasoning_levels:
              - effort: none
                description: Disable thinking
              - effort: low
                description: Light reasoning
              - effort: medium
                description: Balanced reasoning
              - effort: xhigh
                description: Maximum reasoning
            context_window: 983616
            max_context_window: 983616
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            supports_reasoning_summaries: false
            supports_parallel_tool_calls: false
            support_verbosity: false
            shell_type: unified_exec
            apply_patch_tool_type: freeform
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: [clock]
            truncation_policy:
              mode: bytes
              limit: 10000
            # Agent context comes from PromptHandler.
            model_messages:
              instructions_template: ""

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      project_path: ..  # Resolve repository skills from the default <project>/.reme workspace.
      cwd: .
      skills: [manage-proactive-agent]
      model: ${REME_MODEL_NAME:-qwen4-max}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: workspace-write

  file_graph:
    default:
      backend: local
  file_catalog:
    default:
      backend: local
  file_chunker:
    markdown:
      backend: markdown
      supported_extensions:
      - md
      embed_toc: true
      max_ast_sections: 100
      include_frontmatter_in_metadata: false
      include_frontmatter_keys_in_metadata: []
    json:
      backend: json
      supported_extensions:
      - json
    jsonl:
      backend: jsonl
      supported_extensions:
      - jsonl
    default:
      backend: default
      supported_extensions:
      - txt
      - log
  keyword_index:
    default:
      backend: bm25
      tokenizer: default
  tag_index:
    default:
      backend: local
      tag_key: memory_tags
      max_tags_per_file: 3
      max_tag_length: 64
  file_store:
    default:
      backend: local
      store_name: local
      embedding_store: ''
      keyword_index: default
      file_graph: default
      tag_index: default
  tokenizer:
    default:
      backend: regex
