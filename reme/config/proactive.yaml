# Studio workspace with MCP and a full-access Codex chat agent using API-key authentication.
# Set LLM_API_KEY / LLM_BASE_URL (and optionally CODEX_MODEL_NAME) for chat.
# Custom LLM_BASE_URL endpoints must support the Responses API.
# Start: reme start config=proactive
# Open: http://127.0.0.1:2333

service:
  backend: http
  web_enabled: true
  mcp_enabled: true

jobs:
  # Keep Markdown search and graph data in sync with the workspace files.
  index_update_loop:
    backend: background
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    steps:
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
      - backend: watch_changes_step
        monitor_type: file_store
        dispatch_steps:
          - backend: update_index_step
            persist: false

  chat:
    backend: stream
    description: "Stream a full-access Codex conversation with the prome assistant."
    system_prompt: |
      你是 prome（proactive ReMe），主人的工作与生活管家。
      始终称呼用户为“主人”，使用主人的语言自然交流，回答清晰、简洁、务实。
    parameters:
      type: object
      properties:
        query: {type: string, description: "user message"}
        session_id: {type: string, description: "agent session to resume"}
        system_prompt: {type: string, description: "optional system prompt override"}
      required: [query]
    steps:
      - backend: chat_step
        agent_wrapper: default
        job_tools: []

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

  status:
    backend: base
    description: "Report component memory estimates and process RSS."
    steps:
      - backend: status_step

  health_check:
    backend: base
    description: "Return a concise health-check snapshot of ReMe components."
    steps:
      - backend: health_check_step

  graph_snapshot:
    backend: base
    description: "Return the category-rooted digest wikilink graph with daily-note leaves."
    steps:
      - backend: graph_snapshot_step

  reindex:
    backend: base
    description: "Rebuild the local BM25 index from already-ingested chunks."
    parameters:
      type: object
      properties:
        scope: {type: string, enum: [all, bm25], default: all}
    steps:
      - backend: reindex_step

  list:
    backend: base
    description: "List files under a workspace path."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative directory; empty = root", default: ""}
        recursive: {type: boolean, default: false}
        sort_by: {type: string, enum: [mtime]}
        extensions: {type: array, items: {type: string}}
        limit: {type: integer, default: 100}
    steps:
      - backend: list_step

  load:
    backend: base
    description: "Load a complete text file for the local editor without agent-output truncation."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
      required: [path]
    steps:
      - backend: load_step
        max_bytes: 5242880

  save:
    backend: base
    description: "Save text verbatim, optionally rejecting external changes since the file was opened."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
        content: {type: string, description: "complete file content, including frontmatter"}
        expected_mtime: {type: string, description: "optional ISO mtime returned by load/stat"}
      required: [path, content]
    steps:
      - backend: save_step

components:
  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      # Keep Codex's built-in model metadata and base instructions.
      config_overrides:
        - features.memories=true
        - 'memories.extract_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'memories.consolidation_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      model: ${CODEX_MODEL_NAME:-qwen3.8-max}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: full-access

  tokenizer:
    default:
      backend: regex

  keyword_index:
    default:
      backend: bm25
      tokenizer: default

  file_graph:
    default:
      backend: local

  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]

  file_store:
    default:
      backend: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
