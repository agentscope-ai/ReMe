# Studio workspace with MCP and a full-access Codex chat agent using API-key authentication.
# Set LLM_API_KEY / LLM_BASE_URL (and optionally CODEX_MODEL_NAME) for chat.
# Custom LLM_BASE_URL endpoints must support the Responses API.
# Start: reme start config=proactive
# Open: http://127.0.0.1:2333
# Temporary assets live under resource/; keep permanent assets outside it.
# Connectors return {context, paths}; independent task schedules check screens every five minutes and finance hourly.
# Resource retention scans file mtimes daily and does not use a catalog.

language: zh
metadata_dir: reme_metadata

service:
  backend: http
  web_enabled: true
  mcp_enabled: true
  timeout_graceful_shutdown: 5  # Cancel open subscriptions before application shutdown.

jobs:
  index_update_loop:
    backend: background
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    steps:
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
      - backend: watch_changes_step
        watch_mode: awatch
        monitor_type: file_store
        dispatch_steps:
          - backend: update_index_step
            persist: false

  cron_agent:
    backend: base
    enable_serve: false
    track_execution: true
    description: "Execute a task, optionally publish cumulative findings, and prepare an internal handoff in the same session."
    parameters:
      type: object
      additionalProperties: false
      properties:
        task: {type: object, description: "Complete cron.json task: id, cron, query and enabled"}
      required: [task]
    steps:
      - backend: cron_agent_step
        agent_wrapper: default
        job_tools: [screen_capture, finance_news, get_chat_messages, send_chat_message_immediate]

  speech_demo:
    backend: base
    description: "Speech round trip: synthesize text, then transcribe the generated audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, description: "Text to synthesize and recognize"}
      required: [text]
    steps:
      - backend: tts_step
        tts: default
      - backend: asr_step
        asr: default

  tts_demo:
    backend: base
    description: "Synthesize text; returns Base64 audio with its format and sample rate; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    steps:
      - backend: tts_step
        tts: default

  asr_demo:
    backend: base
    description: "Transcribe Base64-encoded audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        audio: {type: string, minLength: 1, description: "Base64-encoded audio bytes"}
        audio_format: {type: string, enum: [wav, mp3, pcm, opus], default: wav}
        sample_rate: {type: integer, minimum: 1, description: "Audio sample rate in Hz; omit for encoded audio"}
      required: [audio]
    steps:
      - backend: asr_step
        asr: default

  screen_capture:
    backend: base
    description: "Compare displays by stable identity; return context and changed original-size PNG paths, or paths=[] when unchanged."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: screen_capture_step
        screen_capture: default

  finance_news:
    backend: base
    description: "Fetch the last 24 hours of CLS news; save only new IDs in JSONL. Read the returned paths for news content."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: finance_news_step

  check_json:
    backend: base
    description: "Parse a complete JSON file; return its value or a path, line, column and error. Does not modify files."
    parameters:
      type: object
      additionalProperties: false
      properties:
        path: {type: string, minLength: 1, description: "workspace-relative JSON file path"}
      required: [path]
    steps:
      - backend: check_json_step

  resource_cleanup_cron:
    backend: cron
    cron: "0 3 * * *"  # Daily at 03:00 in the application timezone, independently of agent wakeups.
    steps:
      - backend: cleanup_resources_step
        ttl_days: 7

  reminder_delivery:
    backend: background
    steps:
      - backend: reminder_delivery_step

  pa_loop:
    backend: background
    steps:
      - backend: pa_loop_step

  cron_schedule:
    backend: background
    steps:
      - backend: cron_schedule_step

  temp_proactive:
    backend: background
    steps:
      - backend: temp_proactive_step
        agent_wrapper: default
        job_tools: [screen_capture, finance_news, send_chat_message_immediate]

  pa_proactive:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - backend: proactive_agent_step
        agent_wrapper: default
        max_turns: 10
        job_tools: [read_conversation, read_proactive_inbox, read_cron_results, screen_capture, get_chat_messages, send_chat_message, check_json]

  read_conversation:
    backend: base
    enable_serve: false
    track_execution: true
    description: "Consume newly completed Main chat rounds, newest ten by default. Checkpoint text before advancing session cursors; excludes tools and proactive messages."
    parameters:
      type: object
      additionalProperties: false
      properties:
        max_turns: {type: integer, minimum: 1, maximum: 100, default: 10}
    steps:
      - backend: read_conversation_step

  read_cron_results:
    backend: base
    enable_serve: false
    track_execution: true
    description: "Consume up to three latest unread result paths per configured cron task; read the files. Full inputs are checkpointed before acknowledgement. Excludes temporary tasks."
    parameters:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 3, default: 3, description: "Maximum unread documents per task"}
      additionalProperties: false
    steps:
      - backend: read_cron_results_step

  write_proactive_inbox:
    backend: base
    enable_serve: false
    description: "Queue a message in the Markdown inbox for Proactive to handle on its next wakeup, including settings requests."
    parameters:
      type: object
      additionalProperties: false
      properties:
        message: {type: string, minLength: 1, description: "User feedback or instructions for the proactive agent"}
      required: [message]
    steps:
      - backend: write_proactive_inbox_step

  read_proactive_inbox:
    backend: base
    enable_serve: false
    description: "Checkpoint new or edited Main feedback, then return input_path/round_id and receipt_path for complete native reading; retain source Markdown."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: read_proactive_inbox_step

  send_chat_message:
    backend: base
    enable_serve: false
    description: "Submit one Proactive decision for Main chat after ten continuous idle seconds. New content supersedes the older pending message; empty content withdraws it."
    parameters:
      type: object
      additionalProperties: false
      properties:
        content: {type: string, maxLength: 4000, description: "Concise but complete findings with necessary context and evidence; empty withdraws pending content."}
        kind: {type: string, enum: [normal, morning, midday, evening], default: normal, description: "Greeting kinds require this round's matching hint"}
      required: [content]
    steps:
      - backend: send_chat_message_step

  send_chat_message_immediate:
    backend: base
    enable_serve: false
    description: "Send a published cron finding or temporary task result immediately; bypass ordinary notification windows and quiet settings."
    parameters:
      type: object
      additionalProperties: false
      properties:
        content: {type: string, minLength: 1, maxLength: 3980, description: "The answer Master requested. State conclusions and necessary reasons once, with sources and limitations where they matter; keep execution details internal."}
      required: [content]
    steps:
      - backend: send_chat_message_immediate_step

  get_chat_messages:
    backend: base
    enable_serve: false
    description: "Read injected messages with their complete content and latest delivery states, newest first; does not consume records or return full chat history."
    parameters:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, default: 10}
        offset: {type: integer, minimum: 0, default: 0, description: "Skip this many records from the current end"}
    steps:
      - backend: get_chat_messages_step

  manage_temp_proactive_agent:
    backend: base
    enable_serve: false
    description: "List, create, update, pause, resume or cancel one-shot Main tasks. List returns items and total, including task IDs and states. Create requires query; update/pause/resume/cancel require task_id. Preparation forks Main after the current turn."
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [list, create, update, pause, resume, cancel]}
        task_id: {type: string, minLength: 1, description: "Required for update/pause/resume/cancel; use an ID returned by list or create"}
        query: {type: string, minLength: 1, description: "Required for create; optional for update"}
        run_at: {type: string, format: date-time, description: "Create/update only; timezone-aware, mutually exclusive with delay_minutes"}
        delay_minutes: {type: number, minimum: 0, description: "Delay in minutes, including fractions (0.5 = 30 seconds); create/update only; create omitting time starts immediately"}
        request_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: "Create only; optional stable idempotency key"}
      required: [action]
    steps:
      - backend: manage_temp_proactive_agent_step

  proactive_inbox_view:
    backend: base
    description: "Read-only Desktop view of Proactive task results and instructions; never consumes inputs."
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [list, read], default: list}
        kind: {type: string, enum: [all, task_result, instruction], default: all}
        filter: {type: string, enum: [all, pending, unread], default: all}
        task_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$"}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        entry_id: {type: string, minLength: 1, maxLength: 8192}
    steps:
      - backend: proactive_inbox_view_step

  task_results:
    backend: base
    description: "Browse published task results or read one with an explicit user-read receipt; independent of Proactive consumption."
    parameters:
      type: object
      additionalProperties: false
      properties:
        action: {type: string, enum: [list, read], default: list}
        task_id: {type: string, minLength: 1}
        unread: {type: boolean, default: false}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}
        path: {type: string, minLength: 1}
        mark_read: {type: boolean, default: false}
    steps:
      - backend: task_results_step

  pa_chat:
    backend: stream
    description: "Chat with Remy using personal memory, native tools and proactive-agent feedback."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, description: "user message"}
      required: [query]
    steps:
      - &pa_options
        backend: pa_chat_step
        agent_wrapper: default
        job_tools: [screen_capture, check_json, write_proactive_inbox, manage_temp_proactive_agent]

  pa_events:
    backend: stream
    stream_queue_size: 1
    description: "Subscribe to current PA session changes; replay a cursor or reset to a fresh snapshot."
    parameters:
      type: object
      additionalProperties: false
      properties:
        cursor: {type: string, maxLength: 128, description: "Opaque cursor from the last applied PA event"}
    steps:
      - backend: pa_events_step
        agent_wrapper: default

  pa_session:
    backend: base
    description: "Return the current agent session ID and activity status; does not create a session."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: pa_session_step
        agent_wrapper: default

  pa_new_session:
    backend: base
    description: "Prepare personal memory and select an empty Codex session; return its ID without generating a reply."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - <<: *pa_options
        backend: pa_new_session_step

  pa_select_session:
    backend: base
    description: "Select an existing source Main conversation while chat is idle."
    parameters:
      type: object
      additionalProperties: false
      properties:
        session_id: {type: string, minLength: 1}
      required: [session_id]
    steps:
      - backend: pa_select_session_step
        agent_wrapper: default

  session_read:
    backend: base
    description: "Read session history, including proactive assistant messages."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_read_step
        agent_wrapper: default

  session_status:
    backend: base
    description: "Inspect session activity without waiting for generation."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_status_step
        agent_wrapper: default

  session_append:
    backend: base
    description: "Append a proactive assistant message once the session is idle; retry with the same message_id."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
        message_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: "stable retry/idempotency identifier"}
        content: {type: string, minLength: 1, maxLength: 100000}
        wait_timeout: {type: number, exclusiveMinimum: 0, default: 30}
      required: [session_id, message_id, content]
    steps:
      - backend: session_append_step
        agent_wrapper: default

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

  status:
    backend: base
    description: "Report component memory estimates and process RSS."
    steps:
      - backend: status_step

  health_check:
    backend: base
    description: "Return a concise health-check snapshot of ReMe components."
    steps:
      - backend: health_check_step

  reindex:
    backend: base
    description: "Rebuild the local BM25 index from already-ingested chunks."
    parameters:
      type: object
      properties:
        scope: {type: string, enum: [all, bm25], default: all}
    steps:
      - backend: reindex_step

  list_tags:
    backend: base
    description: "List active memory tags with workspace-wide file counts."
    parameters:
      type: object
      properties:
        page: {type: integer, minimum: 1, default: 1}
        page_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
        order_by: {type: string, enum: [tag, file_count], default: tag}
        order: {type: string, enum: [asc, desc]}
    steps:
      - backend: list_tags_step

  list_tag_files:
    backend: base
    description: "Browse existing files matching any selected memory tag, within a workspace directory."
    parameters:
      type: object
      properties:
        tags: {type: array, items: {type: string}, minItems: 1}
        path: {type: string, default: ""}
        page: {type: integer, minimum: 1, default: 1}
        page_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
      required: [tags]
    steps:
      - backend: list_tag_files_step

  search:
    backend: base
    description: "Search local Markdown memories with BM25 and optional memory-tag filters; no model calls."
    parameters:
      type: object
      properties:
        query: {type: string}
        tags: {type: array, items: {type: string}, default: []}
        limit: {type: integer, minimum: 1, default: 20}
        search_filter:
          type: object
          properties:
            path_prefix: {type: string}
      required: [query]
    steps:
      - backend: search_step
        vector_weight: 0.0
        expand_links: false

  list:
    backend: base
    description: "List files under a workspace path."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative directory; empty = root", default: ""}
        recursive: {type: boolean, default: false}
        sort_by: {type: string, enum: [mtime]}
        extensions: {type: array, items: {type: string}}
        limit: {type: integer, default: 100}
    steps:
      - backend: list_step

  load:
    backend: base
    description: "Load a complete text file for the local editor without agent-output truncation."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
      required: [path]
    steps:
      - backend: load_step
        max_bytes: 5242880

  save:
    backend: base
    description: "Save text verbatim, optionally rejecting external changes since the file was opened."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
        content: {type: string, description: "complete file content, including frontmatter"}
        expected_mtime: {type: string, description: "optional ISO mtime returned by load/stat"}
      required: [path, content]
    steps:
      - backend: save_step

components:
  asr:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-asr-flash
      timeout: 60

  tts:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-tts-plus
      voice: longanhuan_v3.1
      parameters:
        instruction: "请用甜美、轻盈、软萌的少女女声朗读。"
      audio_format: mp3
      sample_rate: 22050
      timeout: 60

  screen_capture:
    default:
      backend: local
      timeout: 90
      long_edge: 1280
      pixel_delta: 20
      changed_ratio: 0.0005
      tile_size: 32
      tile_stride: 16
      tile_changed_ratio: 0.015
      ignore_clock: true

  pa:
    default:
      backend: local
      agent_wrapper: default
      max_events: 512
      max_buffer_bytes: 4194304
      heartbeat_seconds: 15
      default_proactive:
        start_time: "0700"
        end_time: "2330"
        interval_minutes: 5
        tasks_follow_active_hours: true
        hints_enabled: true
        hint_probabilities:
          morning: 1.0
          midday: 0.5
          evening: 0.5
      default_tasks:
        - id: screen_activity
          cron: "*/5 * * * *"
          query: "通过截屏看看主人在干啥"
          enabled: true
        - id: finance_news
          cron: "0 * * * *"
          query: "看看有什么主人喜欢的财经新闻"
          enabled: true
        - id: daily_fresh_news
          cron: "0 8,12,18 * * *"
          query: "搜索下今天有什么主人喜欢的新鲜事"
          enabled: true

  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        - 'web_search="live"'
        # Tested client budget; this is not the provider's maximum context size.
        - model_context_window=65536
        - model_auto_compact_token_limit=56000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        # Keep review, subagents and native memory on the selected model.
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'agents.default_subagent_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'agents.default_subagent_reasoning_effort="xhigh"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'memories.consolidation_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'

      # Qwen 3.8 Max with the requested xhigh profile and text/image input.
      # Switching CODEX_MODEL_NAME also requires reviewing the catalog capabilities.
      model_catalog:
        models:
          - slug: ${CODEX_MODEL_NAME:-qwen3.8-max-0902}
            display_name: Qwen 3.8 Max 0902
            description: Work and life assistant with text and image input
            default_reasoning_level: xhigh
            multi_agent_reasoning_effort: xhigh
            supported_reasoning_levels:
              - effort: xhigh
                description: Maximum reasoning
            context_window: 65536
            max_context_window: 65536
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            support_verbosity: false
            shell_type: unified_exec
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: []
            truncation_policy:
              mode: bytes
              limit: 10000
            # PA instructions come from PromptHandler.
            model_messages:
              instructions_template: ""

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      # model: ${CODEX_MODEL_NAME:-kimi-k3.1-pro}
      model: ${CODEX_MODEL_NAME:-qwen3.8-max-0902}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: full-access

  tokenizer:
    default:
      backend: regex

  keyword_index:
    default:
      backend: bm25
      tokenizer: default

  file_graph:
    default:
      backend: local

  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]

  file_store:
    default:
      backend: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
      tag_index: default

  tag_index:
    default:
      backend: local
      tag_key: memory_tags
      max_tags_per_file: 3
      max_tag_length: 64
