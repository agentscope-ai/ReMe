# Studio workspace with MCP and a full-access Codex chat agent using API-key authentication.
# Set LLM_API_KEY / LLM_BASE_URL (and optionally CODEX_MODEL_NAME) for chat.
# Custom LLM_BASE_URL endpoints must support the Responses API.
# Start: reme start config=proactive
# Open: http://127.0.0.1:2333
# Temporary assets live under resource/; keep permanent assets outside it.
# Connectors return {context, paths}; independent task schedules check screens every five minutes and finance hourly.
# Resource retention scans file mtimes daily and does not use a catalog.

language: zh
metadata_dir: reme_metadata

service:
  backend: http
  web_enabled: true
  mcp_enabled: true
  timeout_graceful_shutdown: 5  # Cancel open subscriptions before application shutdown.

jobs:
  index_update_loop:
    backend: background
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    steps:
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
      - backend: watch_changes_step
        watch_mode: awatch
        monitor_type: file_store
        dispatch_steps:
          - backend: update_index_step
            persist: false

  task_agent:
    backend: base
    enable_serve: false
    track_execution: true
    description: "Execute a scheduled task, then publish a cumulative Markdown summary in the same fresh agent session."
    parameters:
      type: object
      additionalProperties: false
      properties:
        task: {type: object, description: "Complete task definition from tasks.json: id, cron, query and enabled"}
      required: [task]
    steps:
      - backend: task_agent_step
        agent_wrapper: default
        job_tools: [screen_capture, finance_news]

  speech_demo:
    backend: base
    description: "Speech round trip: synthesize text, then transcribe the generated audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, description: "Text to synthesize and recognize"}
      required: [text]
    steps:
      - backend: tts_step
        tts: default
      - backend: asr_step
        asr: default

  tts_demo:
    backend: base
    description: "Synthesize text; returns Base64 audio with its format and sample rate; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    steps:
      - backend: tts_step
        tts: default

  asr_demo:
    backend: base
    description: "Transcribe Base64-encoded audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        audio: {type: string, minLength: 1, description: "Base64-encoded audio bytes"}
        audio_format: {type: string, enum: [wav, mp3, pcm, opus], default: wav}
        sample_rate: {type: integer, minimum: 1, description: "Audio sample rate in Hz; omit for encoded audio"}
      required: [audio]
    steps:
      - backend: asr_step
        asr: default

  screen_capture:
    backend: base
    description: "Capture each display as an original-size PNG; return textual context and workspace-relative paths."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: screen_capture_step

  finance_news:
    backend: base
    description: "Fetch the last 24 hours of CLS news; save only new IDs in JSONL. Read the returned paths for news content."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: finance_news_step

  check_json:
    backend: base
    description: "Parse a complete JSON file; return its value or a path, line, column and error. Does not modify files."
    parameters:
      type: object
      additionalProperties: false
      properties:
        path: {type: string, minLength: 1, description: "workspace-relative JSON file path"}
      required: [path]
    steps:
      - backend: check_json_step

  resource_cleanup_cron:
    backend: cron
    cron: "0 3 * * *"  # Daily at 03:00 in the application timezone, independently of agent wakeups.
    steps:
      - backend: cleanup_resources_step
        ttl_days: 7

  reminder_delivery:
    backend: background
    steps:
      - backend: reminder_delivery_step

  pa_loop:
    backend: background
    steps:
      - backend: pa_loop_step

  task_schedule:
    backend: background
    steps:
      - backend: task_schedule_step

  pa_proactive:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - backend: proactive_agent_step
        agent_wrapper: default
        max_turns: 20
        job_tools: [get_proactive_messages, read_conversation, read_task_results, screen_capture, get_reminder, send_reminder, check_json]

  read_task_results:
    backend: base
    enable_serve: false
    track_execution: true
    description: "Return up to three latest unread summary paths per configured task; read the files. Full inputs are checkpointed before acknowledgement."
    parameters:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 3, default: 3, description: "Maximum unread documents per task"}
      additionalProperties: false
    steps:
      - backend: read_task_results_step

  send_to_proactive:
    backend: base
    enable_serve: false
    description: "Append timestamped user feedback to the proactive agent's persistent text inbox."
    parameters:
      type: object
      additionalProperties: false
      properties:
        message: {type: string, minLength: 1, description: "User feedback or instructions for the proactive agent"}
      required: [message]
    steps:
      - backend: send_to_proactive_step

  get_proactive_messages:
    backend: base
    enable_serve: false
    description: "Return all queued chat-agent feedback as text and clear the inbox; empty inbox returns an empty string."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: get_proactive_messages_step

  read_conversation:
    backend: base
    enable_serve: false
    description: >-
      Read unread completed chat rounds across the latest 100 sessions, with time, session ID and role.
      Keep each user input with its replies, excluding tool calls and proactive messages. Return one oldest-first string,
      prioritizing the latest 20 rounds within output limits; persist read cursors. Older rounds are omitted.
      No new rounds returns an empty string. Consumed inputs are checkpointed during proactive rounds.
    parameters:
      type: object
      additionalProperties: false
      properties:
        max_turns: {type: integer, minimum: 1, maximum: 100, default: 20}
        max_message_chars: {type: integer, minimum: 1, maximum: 32000, default: 2000}
        max_chars: {type: integer, minimum: 1, maximum: 32000, default: 20000, description: "Total output character budget"}
    steps:
      - backend: read_conversation_step

  send_reminder:
    backend: base
    enable_serve: false
    description: "Submit a reminder: inject if idle or return pending for background delivery after 10 idle seconds. Empty content withdraws pending content."
    parameters:
      type: object
      additionalProperties: false
      properties:
        content: {type: string, maxLength: 200, description: "Brief conversational reminder; empty string withdraws pending content and skips sending"}
        kind: {type: string, enum: [normal, morning, midday, evening], description: "Use a special kind only with this round's matching hint; evening closes proactive communication until the next opening"}
      required: [content, kind]
    steps:
      - backend: send_reminder_step

  get_reminder:
    backend: base
    enable_serve: false
    description: "Read each reminder's latest pending/sent/discarded/failed state, newest creation first; read-only. Defaults to the latest 10."
    parameters:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, default: 10}
        offset: {type: integer, minimum: 0, default: 0, description: "Skip this many records from the current end"}
    steps:
      - backend: get_reminder_step

  pa_chat:
    backend: stream
    description: "Chat with Remy using personal memory, native tools and proactive-agent feedback."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, description: "user message"}
      required: [query]
    steps:
      - &pa_options
        backend: pa_chat_step
        agent_wrapper: default
        job_tools: [screen_capture, check_json, send_to_proactive]

  pa_events:
    backend: stream
    stream_queue_size: 1
    description: "Subscribe to current PA session changes; replay a cursor or reset to a fresh snapshot."
    parameters:
      type: object
      additionalProperties: false
      properties:
        cursor: {type: string, maxLength: 128, description: "Opaque cursor from the last applied PA event"}
    steps:
      - backend: pa_events_step
        agent_wrapper: default

  pa_session:
    backend: base
    description: "Return the current agent session ID and activity status; does not create a session."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - backend: pa_session_step
        agent_wrapper: default

  pa_new_session:
    backend: base
    description: "Prepare personal memory and select an empty Codex session; return its ID without generating a reply."
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    steps:
      - <<: *pa_options
        backend: pa_new_session_step

  session_read:
    backend: base
    description: "Read session history, including proactive assistant messages."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_read_step
        agent_wrapper: default

  session_status:
    backend: base
    description: "Inspect session activity without waiting for generation."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_status_step
        agent_wrapper: default

  session_append:
    backend: base
    description: "Append a proactive assistant message once the session is idle; retry with the same message_id."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
        message_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: "stable retry/idempotency identifier"}
        content: {type: string, minLength: 1, maxLength: 100000}
        wait_timeout: {type: number, exclusiveMinimum: 0, default: 30}
      required: [session_id, message_id, content]
    steps:
      - backend: session_append_step
        agent_wrapper: default

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

  status:
    backend: base
    description: "Report component memory estimates and process RSS."
    steps:
      - backend: status_step

  health_check:
    backend: base
    description: "Return a concise health-check snapshot of ReMe components."
    steps:
      - backend: health_check_step

  reindex:
    backend: base
    description: "Rebuild the local BM25 index from already-ingested chunks."
    parameters:
      type: object
      properties:
        scope: {type: string, enum: [all, bm25], default: all}
    steps:
      - backend: reindex_step

  list_tags:
    backend: base
    description: "List active memory tags with workspace-wide file counts."
    parameters:
      type: object
      properties:
        page: {type: integer, minimum: 1, default: 1}
        page_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
        order_by: {type: string, enum: [tag, file_count], default: tag}
        order: {type: string, enum: [asc, desc]}
    steps:
      - backend: list_tags_step

  list_tag_files:
    backend: base
    description: "Browse existing files matching any selected memory tag, within a workspace directory."
    parameters:
      type: object
      properties:
        tags: {type: array, items: {type: string}, minItems: 1}
        path: {type: string, default: ""}
        page: {type: integer, minimum: 1, default: 1}
        page_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
      required: [tags]
    steps:
      - backend: list_tag_files_step

  search:
    backend: base
    description: "Search local Markdown memories with BM25 and optional memory-tag filters; no model calls."
    parameters:
      type: object
      properties:
        query: {type: string}
        tags: {type: array, items: {type: string}, default: []}
        limit: {type: integer, minimum: 1, default: 20}
        search_filter:
          type: object
          properties:
            path_prefix: {type: string}
      required: [query]
    steps:
      - backend: search_step
        vector_weight: 0.0
        expand_links: false

  list:
    backend: base
    description: "List files under a workspace path."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative directory; empty = root", default: ""}
        recursive: {type: boolean, default: false}
        sort_by: {type: string, enum: [mtime]}
        extensions: {type: array, items: {type: string}}
        limit: {type: integer, default: 100}
    steps:
      - backend: list_step

  load:
    backend: base
    description: "Load a complete text file for the local editor without agent-output truncation."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
      required: [path]
    steps:
      - backend: load_step
        max_bytes: 5242880

  save:
    backend: base
    description: "Save text verbatim, optionally rejecting external changes since the file was opened."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
        content: {type: string, description: "complete file content, including frontmatter"}
        expected_mtime: {type: string, description: "optional ISO mtime returned by load/stat"}
      required: [path, content]
    steps:
      - backend: save_step

components:
  asr:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-asr-flash
      timeout: 60

  tts:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-tts-plus
      voice: longanhuan_v3.1
      parameters:
        instruction: "请用甜美、轻盈、软萌的少女女声朗读，语气亲切、活泼自然，吐字清晰，避免夸张。"
      audio_format: mp3
      sample_rate: 22050
      timeout: 60

  pa:
    default:
      backend: local
      agent_wrapper: default
      max_events: 512
      max_buffer_bytes: 4194304
      heartbeat_seconds: 15
      default_proactive:
        start_time: "0900"
        end_time: "2300"
        interval_minutes: 5
        tasks_follow_active_hours: true
        hints_enabled: true
        hint_probabilities:
          morning: 1.0
          midday: 0.5
          evening: 0.5
      default_tasks:
        - id: screen_activity
          cron: "*/5 * * * *"
          query: "通过截屏看看主人在干啥"
          enabled: true
        - id: finance_news
          cron: "0 * * * *"
          query: "看看有什么主人喜欢的财经新闻"
          enabled: true

  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        - 'web_search="live"'
        # Tested client budget; this is not the provider's maximum context size.
        - model_context_window=65536
        - model_auto_compact_token_limit=56000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        # Keep review, subagents and native memory on the selected model.
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'agents.default_subagent_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'agents.default_subagent_reasoning_effort="xhigh"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'
        - 'memories.consolidation_model="${CODEX_MODEL_NAME:-qwen3.8-max-0902}"'

      # Qwen 3.8 Max with the requested xhigh profile and text/image input.
      # Switching CODEX_MODEL_NAME also requires reviewing the catalog capabilities.
      model_catalog:
        models:
          - slug: ${CODEX_MODEL_NAME:-qwen3.8-max-0902}
            display_name: Qwen 3.8 Max 0902
            description: Work and life assistant with text and image input
            default_reasoning_level: xhigh
            multi_agent_reasoning_effort: xhigh
            supported_reasoning_levels:
              - effort: xhigh
                description: Maximum reasoning
            context_window: 65536
            max_context_window: 65536
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            support_verbosity: false
            shell_type: unified_exec
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: []
            truncation_policy:
              mode: bytes
              limit: 10000
            # PA instructions come from PromptHandler.
            model_messages:
              instructions_template: ""

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      # model: ${CODEX_MODEL_NAME:-kimi-k3.1-pro}
      model: ${CODEX_MODEL_NAME:-qwen3.8-max-0902}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: full-access

  tokenizer:
    default:
      backend: regex

  keyword_index:
    default:
      backend: bm25
      tokenizer: default

  file_graph:
    default:
      backend: local

  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]

  file_store:
    default:
      backend: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
      tag_index: default

  tag_index:
    default:
      backend: local
      tag_key: memory_tags
      max_tags_per_file: 3
      max_tag_length: 64
