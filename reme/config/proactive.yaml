# Remy and four domain task Runtimes, managed by private workflow Jobs.
# Start with LLM_API_KEY, LLM_BASE_URL and optionally REME_MODEL_NAME.
# reme start config=proactive
# Studio jobs and their runtime dependencies. Examples live in demo.yaml.
language: zh
reme_agent_dir: reme_agents

service:
  backend: http
  web_enabled: true
  mcp_enabled: true

jobs:
  health_check:
    backend: base
    description: "Return a health snapshot of ReMe components."
    steps:
      - backend: health_check_step

  tts:
    backend: base
    description: "Synthesize text; returns Base64 audio, format and sample rate; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    steps:
      - backend: tts_step
        tts: default

  asr:
    backend: base
    description: "Transcribe Base64-encoded audio; requires DASHSCOPE_API_KEY."
    parameters:
      type: object
      additionalProperties: false
      properties:
        audio: {type: string, minLength: 1, description: "Base64-encoded audio bytes"}
        audio_format: {type: string, enum: [wav, mp3, pcm, opus], default: wav}
        sample_rate: {type: integer, minimum: 1, description: "Audio sample rate in Hz"}
      required: [audio]
    steps:
      - backend: asr_step
        asr: default

  screen_capture_cron:
    backend: cron
    enabled: true
    cron: '*/5 * * * *'
    steps:
    - backend: screen_capture_step
      similarity_threshold: 0.99
      task_names:
      - proactive_memory
      agent_manager: default
      connector_job: screen_capture_cron

  codex_dialogue_cron:
    backend: cron
    cron: '*/5 * * * *'
    init_steps:
    - backend: codex_dialogue_init_step
      codex_home: ${CODEX_HOME:-~/.codex}
      agent_manager: default
      connector_job: codex_dialogue_cron
    steps:
    - backend: codex_dialogue_step
      task_names:
      - proactive_memory
      - proactive_note
      codex_home: ${CODEX_HOME:-~/.codex}
      agent_manager: default
      connector_job: codex_dialogue_cron
    enabled: true

  finance_news_cron:
    backend: cron
    cron: '*/5 * * * *'
    steps:
    - backend: finance_news_step
      task_names:
      - proactive_fin
      agent_manager: default
      connector_job: finance_news_cron
    enabled: true

  gold_quotes_cron:
    backend: cron
    cron: '*/5 * * * *'
    steps:
    - backend: tencent_quotes_step
      instrument: gold
      task_names:
      - proactive_fin
      agent_manager: default
      connector_job: gold_quotes_cron
    enabled: true

  oil_quotes_cron:
    backend: cron
    cron: '*/5 * * * *'
    steps:
    - backend: tencent_quotes_step
      instrument: oil
      task_names:
      - proactive_fin
      agent_manager: default
      connector_job: oil_quotes_cron
    enabled: true

  nasdaq_quotes_cron:
    backend: cron
    cron: '*/5 * * * *'
    steps:
    - backend: tencent_quotes_step
      instrument: nasdaq
      task_names:
      - proactive_fin
      agent_manager: default
      connector_job: nasdaq_quotes_cron
    enabled: true

  btc_quotes_cron:
    backend: cron
    cron: '*/5 * * * *'
    steps:
    - backend: btc_quotes_step
      task_names:
      - proactive_fin
      agent_manager: default
      connector_job: btc_quotes_cron
    enabled: true

  list_task_reminders:
    backend: base
    description: List reminders produced by an existing background task.
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of an existing background task.
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        state:
          type: string
          enum:
          - all
          - pending
          - processed
          default: all
      required:
      - agent_name
    steps:
    - backend: list_task_reminders_step
      agent_runtime: Remy
      agent_manager: default

  read_agent_reminder:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of a visible Agent. Defaults to Remy.
          default: Remy
        message_id:
          type: string
          minLength: 1
          description: Workspace-relative reminder path or Chat message ID.
      required:
      - message_id
    steps:
    - backend: agent_reminder_step
      agent_runtime: Remy
      agent_manager: default

  list_agent_inbox:
    backend: base
    description: List a task's input events or Remy's incoming reminder records, with their processing state.
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of a visible Agent. Defaults to Remy.
          default: Remy
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        state:
          type: string
          enum:
          - all
          - pending
          - processing
          - processed
          default: all
    steps:
    - backend: agent_inbox_step
      agent_runtime: Remy
      agent_manager: default

  list_agents:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    steps:
    - backend: agent_list_step
      agent_runtime: Remy
      agent_manager: default

  read_agent_session:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of a visible Agent. Defaults to Remy.
          default: Remy
    steps:
    - backend: agent_session_step
      agent_runtime: Remy
      agent_manager: default

  task_document:
    backend: base
    description: Read or save a named task's TASK.md. Pass the mtime from read as expected_mtime when saving.
    parameters:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - read
          - save
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of an existing background task.
        content:
          type: string
          minLength: 1
          maxLength: 100000
        expected_mtime:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - action
      - agent_name
    steps:
    - backend: task_document_step
      agent_runtime: Remy
      agent_manager: default

  watch_agent_session:
    backend: stream
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of a visible Agent. Defaults to Remy.
          default: Remy
    steps:
    - backend: watch_agent_session_step
      agent_runtime: Remy
      agent_manager: default
    stream_queue_size: 1

  ask_agent:
    backend: stream
    parameters:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Name of a visible Agent. Defaults to Remy.
          default: Remy
        query:
          type: string
          minLength: 1
          maxLength: 100000
      required:
      - query
    steps:
    - backend: ask_agent_step
      agent_runtime: Remy
      agent_manager: default

  create_chat_session:
    backend: base
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    steps:
    - backend: agent_new_session_step
      agent_runtime: Remy
      agent_manager: default

  list_workspace:
    backend: base
    description: List files under a workspace path.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative dir; empty = root
          default: ''
        recursive:
          type: boolean
          description: recurse
          default: false
        sort_by:
          type: string
          enum:
          - mtime
          description: optional ordering; mtime returns most recently modified files first
        extensions:
          type: array
          items:
            type: string
          description: optional extension allowlist applied before sorting and limiting
        limit:
          type: integer
          description: max results
          default: 100
    steps:
    - backend: list_step

  load_file:
    backend: base
    description: Load a complete text file for the local editor without agent-output truncation.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative path
      required:
      - path
    steps:
    - backend: load_step
      max_bytes: 5242880

  save_file:
    backend: base
    description: Save an existing workspace text document if its version still matches the loaded version.
    parameters:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: workspace-relative path
        content:
          type: string
          description: complete source text, including frontmatter
        expected_mtime:
          type: string
          minLength: 1
          description: file version returned by load_file
      required: [path, content, expected_mtime]
    steps:
      - backend: save_step
        require_expected_mtime: true
        max_bytes: 5242880

  read_image:
    backend: base
    description: Read an image file as base64 (workspace-relative path).
    parameters:
      type: object
      properties:
        path:
          type: string
          description: workspace-relative path; common image formats supported (png/jpg/jpeg/webp/gif/bmp/tiff/heic)
      required:
      - path
    steps:
    - backend: read_image_step
      max_bytes: 5242880

  list_tags:
    backend: base
    description: List active tags with file counts. Returns {total_tags, total_pages, page, range, items}; range is the inclusive
      1-based item range and each item is [tag, file_count]. A page past the end returns empty items and range [0, 0].
    parameters:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: 1-based page; values past the end return an empty page
        order_by:
          type: string
          enum:
          - tag
          - file_count
          default: tag
          description: sort by tag or file count
        order:
          type: string
          enum:
          - asc
          - desc
          description: defaults to asc for tag, desc for file_count
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: items per page
    steps:
    - backend: list_tags_step

  search_workspace:
    backend: base
    description: Hybrid workspace search (vector + BM25, RRF-fused).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: search query
        limit:
          type: integer
          description: max results
          default: 5
        min_score:
          type: number
          description: Minimum returned score; 0 disables filtering (recommended). Uses native vector or BM25 scores when only
            one branch has hits, and rank-based RRF scores (at most 1/61, about 0.01639) when both have hits. The scale can
            change per query; this is not a normalized relevance threshold.
          default: 0.0
        tags:
          type: array
          items:
            type: string
          description: optional tags filter; a file matches when it contains at least one valid tag
          default: []
        start_date:
          type: string
          description: optional inclusive start date filter (YYYY-MM-DD); results earlier than this date are excluded
        end_date:
          type: string
          description: optional inclusive end date filter (YYYY-MM-DD); results later than this date are excluded
        expand_links:
          type: boolean
          description: include wikilink neighbors for matching documents
          default: true
      required:
      - query
    steps:
    - backend: search_step
      vector_weight: 0.7
      candidate_multiplier: 5.0
      expand_links: true
      max_links_per_direction: 10

  index_update_loop:
    backend: background
    watch_dirs:
    - daily_dir
    - digest_dir
    watch_suffixes:
    - md
    steps:
    - backend: init_changes_step
      monitor_type: file_store
      monitor_name: default
      dispatch_steps:
      - update_index_step
    - backend: watch_changes_step
      watch_mode: awatch
      monitor_type: file_store
      dispatch_steps:
      - backend: update_index_step
        persist: false

  list_tag_files:
    backend: base
    description: Browse existing files matching any selected memory tag, within a workspace directory.
    parameters:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          minItems: 1
        path:
          type: string
          default: ''
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      required:
      - tags
    steps:
    - backend: list_tag_files_step

  get_client_info:
    backend: base
    description: "Return workspace information and supported client capabilities."
    steps:
      - backend: client_info_step

  run_chat_agent:
    backend: base
    enable_serve: false
    steps:
      - backend: chat_agent_step
        agent_runtime: Remy
        job_tools: [manage_proactive_runtime, manage_connector, manage_notebook]
        skills:
          - manage-proactive-runtime
          - manage-connector
          - manage-notebook

  process_chat_notifications:
    backend: base
    enable_serve: false
    steps:
      - backend: process_chat_notifications_step
        agent_runtime: Remy
        agent_manager: default
        job_tools: [submit_chat_reply]
        skills: []
        timeout_seconds: 120

  chat_notifications_loop:
    backend: background
    enable_serve: false
    steps:
      - backend: chat_notifications_loop_step
        agent_runtime: Remy
        agent_manager: default
        process_job: process_chat_notifications

  run_memory_agent:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - &task_execution
        backend: memory_agent_step
        agent_manager: default
        effort: low
        timeout_seconds: 1200
        max_local_search_calls: 10
        recent_history_hours: 24
        sandbox: null
        job_tools: []
        skills: []

  run_notebook_agent:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - <<: *task_execution
        backend: notebook_agent_step
        job_tools: [manage_notebook]
        skills:
          - manage-notebook

  run_finance_agent:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - <<: *task_execution
        backend: finance_agent_step

  run_news_agent:
    backend: base
    enable_serve: false
    track_execution: true
    steps:
      - <<: *task_execution
        backend: news_agent_step

  agent_manager_loop:
    backend: background
    enable_serve: false
    steps:
      - backend: agent_manager_loop_step
        agent_manager: default

  manage_proactive_runtime:
    backend: base
    description: 'Manage background Runtimes: list/create/status/update/delete/query. Select one of the four run_job
      values on creation. Trigger type and run_job are immutable; task requirements live in TASK.md. Follow manage-proactive-runtime.'
    parameters:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - list
          - create
          - status
          - update
          - delete
          - query
        agent_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[\w-]+$
          description: Stable Agent name. New task names should use simple lowercase words joined by underscores.
        task_description:
          type: string
          minLength: 1
          maxLength: 100000
          description: 'Create only: explicit TASK.md text. Omit to render the selected domain default.'
        enabled:
          type: boolean
        cron:
          type:
          - string
          - 'null'
          description: At creation, an expression selects time-triggered execution in the application timezone. Omission
            or null selects event-triggered execution. A time-triggered task can update its expression.
        min_trigger_interval_seconds:
          type: number
          minimum: 0
          description: Minimum interval before processing observations, in seconds.
        notify_window:
          type:
          - object
          - 'null'
          description: Time window for automatic Chat processing and sending.
          properties:
            start:
              type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            end:
              type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          required:
          - start
          - end
          additionalProperties: false
        question:
          type: string
          minLength: 1
          maxLength: 100000
          description: 'Query only: question for the latest task session.'
        run_job:
          type: string
          enum:
          - run_memory_agent
          - run_notebook_agent
          - run_finance_agent
          - run_news_agent
          description: Create only. Defaults to run_memory_agent for a new task; omitted when restoring.
      required:
      - action
    steps:
    - backend: manage_proactive_runtime_step
      agent_manager: default
  manage_connector:
    backend: base
    description: Send standard Events to event-triggered tasks, or enable/pause one configured connector Job. Each
      recipient is handled independently. Follow manage-connector.
    parameters:
      type: object
      additionalProperties: false
      properties:
        task_names:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[\w-]+$
            description: Name of an existing background task.
        events:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: string
              event_ts:
                type: string
                format: date-time
              source:
                type: string
              description:
                type: string
              paths:
                type: array
                items:
                  type: string
              metadata:
                type: object
            required:
            - event_ts
            - source
            - description
            additionalProperties: false
        action:
          type: string
          enum:
          - send
          - enable
          - pause
        connector_job:
          type: string
          description: 'Enable/pause only: configured connector Job name.'
      required:
      - action
    steps:
    - backend: manage_connector_step
      agent_manager: default
      connector_jobs:
      - screen_capture_cron
      - codex_dialogue_cron
      - finance_news_cron
      - gold_quotes_cron
      - oil_quotes_cron
      - nasdaq_quotes_cron
      - btc_quotes_cron
  submit_chat_reply:
    backend: base
    enable_serve: false
    description: 提交当前提醒批次的 Chat 回复或静默决定。
    steps:
    - backend: submit_chat_reply_step
      agent_runtime: Remy
    parameters:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - send
          - skip
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Required only for send; omitted for skip.
      required:
      - action
  manage_notebook:
    backend: base
    description: Manage Todo and Idea records using kind and action. list_projects is a common action and accepts
      only scope. IDs and times are generated by the server. Follow manage-notebook.
    parameters:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - create
          - list
          - get
          - update
          - archive
          - restore
          - list_projects
        id:
          type: string
          minLength: 1
          description: Existing record ID; never supplied on create.
        project:
          type: string
          description: Project name. Defaults to 随笔 (Notes in English); blank also means 随笔. Omit on create to inherit
            the source Idea's project. Omit on update to retain. Exact filter for list; use 随笔 for Notes.
        text:
          type: string
          minLength: 1
          description: One-sentence content; create/update only.
        status:
          type: string
          enum:
          - pending
          - in_progress
          - closed
          description: 'Todo only: pending, in_progress or closed.'
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Optional deadline. Update with null to clear; omit to retain.
        source_idea:
          type:
          - string
          - 'null'
          minLength: 1
          description: Idea ID to link or filter by; null removes the link on update.
        progress_text:
          type: string
          minLength: 1
          description: Append one progress note, or replace the note selected by progress_match.
        progress_time:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional explicit progress time with timezone; requires progress_text.
        progress_match:
          type: object
          additionalProperties: false
          description: On update, use the original time and text from get. Omit progress_text to remove this note.
          properties:
            time:
              type: string
              format: date-time
            text:
              type: string
              minLength: 1
          required:
          - time
          - text
        close_note:
          type:
          - string
          - 'null'
          minLength: 1
          description: Confirmed outcome or reason for closure. Requires status=closed; null clears the note.
        scope:
          type: string
          enum:
          - active
          - archive
          - all
          description: Active lists by earliest target date with undated tasks last. Archive lists newest closures
            first. Defaults to active for list and all for list_projects.
        order:
          type: string
          enum:
          - due
          - created
          description: List only. Active lists default to earliest target date. Use created for newest creation time
            first, with unknown dates last. Archive lists always use closure time.
        query:
          type: string
          description: List only; case-insensitive substring search.
        offset:
          type: integer
          minimum: 0
          description: List only; defaults to 0.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: List only; defaults to 20.
        kind:
          type: string
          enum:
          - todo
          - idea
          description: Required for record actions; omitted for list_projects.
      required:
      - action
    steps:
    - backend: manage_notebook_step

components:
  asr:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-asr-flash
      timeout: 60
  tts:
    default:
      backend: dashscope
      api_key: ${DASHSCOPE_API_KEY:-}
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-audio-3.1-tts-plus
      voice: longanhuan_v3.1
      audio_format: mp3
      sample_rate: 22050
      timeout: 60
  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        # Disable automatic repository AGENTS.md loading for every Agent on this server.
        - project_doc_max_bytes=0
        # Keep the configured input budget; put safety headroom in the compaction threshold.
        # At 95% usable context, 600000 leaves 334435 tokens below Codex's hard cap.
        # Budget 128 KiB of new text at one token/byte, not Codex's byte/4 estimate of 32768.
        # Planning allowances: 131072 output + 131072 new text + 32768 estimation/compaction overhead.
        # This soft margin does not enforce request limits or guarantee room for arbitrary text/images.
        - model_context_window=983616
        - model_auto_compact_token_limit=600000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        - sandbox_workspace_write.network_access=false
        - 'web_search="live"'
        # Enable JavaScript tool orchestration and waiting.
        - features.code_mode=true
        - features.sleep_tool=true

        # Keep review and inherited Agent defaults on the configured Qwen endpoint.
        - 'model="${REME_MODEL_NAME:-qwen4-max}"'
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${REME_MODEL_NAME:-qwen4-max}"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${REME_MODEL_NAME:-qwen4-max}"'
        - 'memories.consolidation_model="${REME_MODEL_NAME:-qwen4-max}"'

      # Local Codex capability settings for the configured Qwen model.
      model_catalog:
        models:
          - slug: ${REME_MODEL_NAME:-qwen4-max}
            display_name: Qwen4 Max
            description: Work and life assistant with text and image input
            base_instructions: ""
            default_reasoning_level: xhigh
            supported_reasoning_levels:
              - effort: none
                description: Disable thinking
              - effort: low
                description: Light reasoning
              - effort: medium
                description: Balanced reasoning
              - effort: xhigh
                description: Maximum reasoning
            context_window: 983616
            max_context_window: 983616
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            supports_reasoning_summaries: false
            supports_parallel_tool_calls: false
            support_verbosity: false
            shell_type: unified_exec
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: [clock]
            truncation_policy:
              mode: bytes
              limit: 10000
            # Agent context comes from PromptHandler.
            model_messages:
              instructions_template: ""

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      project_path: ..  # Keep project skills separate from the default .reme workspace.
      cwd: .
      skills: []  # Role execution Jobs select their own skills.
      model: ${REME_MODEL_NAME:-qwen4-max}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: workspace-write

  file_graph:
    default:
      backend: local
  file_chunker:
    markdown:
      backend: markdown
      supported_extensions:
      - md
      embed_toc: true
      max_ast_sections: 100
      include_frontmatter_in_metadata: false
      include_frontmatter_keys_in_metadata: []
  keyword_index:
    default:
      backend: bm25
      tokenizer: default
  tag_index:
    default:
      backend: local
      tag_key: memory_tags
      max_tags_per_file: 3
      max_tag_length: 64
  file_store:
    default:
      backend: local
      store_name: local
      embedding_store: ''
      keyword_index: default
      file_graph: default
      tag_index: default
  tokenizer:
    default:
      backend: regex

  agent_runtime:
    Remy:
      backend: chat
      agent_wrapper: default
      run_job: run_chat_agent
      enabled: true
      initial_memory: |
        主人关注 AI 相关的大新闻，以及当前项目的进度、进展、难点和待讨论问题。
      notification_config:
        p0_delay_seconds: 0
        p1_idle_seconds: 10
        p2_idle_seconds: 1800
    proactive_memory:
      backend: proactive
      agent_wrapper: default
      run_job: run_memory_agent
      notification_target: Remy
      enabled: true
      max_batch_events: 2
    proactive_note:
      backend: proactive
      agent_wrapper: default
      run_job: run_notebook_agent
      notification_target: Remy
      enabled: true
      max_batch_events: 2
    proactive_fin:
      backend: proactive
      agent_wrapper: default
      run_job: run_finance_agent
      notification_target: Remy
      enabled: true
      min_trigger_interval_seconds: 10
      max_batch_events: 20
    proactive_news:
      backend: proactive
      agent_wrapper: default
      run_job: run_news_agent
      notification_target: Remy
      enabled: true
      cron: 0 8 * * *
  agent_manager:
    default:
      backend: local
      agent_wrapper: default
      notification_target: Remy
      runtimes:
      - proactive_memory
      - proactive_note
      - proactive_fin
      - proactive_news
      allowed_run_jobs:
      - run_memory_agent
      - run_notebook_agent
      - run_finance_agent
      - run_news_agent
