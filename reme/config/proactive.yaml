# Studio workspace with MCP and a full-access Codex chat agent using API-key authentication.
# Set LLM_API_KEY / LLM_BASE_URL (and optionally CODEX_MODEL_NAME) for chat.
# Custom LLM_BASE_URL endpoints must support the Responses API.
# Start: reme start config=proactive
# Open: http://127.0.0.1:2333

service:
  backend: http
  web_enabled: true
  mcp_enabled: true

jobs:
  # Keep Markdown search and graph data in sync with the workspace files.
  index_update_loop:
    backend: background
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    steps:
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
      - backend: watch_changes_step
        monitor_type: file_store
        dispatch_steps:
          - backend: update_index_step
            persist: false

  chat:
    backend: stream
    description: "Stream a full-access Codex conversation with the prome assistant."
    system_prompt: |
      你是 prome（proactive ReMe），主人的工作与生活管家。
      始终称呼用户为“主人”，使用主人的语言自然交流，回答清晰、简洁、务实。
    parameters:
      type: object
      properties:
        query: {type: string, description: "user message"}
        session_id: {type: string, description: "agent session to resume"}
        system_prompt: {type: string, description: "optional system prompt override"}
      required: [query]
    steps:
      - backend: chat_step
        agent_wrapper: default
        job_tools: []

  session_read:
    backend: base
    description: "Read session history, including proactive assistant messages."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_read_step
        agent_wrapper: default

  session_status:
    backend: base
    description: "Inspect session activity without waiting for generation."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
      required: [session_id]
    steps:
      - backend: session_status_step
        agent_wrapper: default

  session_append:
    backend: base
    description: "Append a proactive assistant message once the session is idle; retry with the same message_id."
    parameters:
      type: object
      properties:
        session_id: {type: string, description: "agent session identifier"}
        message_id: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: "stable retry/idempotency identifier"}
        content: {type: string, minLength: 1, maxLength: 100000}
        wait_timeout: {type: number, exclusiveMinimum: 0, default: 30}
      required: [session_id, message_id, content]
    steps:
      - backend: session_append_step
        agent_wrapper: default

  app_config:
    backend: base
    description: "Return the effective application config with secrets redacted."
    steps:
      - backend: app_config_step

  version:
    backend: base
    description: "Return the ReMe version."
    steps:
      - backend: version_step

  status:
    backend: base
    description: "Report component memory estimates and process RSS."
    steps:
      - backend: status_step

  health_check:
    backend: base
    description: "Return a concise health-check snapshot of ReMe components."
    steps:
      - backend: health_check_step

  graph_snapshot:
    backend: base
    description: "Return the category-rooted digest wikilink graph with daily-note leaves."
    steps:
      - backend: graph_snapshot_step

  reindex:
    backend: base
    description: "Rebuild the local BM25 index from already-ingested chunks."
    parameters:
      type: object
      properties:
        scope: {type: string, enum: [all, bm25], default: all}
    steps:
      - backend: reindex_step

  list:
    backend: base
    description: "List files under a workspace path."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative directory; empty = root", default: ""}
        recursive: {type: boolean, default: false}
        sort_by: {type: string, enum: [mtime]}
        extensions: {type: array, items: {type: string}}
        limit: {type: integer, default: 100}
    steps:
      - backend: list_step

  load:
    backend: base
    description: "Load a complete text file for the local editor without agent-output truncation."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
      required: [path]
    steps:
      - backend: load_step
        max_bytes: 5242880

  save:
    backend: base
    description: "Save text verbatim, optionally rejecting external changes since the file was opened."
    parameters:
      type: object
      properties:
        path: {type: string, description: "workspace-relative path"}
        content: {type: string, description: "complete file content, including frontmatter"}
        expected_mtime: {type: string, description: "optional ISO mtime returned by load/stat"}
      required: [path, content]
    steps:
      - backend: save_step

components:
  codex_app_server:
    default:
      backend: sdk
      auth_mode: api_key
      api_key: ${LLM_API_KEY:-}
      base_url: ${LLM_BASE_URL:-}
      codex_home: .codex
      supports_websockets: false
      experimental_api: true
      config_overrides:
        # Preserve Qwen3.8 Max's actual input limit; put safety headroom in the compaction threshold.
        # At 95% usable context, 600000 leaves 334435 tokens below Codex's hard cap.
        # Budget 128 KiB of new text at one token/byte, not Codex's byte/4 estimate of 32768.
        # Planning allowances: 131072 output + 131072 new text + 32768 estimation/compaction overhead.
        # This soft margin does not enforce request limits or guarantee room for arbitrary text/images.
        - model_context_window=983616
        - model_auto_compact_token_limit=600000
        - 'model_auto_compact_token_limit_scope="total"'
        # Zero disables extra compaction after a completed reply.
        - model_post_turn_compact_threshold_percent=0
        - features.async_compaction=false
        # 2500 approximate tokens matches the fallback's 10000-byte tool-output limit.
        - tool_output_token_limit=2500
        # Leave compact_prompt / experimental_compact_prompt_file unset to use the built-in prompt.

        # Keep review and spawned agents on the configured Qwen endpoint.
        - 'model_reasoning_effort="xhigh"'
        - 'review_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'agents.default_subagent_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'agents.default_subagent_reasoning_effort="xhigh"'

        # Long-term memory generation and injection are separate from context compaction.
        - features.memories=true
        - memories.generate_memories=true
        - memories.use_memories=true
        - 'memories.extract_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'
        - 'memories.consolidation_model="${CODEX_MODEL_NAME:-qwen3.8-max}"'

      # These capabilities describe Qwen3.8 Max; update them when switching model families.
      # Official limits: https://help.aliyun.com/en/model-studio/qwen3-8-max
      model_catalog:
        models:
          - slug: ${CODEX_MODEL_NAME:-qwen3.8-max}
            display_name: Qwen3.8 Max
            description: Work and life assistant with text and image input
            default_reasoning_level: xhigh
            supported_reasoning_levels:
              - effort: none
                description: Disable thinking
              - effort: low
                description: Light reasoning
              - effort: medium
                description: Balanced reasoning
              - effort: xhigh
                description: Maximum reasoning
            context_window: 983616
            max_context_window: 983616
            effective_context_window_percent: 95
            input_modalities: [text, image]
            # The provider returns reasoning content without a reasoning.summary request parameter.
            supports_reasoning_summary_parameter: false
            support_verbosity: false
            shell_type: unified_exec
            visibility: list
            supported_in_api: true
            priority: 0
            experimental_supported_tools: []
            truncation_policy:
              mode: bytes
              limit: 10000
            # Custom catalogs do not inherit Codex's built-in base instruction template.
            model_messages:
              instructions_template: |
                You are prome, a capable assistant working in the user's local ReMe workspace.
                Follow developer instructions and applicable AGENTS.md files.
                Use available tools to verify workspace facts; never invent file contents or completed actions.
                Preserve user-owned memory files and unrelated changes when carrying out tasks.
                Complete requested work, report relevant validation limits, and reply clearly in the user's language.

  agent_wrapper:
    default:
      backend: codex
      app_server: default
      model: ${CODEX_MODEL_NAME:-qwen3.8-max}
      effort: xhigh
      approval_mode: deny_all  # SDK maps this to approval_policy=never; no approval requests.
      sandbox: full-access

  tokenizer:
    default:
      backend: regex

  keyword_index:
    default:
      backend: bm25
      tokenizer: default

  file_graph:
    default:
      backend: local

  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]

  file_store:
    default:
      backend: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
