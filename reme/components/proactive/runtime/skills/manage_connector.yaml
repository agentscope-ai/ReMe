name: manage-connector
description: Manage collection sources and deliver custom events with manage_connector.
description_zh: 通过 manage_connector 管理采集来源并投递自建事件。
content: |
  # Manage connectors

  First create or identify the receiving event-triggered Runtime with manage-proactive-runtime.
  manage_connector has four actions:

  | Action | Inputs |
  | --- | --- |
  | list | action only; returns items and total |
  | create | name, runtime_names, binding with an HTTP(S) SSE url |
  | update | source_id and any nonempty subset of name, runtime_names, enabled |
  | send | runtime_names and a nonempty events array |

  Use the source_id returned by list or create for all updates. Preset identities are preset:<job-name>;
  custom subscriptions use source_<uuid>. Connector Job names are internal bindings, not request parameters.
  Update only supplied fields. runtime_names replaces the complete target list; [] continues collecting
  without delivering new events. enabled=false pauses collection; enabled=true resumes it. Existing files,
  admitted events, committed cursors and pending deliveries remain. Saved batches keep their original targets
  and source name; changes affect subsequent inputs. Source IDs stay stable when names change.
  Preset controls do not alter the target Runtime's enabled setting.

  Examples:
  - {"action":"list"}
  - {"action":"create","name":"Experiment progress","runtime_names":["experiment_watch"],"binding":{"url":"https://example.com/events"}}
  - {"action":"update","source_id":"preset:screen_capture_cron","enabled":false}
  - {"action":"update","source_id":"preset:screen_capture_cron","name":"Project observations","runtime_names":["project_watch"],"enabled":true}

  Targets must exist, be event-triggered and be unique ignoring case. Creation requires a nonempty target list.
  SSE GET endpoints return text/event-stream; each data field contains one CloudEvents 1.0 JSON envelope.
  The protocol is fixed: no trigger_type or format parameter is needed. URL and binding type are immutable.
  Definition success does not confirm a network connection, delivery or Agent processing. enabled is the
  configured gate; available means the owner is available; connected describes the SSE connection only.
  Inspect last_error, pending_delivery_count and actual receiving queues before reporting success.
  Manual subscription definition edits require a restart; updates refuse to overwrite unloaded edits.

  CloudEvents source + id identifies an event. Original envelopes are saved in resource/cloudevents;
  definitions and cursor/pending checkpoints are saved in metadata/proactive/sources. Retry only unresolved
  recipients. A rejected or failed handoff blocks the cursor; restore the receiver to allow automatic recovery.
  SSE resumes with Last-Event-ID after restart; historical replay depends on the upstream server. HTTP 204
  stops the stream until enabled again or the service restarts. Lines and event buffers are limited to 1 MiB.
  This supports SSE framing with CloudEvents JSON, not provider-specific subscription handshakes or custom auth headers.

  Custom collectors save files under the configured workspace resource directory, then use HTTP POST
  /manage_connector with action=send, runtime_names and Events. Each Event includes a stable id, an aware
  event_ts, source, description and optional workspace-relative paths. Preserve identical IDs and payloads
  when retrying; inspect deliveries, rejected and errors per receiver. source=time is reserved for the scheduler.
  Time sources are projected from time-triggered Runtimes; edit their schedule and enabled through
  manage_proactive_runtime. Icons and emoji belong to the frontend.
content_zh: |
  # 管理资料接入

  先通过 manage-proactive-runtime 创建或找到接收资料的事件型 Runtime。
  manage_connector 只有四个动作：

  | 动作 | 输入 |
  | --- | --- |
  | list | 只传 action，返回 items 和 total |
  | create | name、runtime_names，以及包含 HTTP(S) SSE url 的 binding |
  | update | source_id，以及 name、runtime_names、enabled 中至少一项 |
  | send | runtime_names 和非空 events 数组 |

  更新统一使用 list/create 返回的 source_id。预设身份为 preset:<job-name>，自定义订阅为 source_<uuid>；
  Connector Job 名只是内部绑定，不作为请求参数。只修改传入字段。runtime_names 完整替换目标名单；
  [] 表示继续采集、不投递新事件。enabled=false 暂停，enabled=true 恢复。文件、已入队事件、已提交游标和
  待投递批次保留；已保存批次保留原目标和来源名称，修改只影响后续输入。改名不改变来源身份。
  来源开关不修改目标 Runtime 的 enabled。

  示例：
  - {"action":"list"}
  - {"action":"create","name":"实验进度","runtime_names":["experiment_watch"],"binding":{"url":"https://example.com/events"}}
  - {"action":"update","source_id":"preset:screen_capture_cron","enabled":false}
  - {"action":"update","source_id":"preset:screen_capture_cron","name":"项目观察","runtime_names":["project_watch"],"enabled":true}

  目标必须已存在、为事件型，忽略大小写不能重复；创建要求非空目标名单。SSE GET 接口返回 text/event-stream，
  每条 data 是一个 CloudEvents 1.0 JSON 对象。协议固定，不需要 trigger_type 和 format 参数；地址和绑定类型不可修改。
  配置成功不等于已连接、投递成功或 Agent 已处理。enabled 是配置开关，available 是所属组件是否可用，connected
  只表示 SSE 连接。报告成功前检查 last_error、pending_delivery_count 和实际接收队列。
  手工修改订阅定义后需重启加载，更新接口会拒绝覆盖尚未加载的改动。

  CloudEvents 的 source + id 决定事件身份。原文保存在 resource/cloudevents；定义、游标和待投递检查点保存在
  metadata/proactive/sources。只重试尚未接受的目标，错误或拒绝会阻止游标推进，恢复接收方后自动重试。
  重启携带 Last-Event-ID 恢复，历史补发仍依赖上游。HTTP 204 停止连接，可再次 enabled=true 或重启服务恢复。
  单行和事件缓冲上限为 1 MiB；不配置平台特有握手和自定义鉴权头。

  自建采集脚本先将文件保存到配置的工作区 resource 目录，再通过 HTTP POST /manage_connector 的 action=send
  投递。Event 包括稳定 id、带时区的 event_ts、source、description 和可选的工作区相对 paths。重试保留原 ID
  和原始内容，按接收方检查 deliveries、rejected、errors。source=time 由调度器保留。
  时间来源直接从时间型 Runtime 投影，通过 manage_proactive_runtime 修改计划和启停；图标与 emoji 由前端管理。
