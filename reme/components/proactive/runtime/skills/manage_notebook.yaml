name: manage-notebook
description: Find projects, manage Todos and Ideas, maintain progress and link entries with ReMe's manage_notebook tool.
description_zh: 用 ReMe 的 manage_notebook 工具查找项目、管理待办和想法、维护进展并关联条目。
content: |
  # Manage Todos and Ideas

  Use `manage_notebook` with `kind="todo"` for work to do and `kind="idea"` for ideas to discuss. Find existing entries before creating new ones. Pass all parameters at the top level.
  Each example is a separate request. Replace `t001`, `i001` and `i002` with actual IDs; obtain progress matches from the latest `get` result. IDs and creation/closure times are generated by the tool.

  ## Parameters and reading

  | Parameter | Usage |
  | --- | --- |
  | `kind`, `action`, `id` | Supply `kind` and `action` except for `list_projects`, which omits `kind`. `get`, `update`, `archive` and `restore` require `id`; never supply an ID on `create`. `update` also requires at least one changed field. |
  | `project` | Set on `create` or `update`; exact filter on `list`. Use the stored name returned by queries. Standalone creation defaults to `随笔` (displayed as Notes); `project=""` selects this project, including on update. |
  | `text` | Nonblank content on `create` or `update`; cannot be `null`. An Idea requires it on creation; a Todo may inherit it from `source_idea`. |
  | `scope` | `active`, `archive` or `all`; defaults to `active` for `list` and `all` for `list_projects`. |
  | `query` | Optional case-insensitive substring search on project and text. Todo searches also include progress and closing notes. |
  | `offset`, `limit` | `list` pagination: defaults `0`, `20`; `limit` is `1`–`100`. Continue while more results remain according to `total`. |
  | `order` | Todo `list` only: active entries default to `due` (earliest deadline first, undated last); `created` sorts newest creation first, unknown dates last. Archive lists always use newest closure first. Active Ideas use newest recorded time first, undated last. |

  `list_projects` accepts only `action` and optional `scope`, returning `project`, `todo_count` and `idea_count` for each project. Project, keyword and Todo-specific list filters are optional; omit them to skip those filters. `get` accepts only `kind`, `action` and `id`.
  Todo lists include only the latest progress entry and `progress_count`; use `get` to read the complete history before changing progress.

  | Read | Complete parameters |
  | --- | --- |
  | Discover projects | `{"action":"list_projects","scope":"all"}` |
  | Find Todos | `{"kind":"todo","action":"list","project":"ReMe","status":"in_progress","source_idea":"i001","scope":"active","query":"release","order":"created","offset":0,"limit":20}` |
  | Find Ideas | `{"kind":"idea","action":"list","project":"ReMe","scope":"all","query":"release","offset":0,"limit":20}` |
  | Read a Todo | `{"kind":"todo","action":"get","id":"t001"}` |
  | Read an Idea | `{"kind":"idea","action":"get","id":"i001"}` |

  ## Create

  | Create | Complete parameters |
  | --- | --- |
  | Independent Todo | `{"kind":"todo","action":"create","project":"ReMe","text":"Validate the release package"}` |
  | Todo from an Idea | `{"kind":"todo","action":"create","source_idea":"i001"}` |
  | Idea | `{"kind":"idea","action":"create","project":"ReMe","text":"Validate releases in a clean environment"}` |

  A Todo starts as `pending`. Creation may also include the Todo fields below except `progress_match`. With `source_idea`, omitted `project` and `text` inherit from that Idea; explicit values override them.

  ## Update content, state and links

  Omitted fields retain their current values. A project change affects only this entry. Updating an Idea does not synchronize linked Todos; linking or replacing an Idea on an existing Todo does not copy its project or text.

  | Todo field | Usage |
  | --- | --- |
  | `status` | `pending`, `in_progress` or `closed`. Complete or cancel with `closed`; set `pending` or `in_progress` to reopen, retaining progress and clearing the closure time and note. |
  | `due_date` | `YYYY-MM-DD`; use `null` to clear. |
  | `source_idea` | Existing Idea ID to link or replace; use `null` to unlink. Also a Todo `list` filter; `null` finds unlinked Todos. |
  | `close_note` | Nonblank result or closing reason; use `null` to clear. Always supply `status="closed"`, even when editing or clearing the note of an already closed Todo. |

  | Change | Complete parameters |
  | --- | --- |
  | Edit Todo text | `{"kind":"todo","action":"update","id":"t001","text":"Validate Windows installation and startup"}` |
  | Move a Todo | `{"kind":"todo","action":"update","id":"t001","project":"Release"}` |
  | Reset a Todo's project to Notes | `{"kind":"todo","action":"update","id":"t001","project":""}` |
  | Edit Idea text | `{"kind":"idea","action":"update","id":"i001","text":"Validate releases on macOS and Windows"}` |
  | Move an Idea | `{"kind":"idea","action":"update","id":"i001","project":"Release"}` |
  | Reset an Idea's project to Notes | `{"kind":"idea","action":"update","id":"i001","project":""}` |
  | Start or resume work | `{"kind":"todo","action":"update","id":"t001","status":"in_progress"}` |
  | Return to pending or reopen | `{"kind":"todo","action":"update","id":"t001","status":"pending"}` |
  | Complete the Todo | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"Installation and startup passed"}` |
  | Cancel the Todo | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"The user cancelled this work"}` |
  | Edit or add a closing note | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"Validated on both macOS and Windows"}` |
  | Clear a closing note | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":null}` |
  | Set or change the deadline | `{"kind":"todo","action":"update","id":"t001","due_date":"2026-12-01"}` |
  | Clear the deadline | `{"kind":"todo","action":"update","id":"t001","due_date":null}` |
  | Link or replace an Idea | `{"kind":"todo","action":"update","id":"t001","source_idea":"i002"}` |
  | Unlink an Idea | `{"kind":"todo","action":"update","id":"t001","source_idea":null}` |

  ## Maintain progress

  - `progress_text` appends a nonblank entry on `create` or `update`; it cannot be `null`.
  - On `update`, `progress_match` selects an existing entry using its exact `time` and `text` from `get`. It must match exactly one entry; if it fails, read again before retrying.
  - With a match, supply `progress_text` to replace the text, or omit it to delete that entry. No match means append.
  - `progress_time` requires `progress_text`; non-null times must include a timezone. Omitted or `null` time uses the current time for new entries and retains the original time for replacements. To change only the time, match the entry and resend its unchanged text.

  The match objects below are examples; use the actual objects returned by `get`. These requests are alternatives, not a sequence.

  | Change | Complete parameters |
  | --- | --- |
  | Append progress | `{"kind":"todo","action":"update","id":"t001","progress_text":"Installation passed; startup is pending"}` |
  | Replace progress text | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"Installation passed; startup is pending"},"progress_text":"Installation and startup passed"}` |
  | Delete a progress entry | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"Installation passed; startup is pending"}}` |
  | Change a progress entry's time | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"Installation passed; startup is pending"},"progress_text":"Installation passed; startup is pending","progress_time":"2026-11-24T11:00:00+08:00"}` |

  ## Archive and restore

  There is no `delete` operation. Closing a Todo archives it; reopening restores it. Archive or restore an Idea explicitly. IDs and links are retained. Closing linked Todos does not automatically archive their Idea; check the other linked Todos before proposing to archive it.

  | Change | Complete parameters |
  | --- | --- |
  | Archive an Idea | `{"kind":"idea","action":"archive","id":"i001"}` |
  | Restore an Idea | `{"kind":"idea","action":"restore","id":"i001"}` |

  ## Background updates

  For background events, find all related Todos and Ideas and read the full progress of affected Todos. Automatic writes may append, correct or remove progress on open Todos and set `status="in_progress"` when work has demonstrably started. Record only new facts or confirmed corrections and withdrawals; merge follow-up results for the same item into its existing progress entry. Prefer reusing suitable entries. For every other proposed change, use proactive-record to remind the user for a decision, with the existing entry when available, new evidence and suggested action.

content_zh: |
  # 管理待办和想法

  用 `manage_notebook` 的 `kind="todo"` 记录要做的事，`kind="idea"` 记录想法。先查已有条目，再决定更新或新增。所有参数放在同一层。
  每个示例都是独立请求。`t001`、`i001`、`i002` 换成实际 ID，进展匹配对象从最新的 `get` 结果原样取用。ID、创建和关闭时间由工具生成。

  ## 参数与读取

  | 参数 | 用法 |
  | --- | --- |
  | `kind`、`action`、`id` | 除 `list_projects` 不传 `kind` 外，均需传 `kind` 和 `action`。`get`、`update`、`archive`、`restore` 必须传 `id`，`create` 不传 ID。`update` 还需至少一个要修改的字段。 |
  | `project` | `create`、`update` 设置项目，`list` 精确筛选。使用查询返回的原名。独立创建默认归入「随笔」（英文显示 Notes）；`project=""` 归入随笔，更新时也一样。 |
  | `text` | `create`、`update` 的非空正文，不能传 `null`。创建 Idea 必填；创建 Todo 可从 `source_idea` 继承。 |
  | `scope` | `active`、`archive`、`all` 分别查未归档、归档、全部。`list` 默认 `active`，`list_projects` 默认 `all`。 |
  | `query` | 可选，不区分大小写，按子串搜索项目和正文；Todo 还匹配进展和关闭备注。 |
  | `offset`、`limit` | `list` 分页，默认 `0`、`20`，`limit` 为 `1`–`100`。根据 `total` 判断是否继续翻页。 |
  | `order` | 仅 Todo 的 `list` 使用。未归档默认 `due`，按期限从近到远、无期限在后；`created` 按创建时间倒序、未知时间在后。归档始终按关闭时间倒序。未归档 Idea 按记录时间倒序，无日期在后。 |

  `list_projects` 只接受 `action` 和可选 `scope`，每个项目返回 `project`、`todo_count`、`idea_count`。列表的项目、关键词和 Todo 专用筛选均可省略，省略时不按该字段过滤。`get` 只接受 `kind`、`action`、`id`。
  Todo 列表只带最近一条进展和 `progress_count`；修改进展前，用 `get` 读完全部历史。

  | 读取 | 完整参数 |
  | --- | --- |
  | 查找项目 | `{"action":"list_projects","scope":"all"}` |
  | 查找 Todo | `{"kind":"todo","action":"list","project":"ReMe","status":"in_progress","source_idea":"i001","scope":"active","query":"发布","order":"created","offset":0,"limit":20}` |
  | 查找 Idea | `{"kind":"idea","action":"list","project":"ReMe","scope":"all","query":"发布","offset":0,"limit":20}` |
  | 读取 Todo | `{"kind":"todo","action":"get","id":"t001"}` |
  | 读取 Idea | `{"kind":"idea","action":"get","id":"i001"}` |

  ## 创建

  | 创建 | 完整参数 |
  | --- | --- |
  | 独立新建 Todo | `{"kind":"todo","action":"create","project":"ReMe","text":"验证发布包"}` |
  | 从 Idea 新建 Todo | `{"kind":"todo","action":"create","source_idea":"i001"}` |
  | 新建 Idea | `{"kind":"idea","action":"create","project":"ReMe","text":"在干净环境验证发布包"}` |

  Todo 默认 `pending`。创建时还可传下文的 Todo 字段，`progress_match` 除外。带 `source_idea` 时，省略的 `project`、`text` 继承 Idea；显式传入则使用传入值。

  ## 修改内容、状态和关联

  未传的字段保留原值。改项目只影响当前条目。修改 Idea 不会同步已有 Todo；给已有 Todo 建立或更换 Idea 关联，也不会复制项目和正文。

  | Todo 字段 | 用法 |
  | --- | --- |
  | `status` | `pending`、`in_progress`、`closed`。完成或取消用 `closed`；改为 `pending` 或 `in_progress` 可重开，保留进展并清除关闭时间和备注。 |
  | `due_date` | `YYYY-MM-DD`，传 `null` 清除。 |
  | `source_idea` | 传已有 Idea ID 建立或替换关联，传 `null` 解绑。也可用于 Todo 的 `list` 筛选，`null` 查未关联条目。 |
  | `close_note` | 非空的结果或关闭原因，传 `null` 清除。必须同时传 `status="closed"`，即使只是修改或清空已关闭 Todo 的备注。 |

  | 修改 | 完整参数 |
  | --- | --- |
  | 修改 Todo 正文 | `{"kind":"todo","action":"update","id":"t001","text":"验证 Windows 安装和启动"}` |
  | 调整 Todo 项目 | `{"kind":"todo","action":"update","id":"t001","project":"Release"}` |
  | Todo 归入随笔 | `{"kind":"todo","action":"update","id":"t001","project":""}` |
  | 修改 Idea 正文 | `{"kind":"idea","action":"update","id":"i001","text":"分别验证 macOS 和 Windows 发布包"}` |
  | 调整 Idea 项目 | `{"kind":"idea","action":"update","id":"i001","project":"Release"}` |
  | Idea 归入随笔 | `{"kind":"idea","action":"update","id":"i001","project":""}` |
  | 开始或恢复执行 | `{"kind":"todo","action":"update","id":"t001","status":"in_progress"}` |
  | 改为待开始或重开 | `{"kind":"todo","action":"update","id":"t001","status":"pending"}` |
  | 完成 Todo | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"安装和启动验证通过"}` |
  | 取消 Todo | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"主人取消了这项工作"}` |
  | 修改或补充关闭备注 | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":"macOS 和 Windows 均已验证通过"}` |
  | 清除关闭备注 | `{"kind":"todo","action":"update","id":"t001","status":"closed","close_note":null}` |
  | 设置或修改期限 | `{"kind":"todo","action":"update","id":"t001","due_date":"2026-12-01"}` |
  | 清除期限 | `{"kind":"todo","action":"update","id":"t001","due_date":null}` |
  | 建立或更换 Idea 关联 | `{"kind":"todo","action":"update","id":"t001","source_idea":"i002"}` |
  | 解除 Idea 关联 | `{"kind":"todo","action":"update","id":"t001","source_idea":null}` |

  ## 维护进展

  - `progress_text` 在 `create`、`update` 时追加一条非空进展，不能传 `null`。
  - `update` 的 `progress_match` 用 `get` 返回的原始 `time`、`text` 匹配已有进展，必须恰好命中一条；失败时重新读取后再试。
  - 有匹配对象时，传 `progress_text` 替换文字，省略它则删除该条；不传匹配对象则追加。
  - `progress_time` 必须和 `progress_text` 一起使用，非空时间须带时区。省略或传 `null` 时，新增用当前时间，替换保留原时间。只改时间时，匹配原条目并原样传回文字。

  下方匹配对象仅作示例，实际使用 `get` 返回的对象。这些请求是不同操作，不是连续执行的步骤。

  | 修改 | 完整参数 |
  | --- | --- |
  | 追加进展 | `{"kind":"todo","action":"update","id":"t001","progress_text":"安装通过，待验证启动"}` |
  | 替换进展文字 | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"安装通过，待验证启动"},"progress_text":"安装和启动均通过"}` |
  | 删除一条进展 | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"安装通过，待验证启动"}}` |
  | 修改进展时间 | `{"kind":"todo","action":"update","id":"t001","progress_match":{"time":"2026-11-24T10:15:00+08:00","text":"安装通过，待验证启动"},"progress_text":"安装通过，待验证启动","progress_time":"2026-11-24T11:00:00+08:00"}` |

  ## 归档与恢复

  没有 `delete` 操作。Todo 关闭后归档，重开后恢复；Idea 显式归档或恢复。ID 和关联保留，关联 Todo 关闭不会自动归档 Idea；建议归档 Idea 前，核对其他关联 Todo。

  | 修改 | 完整参数 |
  | --- | --- |
  | 归档 Idea | `{"kind":"idea","action":"archive","id":"i001"}` |
  | 恢复 Idea | `{"kind":"idea","action":"restore","id":"i001"}` |

  ## 后台更新

  收到后台事件时，查找所有相关 Todo、Idea，读完相关 Todo 的全部进展。自动写入可追加、更正、删除未关闭 Todo 的进展，确认已开工时可设 `status="in_progress"`；只记录新增事实或已确认的更正、撤回，同一事项有后续结果时合并原进展。优先复用合适的已有条目。其他拟修改事项使用 proactive-record 技能提醒主人决定，附已有条目（如有）、新依据和建议处理方式。
