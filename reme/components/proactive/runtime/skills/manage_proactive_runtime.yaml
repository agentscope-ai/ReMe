name: manage-proactive-runtime
description: Create, query, pause and maintain ReMe Proactive Runtimes, choosing scheduled execution or an ongoing event feed.
description_zh: 创建、查询、暂停和维护 ReMe Proactive Runtime，按需求选择定时执行或持续事件接入。
content: |
  # Manage Proactive Runtimes

  Use the `manage_proactive_runtime` MCP Job for task management. Pass parameters at the top level and use actual task names.

  ## Complete workflow

  1. Understand the goal, source, timing and reminder conditions. Use `list` to find related tasks; inspect `status` and TASK.md before deciding whether to reuse or change one.
  2. If the Agent should fetch information and work at an agreed time, create a task with `agent_type="time"` and a `schedule`. For an 08:00 briefing about yesterday's AI news, specify the previous calendar day in the application timezone in TASK.md. The Agent fetches the information when due.
  3. If a known source will keep supplying new material, create a task with `agent_type="event"` and no `schedule`. Remy completes the data feed with `manage-connector`: reuse a preset collector when possible; otherwise create a collection script that saves material and sends HTTP events. That skill contains the connector parameters, script location and examples. Background Runtimes record needed connector changes for Remy to handle. Creating a Runtime alone does not establish a working data feed.
  4. Verify the actual result. Time-triggered tasks need the correct requirements and `next_trigger_at`; event-triggered tasks need a running source, saved material and accepted events, followed by processing checks. State which parts are configured, running and verified.
  5. Maintain tasks through this Job; Remy manages downloads/recipients through `manage-connector`. The controls are independent. When stopping monitoring, check whether its collectors serve other tasks before pausing them.

  ## Parameters and task types

  | Parameter | Usage |
  | --- | --- |
  | `action`, `agent_name` | `list` accepts only `action`. Every other action requires `agent_name`. New names should use short lowercase words joined by underscores, be unique ignoring case, and avoid the reserved name `Remy`. |
  | `task_description` | Creation only: nonblank TASK.md text containing the goal, necessary context, sources, decision criteria and reminder requirements. Omit it to use the generic task default. Later edits belong in the task document. |
  | `skills` | Creation only: built-in or project skill names, defaulting to `["proactive-record"]`. Omit `proactive-record`, for example with `[]`, to run without daily record validation or record-based reminders. Select `["proactive-record","manage-notebook"]` for Notebook follow-up. Fixed after creation; omit when restoring. |
  | `job_tools` | Creation only: tools allowed by the AgentManager, empty by default. Notebook follow-up uses `["manage_notebook"]`; automatic-write restrictions come from trusted Runtime configuration. |
  | `enabled` | Boolean; defaults to `true` on creation or restoration. Use `false` to pause and `true` to resume. Task execution and collector controls are separate. |
  | `agent_type` | Required on creation and restoration: `event` or `time`. The type is fixed for the Runtime lifetime. |
  | `schedule` | Cron expression in the application timezone. Required for a new `time` task; omitted or `null` for `event`. A time-triggered task can update its expression; restoration retains an omitted schedule. |
  | `min_trigger_interval_seconds` | Nonnegative number; defaults to `0`. Minimum interval between event-processing runs, measured from the last successful completion. Use `0` to remove the interval; collector frequency is configured separately. |
  | `notify_windows` | List of application-local `{start,end}` periods in HH:MM. Defaults to `09:00–12:00` and `14:00–23:00`; `[]` means no limit. Any matching period permits reminders. Controls automatic Chat reminder processing/sending, not task execution or collection. Supports overnight windows; equal endpoints mean all day, otherwise start is inclusive and end exclusive. |
  | `question` | Nonblank question for `query` only. Queries use a read-only branch of the latest task session; if no session exists, check status and TASK.md instead. |

  Put the material time range and whether to report every occurrence in TASK.md. A task keeps its trigger type; create separate tasks if both are needed.

  ## Complete request examples

  Each row is an independent request to `manage_proactive_runtime`. `update` accepts only `enabled`, `schedule`, `min_trigger_interval_seconds` and `notify_windows`, with at least one supplied; omitted settings retain their values.

  | Operation | Complete parameters |
  | --- | --- |
  | Find tasks | `{"action":"list"}` |
  | Check status | `{"action":"status","agent_name":"experiment_watch"}` |
  | Ask about progress | `{"action":"query","agent_name":"experiment_watch","question":"What has progressed, and what still needs confirmation?"}` |
  | Create an experiment event task | `{"action":"create","agent_type":"event","agent_name":"experiment_watch","task_description":"On log updates, read the referenced files. Report error exits, NaN in key metrics or experiment completion with source links. Only record normal progress."}` |
  | Create a daily briefing | `{"action":"create","agent_type":"time","agent_name":"ai_briefing","schedule":"0 8 * * *","task_description":"At 08:00 daily, search the previous calendar day in the application timezone for important AI news. Verify original sources and send a concise briefing with links on every run."}` |
  | Create Notebook event follow-up | `{"action":"create","agent_type":"event","agent_name":"notebook_watch","skills":["proactive-record","manage-notebook"],"job_tools":["manage_notebook"],"task_description":"Track existing Todos and Ideas. Update evidence-backed progress; send decisions to Remy."}` |
  | Create a finance event task | `{"action":"create","agent_type":"event","agent_name":"market_watch","task_description":"Track XAU/USD, WTI, BTC/USDT and Nasdaq; remind on a verified absolute change of at least 3%."}` |
  | Pause a task | `{"action":"update","agent_name":"experiment_watch","enabled":false}` |
  | Resume a task | `{"action":"update","agent_name":"experiment_watch","enabled":true}` |
  | Change a time-triggered schedule | `{"action":"update","agent_name":"ai_briefing","schedule":"0 9 * * *"}` |
  | Set or change the processing interval | `{"action":"update","agent_name":"experiment_watch","min_trigger_interval_seconds":60}` |
  | Remove the processing interval | `{"action":"update","agent_name":"experiment_watch","min_trigger_interval_seconds":0}` |
  | Set or change reminder hours | `{"action":"update","agent_name":"experiment_watch","notify_windows":[{"start":"09:00","end":"12:00"},{"start":"14:00","end":"23:00"}]}` |
  | Remove reminder-hour restrictions | `{"action":"update","agent_name":"experiment_watch","notify_windows":[]}` |
  | Delete a task and retain its files | `{"action":"delete","agent_name":"experiment_watch"}` |
  | Restore a deleted task under the same name | `{"action":"create","agent_type":"event","agent_name":"experiment_watch"}` |

  ## Edit task requirements

  Read the TASK.md identified by `task_path`, merge the user's changes while retaining valid requirements, then save and reread it. `update` does not accept `task_description`.
  For the current service's `POST /task_document` API, use these requests. Replace `mtime_from_read` with the exact `mtime` from the read response, and `content` with the complete revised requirements, not an appended fragment. If the version conflicts, read again before retrying.

  | Operation | Complete task_document parameters |
  | --- | --- |
  | Read requirements | `{"action":"read","agent_name":"experiment_watch"}` |
  | Save revised requirements | `{"action":"save","agent_name":"experiment_watch","content":"On log updates, read the referenced files. Report error exits, NaN in key metrics or completion with source links and the experiment name. Only record normal progress.","expected_mtime":"mtime_from_read"}` |

  ## Verify and restore

  Check `task_path` and saved requirements after creation or editing. Runtime settings are under `config`; `running` shows current execution. Check `next_trigger_at` after schedule changes, and use pending/in-flight event counts, `last_completed_at` and `error` to assess processing.
  Deletion stops the task and retains its files. Supply the original `agent_type` when restoring. Same-name restoration preserves trigger type, skills, tool bindings, TASK.md and history; supplying a new `task_description` does not overwrite the existing file. Omitted schedules/settings are retained, except that `enabled` defaults to `true`; pass `enabled=false` to restore paused. Verify the restored requirements and edit the document if the user changed them.
  When pausing or ending monitoring, stop collectors dedicated to that task as needed; keep shared collectors running.

content_zh: |
  # 管理 Proactive Runtime

  通过 `manage_proactive_runtime` MCP Job 管理任务，参数放在同一层，使用实际任务名。

  ## 完整流程

  1. 弄清目标、资料来源、时间和提醒条件。先用 `list` 查相关任务，再看 `status` 和 TASK.md，决定复用、调整还是新建。
  2. 需要 Agent 到点取资料并完成工作时，创建 `agent_type="time"` 且带 `schedule` 的任务。例如每天 08:00 整理昨天的 AI 动态，TASK.md 写清应用时区的前一自然日，到点由任务自行检索。
  3. 来源明确、会持续产生新资料时，创建 `agent_type="event"` 且不带 `schedule` 的任务，由 Remy 使用 `manage-connector` 完成持续接入：优先复用预设采集器，没有合适的再写采集脚本，保存资料后通过 HTTP 投递事件。Connector 参数、脚本位置和例子都在该技能中。后台 Runtime 需要接入或调整 Connector 时，写清需求交给 Remy。只创建 Runtime 不代表资料已经接入。
  4. 核对实际结果：时间任务核对要求和 `next_trigger_at`；事件任务核对采集已运行、资料已保存、事件已接收，再检查处理结果。分清哪些已配置、正在运行、已经验证。
  5. 本 Job 管任务，Remy 通过 `manage-connector` 管下载和投递目标，开关分别控制。停止监控时，先看采集器是否还被其他任务使用，再决定是否暂停。

  ## 参数与任务类型

  | 参数 | 用法 |
  | --- | --- |
  | `action`、`agent_name` | `list` 只传 `action`，其他操作必须传 `agent_name`。新名称用简短小写英文单词加下划线，忽略大小写保持唯一，避开保留名 `Remy`。 |
  | `task_description` | 仅创建时使用：非空的 TASK.md 正文，写清目标、必要背景、来源、判断标准和提醒要求。省略则使用通用任务要求，后续修改写入任务文档。 |
  | `skills` | 仅创建时使用：内置或项目技能名，默认 `["proactive-record"]`。不包含 `proactive-record`（例如传 `[]`）时，不校验每日记录，也不通过记录生成提醒。Notebook 跟进选择 `["proactive-record","manage-notebook"]`。创建后固定，恢复时省略。 |
  | `job_tools` | 仅创建时使用：AgentManager 允许的工具，默认空列表。Notebook 跟进使用 `["manage_notebook"]`，自动写入限制来自可信 Runtime 配置。 |
  | `enabled` | 布尔值，创建或恢复默认 `true`。`false` 暂停，`true` 恢复。任务执行和采集开关分别管理。 |
  | `agent_type` | 创建和恢复时必填：`event` 或 `time`，Runtime 存续期间固定。 |
  | `schedule` | 使用应用时区的 Cron 表达式。新建 `time` 任务必填，`event` 任务省略或传 `null`。时间任务可修改表达式，恢复时省略则沿用原日程。 |
  | `min_trigger_interval_seconds` | 非负数，默认 `0`。事件处理轮次的最短间隔，从上次成功完成时计；传 `0` 取消间隔。采集频率单独配置。 |
  | `notify_windows` | 应用本地时间的 `{start,end}` 时段列表，格式 HH:MM；默认 `09:00–12:00`、`14:00–23:00`，`[]` 表示不限时段，命中任一时段即可提醒。只控制主对话自动处理和发送提醒，不控制任务执行或采集。可跨午夜；起止相同表示全天，否则含起点、不含终点。 |
  | `question` | 仅 `query` 使用的非空问题。通过最新任务会话的只读分支询问；尚无会话时，查看状态和 TASK.md。 |

  资料时间范围、是否每轮汇报写在 TASK.md。任务触发类型固定，两种触发都需要时分别建任务。

  ## 完整请求示例

  每行都是独立的 `manage_proactive_runtime` 请求。`update` 只接受 `enabled`、`schedule`、`min_trigger_interval_seconds`、`notify_windows`，至少传一个，未传的设置保留。

  | 操作 | 完整参数 |
  | --- | --- |
  | 查找任务 | `{"action":"list"}` |
  | 查看状态 | `{"action":"status","agent_name":"experiment_watch"}` |
  | 询问进展 | `{"action":"query","agent_name":"experiment_watch","question":"有什么进展，还有哪些事项需要确认？"}` |
  | 创建实验事件任务 | `{"action":"create","agent_type":"event","agent_name":"experiment_watch","task_description":"日志更新时读取事件引用的文件。发生错误退出、关键指标 NaN 或实验完成时提醒，附来源链接；正常进展只记录。"}` |
  | 创建每日早报 | `{"action":"create","agent_type":"time","agent_name":"ai_briefing","schedule":"0 8 * * *","task_description":"每天 08:00 检索应用时区前一自然日的重要 AI 新闻，核实原始来源，每轮发送简洁早报并附链接。"}` |
  | 创建 Notebook 事件跟进 | `{"action":"create","agent_type":"event","agent_name":"notebook_watch","skills":["proactive-record","manage-notebook"],"job_tools":["manage_notebook"],"task_description":"跟进已有 Todo 和 Idea，更新有依据的进展，将需要决定的事项交给 Remy。"}` |
  | 创建金融事件任务 | `{"action":"create","agent_type":"event","agent_name":"market_watch","task_description":"关注黄金、WTI 原油、BTC/USDT 和纳指，核实涨跌幅绝对值达到 3% 时提醒。"}` |
  | 暂停任务 | `{"action":"update","agent_name":"experiment_watch","enabled":false}` |
  | 恢复任务 | `{"action":"update","agent_name":"experiment_watch","enabled":true}` |
  | 修改时间触发日程 | `{"action":"update","agent_name":"ai_briefing","schedule":"0 9 * * *"}` |
  | 设置或修改处理间隔 | `{"action":"update","agent_name":"experiment_watch","min_trigger_interval_seconds":60}` |
  | 取消处理间隔 | `{"action":"update","agent_name":"experiment_watch","min_trigger_interval_seconds":0}` |
  | 设置或修改提醒时段 | `{"action":"update","agent_name":"experiment_watch","notify_windows":[{"start":"09:00","end":"12:00"},{"start":"14:00","end":"23:00"}]}` |
  | 取消提醒时段限制 | `{"action":"update","agent_name":"experiment_watch","notify_windows":[]}` |
  | 删除任务并保留文件 | `{"action":"delete","agent_name":"experiment_watch"}` |
  | 同名恢复已删除任务 | `{"action":"create","agent_type":"event","agent_name":"experiment_watch"}` |

  ## 修改任务要求

  读取 `task_path` 指向的 TASK.md，保留有效要求，合并主人修改后保存并重读。`update` 不接受 `task_description`。
  使用当前服务的 `POST /task_document` 接口时，按下表调用。`mtime_from_read` 换成读取返回的原始 `mtime`，`content` 换成修改后的完整要求，不是追加片段。版本冲突时重新读取后再改。

  | 操作 | 完整 task_document 参数 |
  | --- | --- |
  | 读取要求 | `{"action":"read","agent_name":"experiment_watch"}` |
  | 保存新要求 | `{"action":"save","agent_name":"experiment_watch","content":"日志更新时读取事件引用的文件。发生错误退出、关键指标 NaN 或实验完成时提醒，附来源链接和实验名称；正常进展只记录。","expected_mtime":"mtime_from_read"}` |

  ## 核对与恢复

  创建或改文档后核对 `task_path` 和实际要求。运行设置在 `config`，`running` 表示正在执行。改日程后核对 `next_trigger_at`，结合待处理/处理中事件数、`last_completed_at`、`error` 判断处理情况。
  删除会停止任务并保留文件。恢复时传原来的 `agent_type`。同名恢复沿用触发类型、skills、工具绑定、TASK.md 和历史；新传 `task_description` 不会覆盖已有文件。省略的日程和设置沿用，只有 `enabled` 默认恢复为 `true`，需要暂停恢复时传 `enabled=false`。主人改了要求时，恢复后核对并修改任务文档。
  暂停或结束监控时，按需停止该任务独占的采集器，保留仍被其他任务使用的采集器。
