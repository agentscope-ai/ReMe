[project]
name = "reme-procedure-memory"
version = "0.1.0"
description = "File-native procedural memory for ReMe."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["reme-ai>=0.4.2.0"]

[project.entry-points."reme.plugins"]
procedure-memory = "reme_procedure_memory"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["reme_procedure_memory"]
include-package-data = true

[tool.setuptools.package-data]
reme_procedure_memory = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
