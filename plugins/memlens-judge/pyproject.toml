[project]
name = "reme-memlens-judge"
version = "0.1.0"
description = "Official memlens judge protocol as a ReMe plugin."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["reme-ai[as]>=0.4.1.11"]

[project.entry-points."reme.plugins"]
memlens-judge = "judge_memlens"

[tool.setuptools.packages.find]
where = ["src"]
include = ["judge_memlens*"]

[tool.setuptools.package-data]
judge_memlens = ["plugin.yaml", "*.json"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
