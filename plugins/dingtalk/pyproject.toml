[project]
name = "reme-dingtalk"
version = "0.1.0"
description = "DingTalk notification and agent bridge plugin for ReMe."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "dingtalk-stream>=0.24.3",
    "reme-ai>=0.4.1.12",
]

[project.entry-points."reme.plugins"]
dingtalk = "reme_dingtalk"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["reme_dingtalk"]
include-package-data = true

[tool.setuptools.package-data]
reme_dingtalk = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
