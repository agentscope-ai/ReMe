[project]
name = "reme-memlens"
version = "0.1.0"
description = "MemLens multimodal memory benchmark plugin for ReMe."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["reme-ai[as]>=0.4.1.11", "pillow>=10.0.0"]

[project.entry-points."reme.plugins"]
memlens = "reme_memlens"

[project.entry-points."reme.configs"]
memlens-benchmark = "reme_memlens:BENCHMARK_CONFIG"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reme_memlens*"]

[tool.setuptools.package-data]
reme_memlens = ["plugin.yaml", "*.yaml"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
