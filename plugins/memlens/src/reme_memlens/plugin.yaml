backends:
  memlens_auto_memory_step: reme_memlens.auto_memory:MemLensAutoMemoryStep
  memlens_agentic_answer_step: reme_memlens.agentic_answer:MemLensAgenticAnswerStep

application_defaults:
  jobs:
    read_image:
      backend: base
      description: "Read a saved session image through the native ReMe image Job."
      parameters:
        type: object
        properties:
          path: {type: string, description: "Workspace-relative image attachment path."}
        required: [path]
      steps:
        - backend: read_image_step
          max_bytes: 52428800
    auto_memory:
      backend: base
      description: "Record one MemLens session using native Auto Memory."
      include_source_sessions: true
      parameters:
        type: object
        properties:
          messages:
            type: array
            items: {type: object}
          session_id: {type: string}
          date: {type: string, default: ""}
          include_images: {type: boolean, default: false}
          include_source_sessions: {type: boolean, default: true}
          memory_hint: {type: string, default: ""}
        required: [messages, session_id]
      steps:
        - backend: memlens_auto_memory_step
    search:
      backend: base
      description: "Search this scene's allowed memory and source text using BM25."
      parameters:
        type: object
        properties:
          query: {type: string}
          limit: {type: integer, description: "Number of search results."}
          start_date: {type: string}
          end_date: {type: string}
        required: [query]
      steps:
        - backend: search_step
          vector_weight: 0.0
          expand_links: false
    agentic_answer:
      backend: base
      description: "Answer a MemLens query through a fresh multimodal retrieval Agent."
      include_source_sessions: true
      parameters:
        type: object
        properties:
          query: {type: string, description: "Official benchmark answer prompt including the query."}
          query_time: {type: string, default: ""}
          query_images:
            type: array
            items: {type: object}
            default: []
          scene_id: {type: string}
          max_iters: {type: integer, minimum: 1, default: 30, description: "Maximum answer Agent ReAct iterations."}
          include_images: {type: boolean, default: false}
          include_source_sessions: {type: boolean, default: true}
        required: [query, scene_id]
      steps:
        - backend: memlens_agentic_answer_step
          agent_wrapper: bench
  components:
    file_store:
      default:
        embedding_store: null
