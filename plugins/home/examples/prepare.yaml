benchmark:
  name: beam
  variant: 100K
  source: /data/BEAM
  case_ids: ["1", "3", "8"]
  # For an explicit full selection, remove case_ids and set all_cases: true.
runtime:
  source_repo: /projects/ReMe
  source_ref: HEAD  # Resolved once to a full commit SHA; uncommitted edits are excluded.
  config: benchmark.yaml
  plugins: [beam]
candidate:
  paths: [plugins/beam/src]
debug:
  enabled: true
  sessions_per_case: 3
  messages_per_session: 6
