[project]
name = "reme-home"
version = "0.1.0"
description = "Local command execution jobs for ReMe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reme-ai[as]>=0.4.2.1",
    "safecmd>=0.1.16,<0.2",
]

[project.entry-points."reme.plugins"]
home = "reme_home"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reme_home*"]

[tool.setuptools.package-data]
reme_home = ["plugin.yaml"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
