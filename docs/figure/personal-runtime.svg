<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1140" viewBox="0 0 1780 1140" role="img" aria-labelledby="title desc"><title id="title">Personal Runtime — Chat, Reminder Fork, Inbox and Shared Files</title><desc id="desc">The Chat Agent and its temporary Reminder Agent fork are grouped together. Chat handles queries and uses a skill to manage proactive tasks. A fork inherits current Chat context, reads the eligible Inbox batch, assesses it and appends only the chosen assistant reminder to the main conversation through send_chat_msg, or stays quiet. Finance, work and illustrative life runtimes write reminder files which their Outbox delivers as references into the Chat Inbox. The Chat skill manages these background task identities; the read-only offline Reminder fork only reads Inbox items and submits a decision. All three areas use user-owned Workspace files. The Inbox stores references and consumption receipts; each Agent owns its memory and task records.</desc><metadata>Source: reme/config/proactive.yaml; reme/components/agent_inbox/; reme/components/agent_runtime/local_agent_runtime.py; reme/components/agent_runtime/_internal/outbox.py; reme/components/agent_runtime/_internal/notifications.py; reme/steps/proactive/agent/. Drawn from the current working tree. Paths are workspace-relative examples.</metadata>
