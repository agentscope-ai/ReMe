    </marker>
    <marker id="light" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1 1L6 3.5L1 6" fill="none" stroke="#91BCBF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
