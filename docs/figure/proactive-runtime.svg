<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1020" viewBox="0 0 1780 1020" role="img" aria-labelledby="title desc">
  <title id="title">Proactive Runtime</title>
  <desc id="desc">A work example connects Codex dialogue, Claude Code trajectories submitted through the event API, and screenshots to an Event Inbox. The built-in collector gathers new Codex dialogue and screenshots every five minutes; Claude Code is an illustrative external source. Pending events are claimed oldest first and acknowledged after saving. A timeline alternates Sleep periods with short Run slices, with one run expanded below. Between runs the Agent waits without continuously calling the model; segment lengths are illustrative. A run digests inputs, reasons about progress and decides whether to remind. Five curved arrows connect the run directly to five workspace file cards: read source files, read and update task memory, read and refresh the daily summary, save round details, and check or write reminders. Task memory updates use agent_memory; historical details and recent reminders are read as needed. The Outbox combines the priority legend with P0, P1, P2 and Quiet examples in a single panel. Quiet creates no reminder. Only committed reminders are published through the Outbox to the Chat Agent Inbox for assessment. File cards show complete example paths under the configured workspace root, wrapped across lines.</desc>
  <metadata>Source: reme/config/proactive.yaml; reme/schema/application_config.py; reme/steps/proactive/data_connectors/work_observation.py; reme/steps/proactive/data_connectors/screen_capture.py; reme/steps/proactive/agent/proactive.py; reme/components/agent_runtime/_internal/registry.py; reme/components/agent_runtime/_internal/sessions.py; reme/components/agent_inbox/agent_event_inbox.py; reme/components/agent_runtime/_internal/outbox.py. Drawn from the current working tree. Claude Code is an illustrative external event source, not a built-in collector. Full paths use workspace/ as the configured workspace root. All events and decisions are illustrative.</metadata>
