<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1098" viewBox="0 0 1360 1098" role="img" aria-labelledby="title desc">
  <title id="title">ReMe5 Proactive Runtime plan</title>
  <desc id="desc">The Chat Agent uses the manage-proactive-runtime skill to create and manage tasks. Proactive Runtime returns progress and reminders to chat. The predefined tasks include five event-triggered presets, Work with Auto Memory, Finance, Research, Todo, and Daily Summary, and three independent time-triggered Auto Dream presets for personal memory, procedural memory, and wiki knowledge. Users can create custom agents with either trigger. The planned execution backends are AgentScope, Codex, and Claude Code. The plan includes a macOS and Windows desktop preview and host integrations with QwenPaw, Codex, Claude Code, Hermes Agent, and OpenClaw.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #22383F; }
      .title { font-size: 38px; font-weight: 700; }
      .heading { font-size: 29px; font-weight: 700; }
      .card-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; }
      .preset-name { font-size: 22px; font-weight: 650; }
      .preset-copy { font-size: 18px; fill: #526970; }
      .label { font-size: 19px; font-weight: 650; }
      .skill { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 16px; }
      .trigger { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .preset-card { fill: #FFFFFF; stroke: #D5E3E3; }
      .event-bg { fill: #EBF5F4; }
      .cron-bg { fill: #F2EDF8; }
      .muted { fill: #526970; }
      .teal { fill: #146F72; }
      .purple { fill: #6F509B; }
      .light { fill: #FFFFFF; }
      .light-muted { fill: #C9DFE1; }
      .arrow { fill: none; stroke: #607C82; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#607C82" stroke-width="1.4" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1360" height="1098" rx="18" fill="#F8FAFA" />
  <text x="40" y="61" class="title">ReMe5 Proactive Runtime plan</text>

  <rect x="40" y="92" width="1280" height="94" rx="14" fill="#193C45" />
  <text x="68" y="131" class="heading light">Chat Agent</text>
  <text x="68" y="161" class="body light-muted">The conversation where you delegate work and ask about progress</text>

  <path d="M344 186v55" class="arrow" />
  <text x="326" y="209" class="skill muted" text-anchor="end">manage-proactive-runtime skill</text>
  <text x="326" y="232" class="label teal" text-anchor="end">Create &amp; manage tasks</text>
  <path d="M944 248v-55" class="arrow" />
  <text x="962" y="224" class="label purple">Progress &amp; reminders</text>

  <rect x="40" y="248" width="1280" height="657" rx="14" fill="#FFFFFF" stroke="#D5E3E3" />
  <text x="68" y="290" class="heading">Proactive Runtime</text>
  <text x="1292" y="289" class="body muted" text-anchor="end">Triggers · task coordination · workspace memory</text>

  <rect x="68" y="314" width="842" height="514" rx="12" fill="#F1F5F6" />
  <text x="88" y="346" class="card-title">Predefined agents and workflows</text>

  <g class="preset" transform="translate(88 361)">
    <rect class="preset-card" width="395" height="104" rx="8" />
    <rect x="16" y="12" width="114" height="25" rx="6" class="event-bg" />
    <text x="73" y="30" class="trigger teal">Event-triggered</text>
    <text x="16" y="61" class="preset-name">Work</text>
    <text x="16" y="87" class="preset-copy">Includes Auto Memory · Follows logs</text>
  </g>
  <g class="preset" transform="translate(495 361)">
    <rect class="preset-card" width="395" height="104" rx="8" />
    <rect x="16" y="12" width="114" height="25" rx="6" class="event-bg" />
    <text x="73" y="30" class="trigger teal">Event-triggered</text>
    <text x="16" y="61" class="preset-name">Finance</text>
