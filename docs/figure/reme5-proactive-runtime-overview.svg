  <rect x="950" y="361" width="322" height="112" rx="8" class="preset-card" />
  <text x="968" y="397" class="preset-name teal">Observations</text>
  <text x="968" y="429" class="preset-copy">Choose a connected source.</text>
  <text x="968" y="452" class="preset-copy">Run when a new event arrives.</text>

  <rect x="950" y="488" width="322" height="112" rx="8" class="preset-card" />
  <text x="968" y="524" class="preset-name purple">Optional schedule</text>
  <text x="968" y="556" class="preset-copy">Choose a time and frequency.</text>
  <text x="968" y="579" class="preset-copy">Triggers join the same inbox.</text>

  <path d="M950 632h322" fill="none" stroke="#D5E3E3" />
  <text x="950" y="670" class="label">Task instructions and reminders</text>
  <text x="950" y="702" class="preset-copy">Tell the Chat Agent what to do</text>
  <text x="950" y="727" class="preset-copy">and when to notify you.</text>

  <path d="M68 844h1224" fill="none" stroke="#DDE8E8" />
  <text x="68" y="882" class="label teal">Execution backends</text>
  <text x="302" y="882" class="body">AgentScope · Codex · Claude Code</text>

  <path d="M260 905v46" class="arrow" />
  <path d="M912 912v39" class="arrow" marker-start="url(#arrow)" />

  <rect x="40" y="958" width="440" height="104" rx="12" fill="#EBF5F4" stroke="#D5E3E3" />
  <text x="64" y="1000" class="card-title teal">ReMe Desktop</text>
  <text x="64" y="1031" class="body">macOS and Windows preview</text>

  <rect x="504" y="958" width="816" height="104" rx="12" fill="#FFFFFF" stroke="#D5E3E3" />
