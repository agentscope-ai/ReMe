    <text x="16" y="87" class="preset-copy">Auto Dream · Preferences, goals, and context</text>
  </g>
  <g class="preset" transform="translate(88 591)">
    <rect class="preset-card" width="395" height="104" rx="8" />
    <rect x="16" y="12" width="114" height="25" rx="6" class="cron-bg" />
    <text x="73" y="30" class="trigger purple">Time-triggered</text>
    <text x="16" y="61" class="preset-name">Consolidate Procedural Memory</text>
    <text x="16" y="87" class="preset-copy">Auto Dream · Workflows and lessons</text>
  </g>
  <g class="preset" transform="translate(495 591)">
