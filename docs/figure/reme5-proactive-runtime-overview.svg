    <rect x="16" y="12" width="114" height="25" rx="6" class="cron-bg" />
    <text x="73" y="30" class="trigger purple">Time-triggered</text>
    <text x="16" y="61" class="preset-name">Consolidate Wiki Knowledge</text>
    <text x="16" y="87" class="preset-copy">Auto Dream · Source-linked knowledge</text>
  </g>
  <g class="preset" transform="translate(88 706)">
    <rect class="preset-card" width="395" height="104" rx="8" />
    <rect x="16" y="12" width="114" height="25" rx="6" class="event-bg" />
    <text x="73" y="30" class="trigger teal">Event-triggered</text>
    <text x="16" y="61" class="preset-name">Todo</text>
    <text x="16" y="87" class="preset-copy">Captures follow-ups from incoming events</text>
  </g>
  <g class="preset" transform="translate(495 706)">
    <rect class="preset-card" width="395" height="104" rx="8" />
    <rect x="16" y="12" width="114" height="25" rx="6" class="event-bg" />
    <text x="73" y="30" class="trigger teal">Event-triggered</text>
    <text x="16" y="61" class="preset-name">Daily Summary</text>
    <text x="16" y="87" class="preset-copy">Updates the day’s summary as events arrive</text>
