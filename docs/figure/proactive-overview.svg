<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100" role="img" aria-labelledby="title desc">
<title id="title">ReMe Proactive：从输入到提醒</title><desc id="desc">采集观察或定时调度将输入送入各任务的文件 Inbox。后台串行领取一批事件，在任务会话中读取和更新记忆，并由 Harness 控制工具权限。已提交提醒由 Outbox 投递到 Chat Inbox，临时 Reminder 分支选择是否发送给用户。用户在 Chat 中更新对应任务记忆或配置，影响后续轮次。</desc>
<metadata>ReMe working-tree implementation: reme/steps/proactive/agent/; reme/components/agent_runtime/; reme/components/agent_inbox/; reme/config/proactive.yaml. File paths are workspace-relative. Records and durations are illustrative.</metadata>
