<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="870" viewBox="0 0 1720 870" role="img" aria-labelledby="title desc">
<title id="title">文件记忆：让下一轮接得上</title><desc id="desc">每轮读取完整任务 MEMORY.md 与上次有效的 daily 摘要，读取本轮引用的原始资源。历史日记按需查阅，准备提醒时读取近期提醒。运行过程中通过受控记忆工具和文件工具更新记忆、详情和进度，框架维护提醒确认状态。</desc>
<metadata>ReMe working-tree implementation: reme/steps/proactive/agent/; reme/components/agent_runtime/; reme/components/agent_inbox/; reme/config/proactive.yaml. File paths are workspace-relative. Records and durations are illustrative.</metadata>
