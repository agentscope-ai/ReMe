<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">事件收件箱：先收好，再处理</title><desc id="desc">观察事件或框架生成的定时事件按任务触发类型进入各自的文件收件箱。同一 Agent 串行领取一批输入，执行成功并保存结果后确认消费。相同事件 ID 用于去重，失败保留输入。</desc>
<metadata>ReMe working-tree implementation: reme/steps/proactive/agent/; reme/components/agent_runtime/; reme/components/agent_inbox/; reme/config/proactive.yaml. File paths are workspace-relative. Records and durations are illustrative.</metadata>
