<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="990" viewBox="0 0 1720 990" role="img" aria-labelledby="title desc">
<title id="title">提醒投递：先保存，再告诉用户</title><desc id="desc">一轮执行可以只更新记录，或写出带优先级的提醒 Markdown。框架校验、保存正式提醒并确认输入完成后，Outbox 投递引用到 Chat Inbox。临时只读、离线的 Reminder fork 根据当前对话判断发送还是静默。没有延迟工具审批或直达用户的自动发送路径。</desc>
<metadata>ReMe working-tree implementation: reme/steps/proactive/agent/; reme/components/agent_runtime/; reme/components/agent_inbox/; reme/config/proactive.yaml. File paths are workspace-relative. Records and durations are illustrative.</metadata>
