<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1140" viewBox="0 0 1780 1140" role="img" aria-labelledby="title desc">
<title id="title">Single Proactive Runtime — Finance</title>
<desc id="desc">Three separate sources — CLS news, HK/US stock quotes and BTC spot quotes — save raw files and independently append observations into the finance Agent event inbox. The inbox is drawn as abstract event cards along a time axis, with an open continuation showing ongoing arrivals rather than event contents. The run reconstructs context by reading task memory, the prior daily summary, event source files, relevant history and recent reminders. It writes daily summaries, round details and optional reminder Markdown. Memory and Files denotes durable storage; Context Reconstruction denotes the Agent reading current files each round. Only successfully committed reminders are published by the Outbox to the Chat Agent Inbox. All inboxes now use reme_agents/{agent}/inbox/inbox_unread.jsonl and inbox_read.jsonl. A finance run may record results without sending a reminder.</desc>
<metadata>Source: reme/config/proactive.yaml; reme/components/agent_inbox/; reme/components/agent_runtime/local_agent_runtime.py; reme/components/agent_runtime/_internal/outbox.py; reme/components/agent_runtime/_internal/notifications.py; reme/steps/proactive/agent/. Drawn from the current working tree. Paths are workspace-relative examples.</metadata>
