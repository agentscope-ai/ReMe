<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">HoMe 如何提高优化与评测效率</title>
  <desc id="desc">候选先经过冒烟测试和早期机制准入检查，再通过历史表现选择案例与问题。构建等价时以一定概率恢复祖先记忆，否则重新构建，之后并行执行查询与评分。实验记录支持下一轮诊断与最终选择，抽样总分不直接用于候选排名。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfcff"/><stop offset="1" stop-color="#f3f7f8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#c9d3df" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#24344c" flood-opacity=".06"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24334a}
      .title{font-size:32px;font-weight:750;letter-spacing:-.5px}.head{font-size:23px;font-weight:700}.body{font-size:19px}
      .small{font-size:17px;fill:#63748b}.panel{fill:#fff;stroke:#e1e7f0;stroke-width:1.2;filter:url(#shadow)}
      .line{fill:none;stroke:#8898ae;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#8898ae"/></marker>
  </defs>
  <rect width="1200" height="850" rx="24" fill="url(#canvas)"/>
  <rect width="1200" height="850" rx="24" fill="url(#dots)"/>
  <text class="title" x="45" y="55">高效评测：筛选候选、自适应抽样与记忆复用</text>
  <rect x="40" y="100" width="500" height="165" rx="18" fill="#fff7ec" stroke="#edddc5" filter="url(#shadow)"/>
  <circle cx="80" cy="131" r="19" fill="#f5e8d3"/>
  <text x="80" y="137" text-anchor="middle" style="font-size:18px;font-weight:750;fill:#b98437">1</text>
  <text class="head" x="114" y="139">筛选已提交的候选</text>
  <text class="body" x="65" y="179">冒烟测试：少量真实会话与问题，检查运行</text>
  <text class="body" x="65" y="212">前半程：优先实际机制变化与必要修复</text>
  <text class="small" x="65" y="244">未通过 → 返回原因，继续修改</text>
  <path class="line" d="M546 182H634"/>
  <rect x="640" y="100" width="520" height="165" rx="18" fill="#f0f2fd" stroke="#d5dcf3" filter="url(#shadow)"/>
  <circle cx="680" cy="131" r="19" fill="#e0e6fb"/>
  <text x="680" y="137" text-anchor="middle" style="font-size:18px;font-weight:750;fill:#6678cf">2</text>
  <text class="head" x="714" y="139">自适应选择案例与问题</text>
  <text class="body" x="665" y="179">关注历史错误、久未检查与较少观察的样本</text>
  <text class="body" x="665" y="212">先选案例，再按问题预算选择查询</text>
  <text class="small" x="665" y="244">保留随机探索，检查成功样本是否退步</text>
  <path class="line" d="M900 271V324"/>
  <rect class="panel" x="40" y="330" width="1120" height="255" rx="18"/>
  <circle cx="80" cy="363" r="19" fill="#e0e6fb"/>
  <text x="80" y="369" text-anchor="middle" style="font-size:18px;font-weight:750;fill:#6678cf">3</text>
  <text class="head" x="114" y="371">对照已评测祖先，检查构建过程是否等价</text>
  <text class="small" x="65" y="405">追踪代码、提示词与配置的构建路径；不能确认等价时，重新构建</text>
  <rect x="65" y="438" width="500" height="118" rx="12" fill="#e4f3eb" stroke="#c4e2d3"/>
  <rect x="635" y="438" width="500" height="118" rx="12" fill="#f3f5fa" stroke="#e0e6ef"/>
  <text class="head" x="90" y="475">构建等价，以一定概率复用</text>
  <text class="body" x="90" y="509">恢复祖先版本已构建的记忆</text>
  <text class="small" x="90" y="539">保留复用来源与版本关联</text>
  <text class="head" x="660" y="475">构建有变化，或本轮不复用</text>
  <text class="body" x="660" y="509">处理原始会话，重新构建记忆</text>
  <text class="small" x="660" y="539">保存新的逐会话记忆历史</text>
  <path class="line" d="M315 562V629"/>
  <path class="line" d="M885 562V629"/>
  <rect x="40" y="635" width="1120" height="170" rx="18" fill="#eef8f4" stroke="#cce5da" filter="url(#shadow)"/>
  <circle cx="80" cy="668" r="19" fill="#d9eee4"/>
  <text x="80" y="674" text-anchor="middle" style="font-size:18px;font-weight:750;fill:#36876d">4</text>
  <text class="head" x="114" y="676">并行执行检索、回答与评分，记录证据</text>
  <text class="body" x="65" y="716">保存得分、查询 token、执行轨迹 → 更新优化历史 → 下一轮诊断 / 最终选择</text>
  <path d="M65 733H1135" stroke="#d2e7de"/>
  <text class="small" x="65" y="761">比较候选时，结合共同案例与问题、覆盖范围、难度和退步；抽样总分不能直接排名。</text>
  <text class="small" x="65" y="790">候选准入、抽样与记忆复用由 Experiment Manager 组织，运行由 Evaluation Environment 完成。</text>
</svg>
