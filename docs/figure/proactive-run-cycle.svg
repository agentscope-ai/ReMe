<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Proactive 怎样持续运行</title><desc id="desc">任务通常在等待。事件或定时触发到来后，领取输入、恢复会话并读取记忆、分析处理、保存本轮结果，再等待下一次触发。工作区文件在各轮之间保留。</desc>
<metadata>ReMe working-tree implementation: reme/steps/proactive/agent/; reme/components/agent_runtime/; reme/components/agent_inbox/; reme/config/proactive.yaml. File paths are workspace-relative. Records and durations are illustrative.</metadata>
