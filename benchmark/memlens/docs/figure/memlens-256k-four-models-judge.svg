    .model { font-size: 24px; font-weight: 650; }
    .label { font-size: 18px; }
    .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .highlight { fill: #2563eb; font-weight: 700; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3 5; }
    .baseline { fill: #cbd5e1; }
    .reme { fill: #2563eb; }
  </style>
