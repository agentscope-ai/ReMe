<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">MemLens-256K: four models, five methods</title>
  <desc id="desc">Binary LLM-Judge accuracy on the fixed 189-question set. All methods are compared within each model; remaining missing results count as zero. ReMe Image scores 53.44%, 72.49%, 62.96% and 61.90% for Qwen3.6-35B-A3B, Qwen3.8-Max, kimi-k3 and deepseek-v4.1-flash.</desc>
