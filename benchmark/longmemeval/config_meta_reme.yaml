# Meta-ReMe preparation configuration for LongMemEval.
meta_workspace: "benchmark/longmemeval/meta-workspace"

dataset:
  name: "longmemeval"
  source: "benchmark/longmemeval/dataset/longmemeval_s_reme_cleaned.json"
  train_case_ids:  # empty = all cases; or a list of question IDs
    - "2a1811e2"
    - "681a1674"
    - "6d550036"
    - "e66b632c"
    - "0a995998"
    - "35a27287"
    - "19b5f2b3_abs"
    - "a2f3aa27"
    - "gpt4_0b2f1d21"
    - "gpt4_59c863d7"
    - "09ba9854"
    - "830ce83f"
    - "gpt4_59149c78"
    - "32260d93"
    - "95228167"
    - "8c18457d"
    - "gpt4_85da3956"
    - "3a704032"
    - "d851d5ba"
    - "7024f17c"
    - "gpt4_7f6b06db"
    - "9ee3ecd6"
    - "0edc2aef"
    - "eeda8a6d_abs"
    - "852ce960"
    - "38146c39"
    - "gpt4_2655b836"

validation:
  concurrency: 5
  fail_fast: false  # true stops all cases after the first construction or query error

search:
  enabled: true
  max_agent_iters: 80
  max_code_iterations: 5
  objective: >-
    Search for a better ReMe implementation on the installed LongMemEval search
    cases. Preserve every evaluated commit and compare candidates on identical
    case coverage.
