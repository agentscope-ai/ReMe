[project]
name = "reme-ai"
dynamic = ["version"]
description = "Remember Me, Refine Me."
readme = "README.md"
authors = [
    { name = "EconML team of Alibaba Tongyi Lab", email = "jinli.yl@alibaba-inc.com" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["llm", "memory", "agent", "agentscope", "ai", "mcp", "reme"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiofiles>=25.1.0",
    "croniter>=6.2.4",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4,<5",
    "httpx[socks]>=0.28.1",
    "loguru>=0.7.3",
    "mcp>=2.3.0,<3",
    "mistletoe>=1.6.0",
    "numpy>=2.4.6; python_version < '3.12'",
    "numpy>=2.5.4; python_version >= '3.12'",
    "openai>=3.40.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
as = [
    "agentscope[model-ollama]==2.0.11",
]
decision = [
    "agentscope[classifier-jev]==2.0.11",
]
web = [
    "reme_studio",
]
core = [
    "reme-ai[as]",
    "pillow>=13.0.0",
    "claude-agent-sdk>=0.2.174",
    "openai-codex>=0.163.0",
    "pproxy>=2.7.9,<3",
    "faiss-cpu>=1.15.1",
    "zvec>=0.8.0",
    "jieba>=0.42.1",
    "rjieba>=0.2.2",
    "neo4j>=6.4.1",
    "networkx>=3.6.1; python_version < '3.12'",
    "networkx>=3.6; python_full_version == '3.14.1'",
    "networkx>=3.7; python_version >= '3.12' and python_full_version != '3.14.1'",
    "polars>=2.1.0",
    "reme_studio",
]
qwen-tokenizer = [
    "tokenizers>=0.23.3,<1",
]
image-heif = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]
dev = [
    "packaging>=26.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
benchmark-docker = [
    "reme-ai[as]",
    "aiodocker>=0.27.0",
]
full = [
    "reme-ai[core]",
    "reme-ai[qwen-tokenizer]",
    "reme-ai[decision]",
    "reme-ai[dev]",
    "reme-ai[image-heif]",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/ReMe"
Documentation = "https://reme.agentscope.io"
Repository = "https://github.com/agentscope-ai/ReMe"

[project.scripts]
reme = "reme.reme:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["reme", "reme.*", "deploy", "deploy.*"], exclude = ["reme_studio*"] } }
include-package-data = true

[tool.setuptools.package-data]
"*" = ["py.typed", "**/*.yaml", "**/*.json"]
"reme.components.tokenizer" = ["stopwords"]
"deploy.benchmark_docker" = ["Dockerfile.*", "README.md"]

[tool.setuptools.dynamic]
version = { attr = "reme.__version__" }

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
